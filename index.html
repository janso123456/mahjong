function hostSeatIndex() { return role === 'host' ? mySeat() : (S.hostSeat !== undefined ? S.hostSeat : 0); }

function gameHTML() {
  const v = viewSeat(), me = mySeat();
  const d = MJ.dealerOf(S);
  const rel = (i) => (v + i) % 4;
  const doraInd = MJ.doraIndicators(S);
  const turnSeat = S.phase === 'turn' ? S.turn : -1;
  const wind = (s) => WN[MJ.seatWind(S, s) - 27];
  const ranks = ranksOf(S.scores);

  // 名札：頭文字のアイコン・名前・風・点数
  const plate = (s, pos) => {
    const st = S.seats[s], p = S.players[s];
    const nm = nameOf(s);
    const off = st.uid && st.uid !== myPid && role !== 'local' && !st.online;
    const tags = (p.riichi ? '<span class="tag">リーチ</span>' : '') +
      (st.bot && st.uid ? '<span class="tag cpu">代打ち</span>' : '') + (off ? '<span class="tag cpu">切断中</span>' : '');
    return `<div class="plate pl-${pos} ${turnSeat === s ? 'turn' : ''}">
      ${avatarHTML(seatAvatar(s), nm, (s * 83 + 200) % 360)}
      <div class="pinfo"><span class="pn">${rankTag(ranks[s])}${esc(nm)}</span>
      <span class="ps"><b class="${s === d ? 'dealer' : ''}">${wind(s)}</b>${S.scores[s].toLocaleString()}</span>${tags ? `<span class="ptags">${tags}</span>` : ''}</div></div>`;
  };
  // 相手の手牌（裏向き）と鳴いた牌
  const opp = (s, pos) => {
    const p = S.players[s];
    const backs = '<span class="bk"></span>'.repeat(p.hand.length);
    return `<div class="oh oh-${pos}"><div class="bks">${backs}</div><div class="omelds">${p.melds.map((m) => meldHTML(m, s)).join('')}</div></div>`;
  };
  const side = (i) => {
    const s = rel(i);
    return `<div class="cs cs${i} ${turnSeat === s ? 'turn' : ''}"><b class="${s === d ? 'dealer' : ''}">${wind(s)}</b><span>${S.scores[s]}</span>${S.players[s].riichi ? '<i class="stick"></i>' : ''}</div>`;
  };
  const dora = [0, 1, 2, 3, 4].map((i) => tile(i < doraInd.length ? doraInd[i] : null, 'sm')).join('');
  const netDot = role === 'local' ? '' : `<span class="net"><span class="dot ${net === 'ok' ? '' : 'off'}"></span>${net === 'ok' ? '部屋 ' + esc(code) : '再接続中'}</span>`;
  const toggles = [['win', '和', '自動和了'], ['nocall', '鳴', '鳴きなし'], ['giri', '切', 'ツモ切り']].map(([k, ch, label]) =>
    `<button class="tg ${auto[k] ? 'on' : ''}" data-act="auto" data-k="${k}" aria-pressed="${auto[k]}" title="${label}"><b>${ch}</b><span>${label}</span></button>`).join('');

  return `<div class="tbl">
    <div class="plane"><div class="stage"><div class="pc">
      <div class="cbox">${side(0)}${side(1)}${side(2)}${side(3)}
        <div class="cmid"><div class="crd">${MJ.roundLabel(S)}</div><div class="crest">残 ${S.wall.length}</div></div></div>
      <div class="rv rv0">${riverHTML(rel(0))}</div><div class="rv rv1">${riverHTML(rel(1))}</div>
      <div class="rv rv2">${riverHTML(rel(2))}</div><div class="rv rv3">${riverHTML(rel(3))}</div>
    </div></div></div>
    ${opp(rel(2), 'top')}${opp(rel(3), 'left')}${opp(rel(1), 'right')}
    ${plate(rel(2), 'top')}${plate(rel(3), 'left')}${plate(rel(1), 'right')}
    <div class="info"><div class="dora">${dora}</div>
      <div class="cnt"><span>${S.honba}本場</span><span><i class="stick"></i>×${S.kyotaku}</span></div>${netDot}</div>
    <div class="tops">${isFull() ? '' : '<button class="small ghost" data-act="full">全画面</button>'}<button class="small ghost" data-act="sound" aria-pressed="${soundOn}">${soundOn ? '音 ON' : '音 OFF'}</button><button class="small ghost" data-act="yaku">役一覧</button><button class="small ghost" data-act="menu">メニュー</button></div>
    ${me >= 0 ? `<div class="toggles">${toggles}</div>` : ''}
    ${me >= 0 ? plate(me, 'me') + mineHTML(me) : `<p class="spect">観戦中です。手牌は見えません。</p>`}
    ${sheetHTML()}
  </div>`;
}

function mineHTML(me) {
  const p = S.players[me];
  const st = S.seats[me];
  const myTurn = S.phase === 'turn' && S.turn === me && !st.bot;
  const o = myTurn ? MJ.turnOptions(S, me) : null;
  let hand = p.hand.slice();
  let drawn = null;
  if (S.phase === 'turn' && S.turn === me && S.drawn !== null) { drawn = S.drawn; hand = hand.filter((x) => x !== drawn); }
  hand.sort((a, b) => a - b);
  const allowed = o ? (ui.riichi ? o.discardable.filter((id) => o.riichi.includes(id >> 2)) : o.discardable) : [];
  const tcls = (id) => {
    if (!myTurn) return ui.sel === id ? 'sel pre' : '';
    let c = allowed.includes(id) ? (ui.riichi ? 'ok' : '') : 'no';
    if (ui.sel === id) c += ' sel';
    return c;
  };
  const tiles = hand.map((id) => tile(id, tcls(id))).join('') + (drawn !== null ? tile(drawn, 'drawn ' + tcls(drawn)) : '');

  let btns = '', hint = '';
  if (st.bot) {
    hint = 'CPUが代わりに打っています';
    btns = `<button class="gold" data-act="togglebot" data-seat="${me}">自分で打つ</button>`;
  } else if (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]) {
    btns = claimHTML(me);
  } else if (myTurn) {
    if (o.tsumo) btns += `<button class="hot" data-act="tsumo">ツモ</button>`;
    if (o.riichi.length && !ui.riichi && !p.riichi) btns += `<button class="gold" data-act="riichi">リーチ</button>`;
    if (ui.riichi) btns += `<button class="ghost" data-act="riichi-cancel">リーチをやめる</button>`;
    for (const k of o.kans) btns += `<button data-act="kan" data-type="${k.type}" data-k="${k.k}">カン <span class="mini">${tile(k.k * 4 + 1, 'sm')}</span></button>`;
    hint = ui.riichi ? (ui.sel !== null ? 'もう一度タップでリーチ' : 'リーチで切る牌をタップすると、待ちが出ます') : p.riichi ? 'ツモ切りします…' : ui.sel !== null ? 'もう一度タップで切ります' : '切る牌をタップ';
  } else if (S.phase === 'claim') {
    hint = 'ほかの人の選択を待っています';
  }
  if (!myTurn && !st.bot && ui.sel !== null && !(S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me])) hint = '仮選択中：自分の番でもう一度タップすると切ります';
  const furiten = p.riichi && MJ.isFuriten(p) ? '<span class="tag cpu">フリテン</span>' : '';
  const waits = myTurn && ui.riichi && ui.sel !== null ? waitsHTML(p, ui.sel) : '';
  return `${hint || furiten ? `<div class="hint">${furiten}${esc(hint)}${waits}</div>` : ''}
    <div class="acts">${btns}</div>
    <div class="handrow"><div class="hand ${myTurn ? '' : 'wait'}">${tiles}</div>
      <div class="mymelds">${p.melds.map((m) => meldHTML(m, me)).join('')}</div></div>`;
}

// リーチで discardId を切ったときの待ちと、その牌が自分から見てあと何枚残っているか
function waitsHTML(p, discardId) {
  const hand = p.hand.filter((x) => x !== discardId);
  const ws = MJ.waits(hand, p.melds.length);
  if (!ws.length) return '';
  // 見えている牌：自分の手牌・切る牌・全員の河と鳴いた牌・ドラ表示牌
  const seen = MJ.counts(hand.concat([discardId],
    ...S.players.map((q) => q.river.filter((r) => !r.called).map((r) => r.id)), // 鳴かれた牌は鳴いた側で数える
    ...S.players.map((q) => [].concat(...q.melds.map((m) => m.tiles))),
    MJ.doraIndicators(S)));
  const left = ws.map((k) => Math.max(0, 4 - seen[k]));
  const mine = new Set(p.river.map((r) => r.id >> 2).concat([discardId >> 2]));
  const furiten = ws.some((k) => mine.has(k));
  return `<span class="waits"><b>待ち</b>${ws.map((k, i) => `<span class="w ${left[i] ? '' : 'none'}">${tile(k * 4 + 1, 'sm')}<i>残${left[i]}</i></span>`).join('')}
    <b>計${left.reduce((a, b) => a + b, 0)}枚</b>${furiten ? '<span class="tag cpu">フリテン</span>' : ''}</span>`;
}

function claimHTML(me) {
  const cl = S.claim;
  const btns = cl.options[me].map((op, i) => {
    if (op.t === 'ron') return `<button class="hot" data-act="claim" data-i="${i}">ロン</button>`;
    if (op.t === 'pon') return `<button data-act="claim" data-i="${i}">ポン</button>`;
    if (op.t === 'kan') return `<button data-act="claim" data-i="${i}">カン</button>`;
    return `<button data-act="claim" data-i="${i}">チー<span class="chiopt">${op.tiles.map((x) => tile(x, 'sm')).join('')}</span></button>`;
  }).join('');
  return `<span class="claimq" title="${esc(nameOf(cl.from))}が${cl.kind === 'chankan' ? '加槓' : '捨てた'}牌">${tile(cl.tile)}</span>${btns}<button class="ghost" data-act="pass">スキップ</button>`;
}

function sheetHTML() {
  if (ui.menu) return menuHTML();
  if (ui.yaku) return yakuHTML();
  if (ui.fullhelp) return fullHelpHTML();
  if (S.phase === 'result') return Date.now() < resultHoldUntil ? '' : resultHTML();
  if (S.phase === 'end') return endHTML();
  return '';
}

function menuHTML() {
  const me = mySeat();
  let rows = '';
  if (role !== 'local') {
    rows = S.seats.map((s, i) => {
      if (!s.uid || (role !== 'host' && i !== me)) return '';
      const isMe = i === me;
      const label = s.bot ? (isMe ? '自分で打つ' : '本人に戻す') : (isMe ? 'CPUに代打ちしてもらう' : 'CPUに代打ちさせる');
      return `<div style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(nameOf(i))}${s.bot ? '（CPU代打ち中）' : ''}</span><button class="small" data-act="togglebot" data-seat="${i}">${label}</button></div>`;
    }).join('');
    rows = `<h3>代打ち</h3><p class="muted">席を離れる人や接続が切れた人の番は、CPUに任せられます。${role === 'host' ? '' : 'ほかの人の席は親機の人が切り替えます。'}</p>${rows}`;
  }
  let quit;
  if (role === 'host') quit = `<h3>対局をやめる</h3><p class="muted">全員の対局が終わり、ロビーに戻ります。</p><div class="btnrow"><button class="hot" data-act="tolobby">対局をやめる</button><button data-act="menu-close">閉じる</button></div>`;
  else if (role === 'local') quit = `<div class="btnrow"><button class="hot" data-act="leave">練習をやめる</button><button data-act="menu-close">閉じる</button></div>`;
  else quit = `<h3>部屋から出る</h3><p class="muted">同じ部屋番号でまた参加すれば、自分の席に戻れます。</p><div class="btnrow"><button class="hot" data-act="leave">部屋から出る</button><button data-act="menu-close">閉じる</button></div>`;
  return `<div class="sheet-bg" data-act="menu-close"><div class="sheet" data-stop="1"><h2>メニュー</h2>${rows}${quit}</div></div>`;
}

function handBlock(hand, melds, owner, winTile) {
  const h = hand.slice();
  if (winTile !== undefined) h.splice(h.indexOf(winTile), 1);
  h.sort((a, b) => a - b);
  return `<div class="winhand">${h.map((x) => tile(x)).join('')}${winTile !== undefined ? '<span class="gap"></span>' + tile(winTile, 'hl') : ''}${melds.length ? '<span class="gap"></span>' : ''}${melds.map((m) => meldHTML(m, owner)).join('<span class="gap"></span>')}</div>`;
}

// 順位（同点は起家に近い人が上）
function ranksOf(scores) {
  const r = [];
  [0, 1, 2, 3].sort((a, b) => scores[b] - scores[a] || ((a - S.startDealer + 4) % 4) - ((b - S.startDealer + 4) % 4)).forEach((s, i) => { r[s] = i + 1; });
  return r;
}
const rankTag = (r, cls) => `<i class="rk rk${r} ${cls || ''}">${r}位</i>`;

// 結果の演出。描き直しても途中から続くよう、始まった時刻からの経過時間で各部分の出るタイミングをずらす
let resKey = '', resStart = 0, resScoreAt = 0, resRaf = 0;

function resultHTML() {
  const R = S.result;
  const me = mySeat();
  const key = R.type + R.label + R.delta.join(',');
  if (key !== resKey) { resKey = key; resStart = Date.now(); }
  const D = (ms) => `style="--d:${Math.round(ms)}ms"`;
  let t = 350, pages = '';
  const snd = []; // 演出に合わせて鳴らす音 { at: ms, kind }
  if (R.type === 'draw') {
    // 流局：テンパイ・ノーテンを1人ずつ
    const rows = [0, 1, 2, 3].map((s, i) => `<div class="rs-drow rs-a" ${D(t + 400 + i * 260)}>
      <span class="rs-rname">${esc(nameOf(s))}</span><b class="${R.tenpai[s] ? 'ten' : ''}">${R.tenpai[s] ? 'テンパイ' : 'ノーテン'}</b>
      ${R.hands[s] ? `<div class="rs-hand">${handBlock(R.hands[s], S.players[s].melds, s)}</div>` : ''}</div>`).join('');
    const end = t + 400 + 4 * 260 + 1800;
    pages += `<div class="rs-page out" style="--o:${end}ms"><div class="rs-draw"><div class="rs-dtitle rs-a" ${D(t)}>流局</div>${rows}</div></div>`;
    t = end;
  } else {
    R.wins.forEach((w) => {
      // 和了：左にキャラ、右に役を1つずつ → 符・翻 → 満貫など → 点数
      const sc = w.score, src = seatAvatar(w.seat), nm = nameOf(w.seat);
      const chara = src ? `<div class="rs-chara rs-a ${avClass(src)}" ${D(t)}></div>`
        : `<div class="rs-chara none rs-a" ${D(t)}><span style="--hue:${(w.seat * 83 + 200) % 360}">${esc(nm.slice(0, 1))}</span></div>`;
      const who = `<div class="rs-who rs-a" ${D(t + 200)}><span class="rs-name">${esc(nm)}</span><b class="rs-how">${R.type === 'tsumo' ? 'ツモ' : 'ロン'}</b>${R.type === 'ron' ? `<span class="rs-from">${esc(nameOf(w.from))} から</span>` : ''}</div>`;
      let u = t + 600;
      const hand = `<div class="rs-hand rs-a" ${D(u)}>${handBlock(w.hand, w.melds, w.seat, w.tile)}
        <div class="rs-dora">ドラ ${R.doraInd.map((x) => tile(x, 'sm')).join('')}${w.ura ? '　裏 ' + R.uraInd.map((x) => tile(x, 'sm')).join('') : ''}</div></div>`;
      u += 450;
      const yaku = sc.yaku.map((y, i) => `<div class="rs-y rs-a" ${D(u + i * 320)}><span>${esc(y.name)}</span><b>${typeof y.han === 'number' ? y.han + '翻' : esc(y.han)}</b></div>`).join('');
      sc.yaku.forEach((y, i) => snd.push({ at: u + i * 320, kind: 'yaku' }));
      u += sc.yaku.length * 320 + 250;
      const fu = sc.yakuman ? '' : `<span class="rs-fu rs-a" ${D(u)}>${sc.fu}符 ${sc.han}翻</span>`;
      if (!sc.yakuman) u += 450;
      const limit = sc.limit ? `<span class="rs-limit" ${D(u)}>${esc(sc.limit)}</span>` : '';
      const tier = winTier(sc);
      if (sc.limit) { snd.push({ at: u + 250, kind: 'stamp', tier }); u += 700; }
      snd.push({ at: u, kind: 'total', tier });
      const total = `<span class="rs-total rs-a" ${D(u)}><b data-count="0,${sc.total},${u},700">0</b>点</span>`;
      const end = u + 700 + 1700;
      pages += `<div class="rs-page out" style="--o:${end}ms"><div class="rs-glow rs-a" ${D(t)}></div>${chara}
        <div class="rs-info">${who}${hand}<div class="rs-yaku">${yaku}</div><div class="rs-pts">${fu}${limit}${total}</div></div></div>`;
      t = end;
    });
  }
  // 4人の点数：増える人は増え、引かれる人は引かれていく。最後に順位を入れ替える
  resScoreAt = t;
  snd.push({ at: t + 1100, kind: 'coins' });
  if (R.type !== 'draw') snd.push({ at: t + 2450, kind: 'confetti' }); // 点数を数え終わったら、和了した人の行に紙吹雪
  scheduleResultSfx(snd);
  const old = S.scores.map((v, s) => v - R.delta[s]);
  const r0 = ranksOf(old), r1 = ranksOf(S.scores);
  const winners = R.type === 'draw' ? [] : R.wins.map((w) => w.seat);
  const rows = [0, 1, 2, 3].sort((a, b) => MJ.seatWind(S, a) - MJ.seatWind(S, b)).map((s, i) => {
    const dv = R.delta[s];
    const rank = r0[s] === r1[s] ? rankTag(r1[s]) : rankTag(r0[s], 'old') + rankTag(r1[s], 'new');
    return `<div class="rs-row rs-a ${winners.includes(s) ? 'win' : ''} ${s === me ? 'me' : ''}" ${D(t + 200 + i * 120)}>
      <span class="wind">${WN[MJ.seatWind(S, s) - 27]}</span>${avatarHTML(seatAvatar(s), nameOf(s), (s * 83 + 200) % 360)}
      <span class="rs-rname">${esc(nameOf(s))}</span><span class="rs-rank" ${D(t + 2500)}>${rank}</span>
      <span class="rs-sc" data-count="${old[s]},${S.scores[s]},${t + 1100},1300">${old[s].toLocaleString()}</span>
      <span class="rs-dv rs-pop ${dv > 0 ? 'plus' : dv < 0 ? 'minus' : ''}" ${D(t + 850)}>${dv > 0 ? '+' : ''}${dv ? dv.toLocaleString() : '±0'}</span></div>`;
  }).join('');
  let btn;
  if (role === 'local') btn = `<button class="gold" data-act="next">次の局へ</button>`;
  else {
    const humans = S.seats.map((s, i) => (s.uid && !s.bot ? i : -1)).filter((i) => i >= 0);
    const ready = S.ready || {};
    const waiting = humans.filter((i) => !ready[i]);
    const iReady = me >= 0 && ready[me];
    btn = me >= 0 && !iReady ? `<button class="gold" data-act="ready">OK（次の局へ）</button>` : '';
    if (waiting.length && (iReady || me < 0)) {
      btn += `<p class="muted">待っています：${waiting.map((i) => esc(nameOf(i))).join('、')}</p>`;
      if (role === 'host') btn += `<button class="ghost" data-act="next">待たずに次の局へ</button>`;
    }
  }
  const skip = Date.now() - resStart < resScoreAt ? `<span class="rs-skip" style="--o:${t}ms">タップで点数へ</span>` : '';
  return `<div class="rs" data-act="res-skip" style="--t0:${resStart - Date.now()}ms"><div class="rs-dim"></div>${pages}
    <div class="rs-page rs-score"><div class="rs-title rs-a" ${D(t)}>${esc(R.label)}　点数の移動</div>
      <div class="rs-rows">${rows}</div><div class="rs-btns" ${D(t + 2700)}>${btn}</div></div>${skip}</div>`;
}

// 点数の数字を少しずつ増やす・減らす（data-count="はじめ,おわり,開始ms,長さms"）
function resTick() {
  cancelAnimationFrame(resRaf);
  const els = app.querySelectorAll('[data-count]');
  if (!els.length) return;
  const now = Date.now() - resStart;
  let busy = false;
  els.forEach((e) => {
    const [a, b, st, du] = e.dataset.count.split(',').map(Number);
    const k = Math.min(1, Math.max(0, (now - st) / du));
    if (k < 1) busy = true;
    const v = k === 1 ? b : Math.round((a + (b - a) * (1 - Math.pow(1 - k, 3))) / 100) * 100;
    e.textContent = v.toLocaleString();
  });
  if (busy) resRaf = requestAnimationFrame(resTick);
}

function endHTML() {
  const F = S.final;
  const rows = F.order.map((s, r) => `<span class="big">${r + 1}位</span><span>${esc(nameOf(s))}</span><span>${S.scores[s].toLocaleString()}</span><span class="${F.pts[s] > 0 ? 'plus' : 'minus'}">${F.pts[s] > 0 ? '+' : ''}${F.pts[s].toFixed(1)}</span>`).join('');
  const btns = role === 'host' ? `<button class="gold" data-act="again">同じ席でもう一局</button><button data-act="tolobby">ロビーへ</button>`
    : role === 'local' ? `<button class="gold" data-act="practice">もう一局</button><button data-act="leave">終わる</button>`
    : `<p class="muted">親機の人が次の対局を始めるのを待っています。</p>`;
  return `<div class="sheet-bg"><div class="sheet"><h2>対局終了</h2>
    <div class="deltas">${rows}</div>
    <p class="muted">右端は30000点返し・ウマ10-20で計算したポイントです。</p>
    <div class="btnrow">${btns}</div></div></div>`;
}

/* ---------- 操作 ---------- */

app.addEventListener('change', (e) => {
  if (e.target.classList.contains('packinput') && e.target.files && e.target.files.length) {
    const files = [...e.target.files];
    e.target.value = '';
    importPack(files);
  }
});

app.addEventListener('input', (e) => {
  if (e.target.id === 'name') { myName = e.target.value.trim().slice(0, 12); store.set('mj.name', myName); }
  if (e.target.id === 'code') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
});

app.addEventListener('click', (e) => {
  const tEl = e.target.closest('.hand .t');
  if (tEl) return onTile(+tEl.dataset.id);
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && e.target.closest('[data-stop]')) return;
  if (el.closest('.mh')) sfx(el.dataset.act === 'title-start' ? 'start' : el.dataset.act === 'home-back' ? 'back' : 'ok');
  onAct(el.dataset.act, el.dataset);
});

function onTile(id) {
  const me = mySeat();
  if (me < 0 || !S || S.seats[me].bot || S.players[me].riichi) return;
  // 自分の番の前：次に切りたい牌を仮選択しておける（もう一度タップで取り消し）
  if (!(S.phase === 'turn' && S.turn === me)) {
    if (!['turn', 'claim'].includes(S.phase)) return;
    ui.sel = ui.sel === id ? null : id;
    gsfx('pick');
    return render();
  }
  const o = MJ.turnOptions(S, me);
  const allowed = ui.riichi ? o.discardable.filter((x) => o.riichi.includes(x >> 2)) : o.discardable;
  if (!allowed.includes(id)) return;
  if (ui.sel !== id) { ui.sel = id; gsfx('pick'); render(); return; }
  const riichi = ui.riichi;
  ui.sel = null; ui.riichi = false;
  send({ cmd: 'apply', a: { type: 'discard', id, riichi } });
}

function onAct(a, ds) {
  switch (a) {
    case 'title-start': titleSeen = true; ui.home = 'menu'; return render();
    case 'home-back': ui.home = 'menu'; return render();
    case 'go-join': ui.home = 'join'; return render();
    case 'go-name': ui.home = 'name'; return render();
    case 'name-ok':
      if (!myName) return toast('名前を入れてください');
      ui.home = 'menu';
      return render();
    case 'create': ui.home = null; return createRoom(null);
    case 'resume': {
      let saved = null;
      try { saved = JSON.parse(store.get('mj.hostroom') || 'null'); } catch (e) { saved = null; }
      if (!saved) return;
      ui.home = null;
      return createRoom(saved);
    }
    case 'join': return joinRoom((document.getElementById('code') || {}).value || '');
    case 'practice': ui.menu = false; return startPractice();
    case 'leave': ui.menu = false; return leaveRoom();
    case 'copy': {
      const link = ds.link;
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('コピーしました'), () => toast(link));
      else toast(link);
      return;
    }
    case 'menu': ui.menu = true; return render();
    case 'menu-close': ui.menu = false; return render();
    case 'import': { const f = document.getElementById('packfile'); if (f) f.click(); return; }
    case 'pick-own': {
      // 画面を描き直すと一覧が先頭に戻るので、選択の印だけ付け替える
      const i = +ds.i;
      setMine(i < 0 ? null : pickList[i]);
      document.querySelectorAll('.mh-char').forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
      refreshStage();
      return;
    }
    // 部屋に入ったときの「名前とキャラを決める」
    case 'room-setup': ui.roomSetup = true; return render();
    case 'pick-setup': {
      const i = +ds.i;
      setMine(i < 0 ? null : pickList[i]);
      document.querySelectorAll('.room-setup .mh-char').forEach((b) => b.classList.toggle('on', +b.dataset.i === i));
      refreshStage();
      return;
    }
    case 'setup-ok':
      if (!myName) return toast('名前を入れてください');
      ui.roomSetup = false;
      // まだ親機とつながっていなければ、つながったときの挨拶で名前とキャラが届く
      if (role !== 'client' || (hostConn && hostConn.open)) {
        send({ cmd: 'rename', name: myName });
        send({ cmd: 'avatar', src: AV.mine });
      }
      return render();
    case 'full': return goFull();
    case 'fullhelp-close': ui.fullhelp = false; return render();
    case 'yaku': ui.yaku = true; return render();
    case 'yaku-close': ui.yaku = false; return render();
    case 'auto':
      auto[ds.k] = !auto[ds.k];
      store.set('mj.auto', JSON.stringify(auto));
      render(); scheduleAuto();
      return;
    case 'riichi': ui.riichi = true; ui.sel = null; return render();
    case 'riichi-cancel': ui.riichi = false; ui.sel = null; return render();
    case 'tsumo': return send({ cmd: 'apply', a: { type: 'tsumo' } });
    case 'kan': return send({ cmd: 'apply', a: { type: 'kan', kanType: ds.type, k: +ds.k } });
    case 'claim': {
      const op = S.claim.options[mySeat()][+ds.i];
      return send({ cmd: 'apply', a: { type: 'respond', resp: op.t === 'ron' ? { t: 'ron' } : op } });
    }
    case 'pass': return send({ cmd: 'apply', a: { type: 'respond', resp: { t: 'pass' } } });
    case 'sound':
      soundOn = !soundOn; store.set('mj.sound', soundOn ? '1' : '0');
      gsfx('call');
      return render();
    case 'res-skip': // 和了の説明を飛ばして、点数の移動から見る
      if (Date.now() - resStart < resScoreAt) { resStart = Date.now() - resScoreAt; render(); }
      return;
    case 'ready': return send({ cmd: 'ready' });
    case 'next': return send({ cmd: 'next' });
    case 'togglebot': ui.menu = false; return send({ cmd: 'togglebot', seat: +ds.seat });
    case 'botseat': return send({ cmd: 'botseat', seat: +ds.seat });
    case 'clearseat': return send({ cmd: 'clearseat', seat: +ds.seat });
    case 'rule': return send({ cmd: 'rule', k: ds.k, v: ds.k === 'aka' ? ds.v === '1' : ds.v });
    case 'start': return send({ cmd: 'start' });
    case 'again': return send({ cmd: 'again' });
    case 'tolobby': ui.menu = false; return send({ cmd: 'tolobby' });
  }
}

/* ---------- 更新の確認 ----------
   ホーム画面から開くと古いページが残っていることがあるので、version.json を毎回取りに行き、
   新しい版があればURLを変えて読み込み直す（部屋の中にいるときは、部屋を出てから） */
const BUILD = '2026-10-27.2';
let newBuild = null, updateToldInRoom = false;
function applyUpdateIfIdle() {
  if (!newBuild) return;
  if (role !== 'home') {
    if (!updateToldInRoom) { updateToldInRoom = true; toast('新しい版があります。部屋を出ると更新されます'); }
    return;
  }
  // 読み込み直しても古いままだったときに、何度も読み込み直さないように
  try { if (sessionStorage.getItem('mj.reloadedFor') === newBuild) return; sessionStorage.setItem('mj.reloadedFor', newBuild); } catch (e) { /* 保存できなくても続ける */ }
  const room = new URLSearchParams(location.search).get('room');
  location.replace(location.pathname + '?v=' + encodeURIComponent(newBuild) + (room ? '&room=' + encodeURIComponent(room) : ''));
}
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    if (v && v.build && v.build !== BUILD) { newBuild = v.build; applyUpdateIfIdle(); }
  } catch (e) { /* オフラインなどは無視 */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
checkUpdate();

render();
</script>
