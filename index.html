<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050403">
<meta name="apple-mobile-web-app-title" content="社内麻雀卓">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>社内麻雀卓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=8">
<style>
[hidden] { display: none !important; }
body { margin: 0; padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--ivory); border: 0; border-radius: 10px;
  padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box;
}
input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.code { font-family: var(--f-disp); font-size: 52px; letter-spacing: .18em; line-height: 1; font-variant-numeric: tabular-nums; }
.codebox { background: var(--rail); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.join { display: flex; gap: 8px; }
.join input { flex: 1; letter-spacing: .2em; text-align: center; }
.join button { flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6fd39b; display: inline-block; flex: none; }
.dot.off { background: #ff9a85; }
.net { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.or { color: var(--muted); font-size: 12px; text-align: center; letter-spacing: .1em; }
/* タイトル画面：夕暮れの山並みと火の粉。金と青銅の枠のパネルに、項目が右からすべり込む */
.mh {
  --mh-gold: #d8b25a; --mh-gold-hi: #fff2c4; --mh-gold-lo: #7a5420; --mh-text: #f3e6c4; --mh-dim: #b9a072;
  position: fixed; inset: 0; overflow: hidden; z-index: 1; color: var(--mh-text);
  background:
    radial-gradient(ellipse 90% 55% at 50% 105%, rgba(150, 62, 18, .75) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(40, 70, 80, .5) 0%, transparent 70%),
    linear-gradient(#0a1216 0%, #142229 40%, #2a1a0e 100%);
}
.mh.is-title { cursor: pointer; }
.mh-far, .mh-near { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
.mh-far { height: 58%; background: #18130f; opacity: .8;
  clip-path: polygon(0 55%, 8% 40%, 17% 52%, 28% 22%, 37% 44%, 46% 30%, 55% 48%, 66% 18%, 76% 42%, 86% 28%, 100% 46%, 100% 100%, 0 100%); }
.mh-near { height: 40%; background: #0b0806;
  clip-path: polygon(0 40%, 10% 62%, 21% 34%, 33% 58%, 44% 40%, 58% 66%, 69% 36%, 80% 56%, 91% 30%, 100% 52%, 100% 100%, 0 100%); }
.mh-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mh-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .7)); }

.mh-logo { position: absolute; display: flex; align-items: center; gap: 14px; pointer-events: none; }
.mh-logo.big { left: 50%; top: 44%; transform: translate(-50%, -50%); flex-direction: column; gap: 6px; text-align: center; animation: mhLogoIn 1.2s cubic-bezier(.2, .8, .2, 1) both; }
.mh-logo.small { left: max(18px, env(safe-area-inset-left, 0px)); top: max(14px, env(safe-area-inset-top, 0px)); animation: mhFadeDown .5s ease-out both; }
.mh-crest { width: clamp(70px, 16vh, 120px); height: auto; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)) drop-shadow(0 0 16px rgba(255, 170, 60, .25)); }
.mh-logo.small .mh-crest { width: 46px; }
.mh-title { display: flex; flex-direction: column; align-items: center; }
.mh-logo.small .mh-title { align-items: flex-start; }
.mh-ja {
  font-family: var(--f-disp); font-size: clamp(44px, 12vh, 92px); line-height: 1.05; letter-spacing: .1em; padding: 0 .1em;
  background:
    linear-gradient(110deg, transparent 42%, rgba(255, 255, 255, .95) 50%, transparent 58%) -150% 0 / 250% 100% no-repeat,
    linear-gradient(#fff6d6 0%, #f0cf7a 38%, #a8741f 52%, #e2bb62 70%, #fff0c0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #2e1a06) drop-shadow(0 0 22px rgba(255, 160, 50, .35));
  animation: mhShine 4.5s ease-in-out 1.2s infinite;
}
.mh-logo.small .mh-ja { font-size: 26px; animation: none; }
.mh-en { font-size: 11px; letter-spacing: .42em; color: var(--mh-gold); margin-top: 4px; text-shadow: 0 1px 0 #000; }
.mh-logo.small .mh-en { font-size: 9px; letter-spacing: .3em; }
.mh-press { position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%); white-space: nowrap;
  font-family: var(--f-disp); font-size: clamp(16px, 4.2vh, 22px); letter-spacing: .25em; color: var(--mh-text);
  text-shadow: 0 0 12px rgba(255, 190, 90, .8), 0 2px 0 #000; animation: mhBlink 1.6s ease-in-out infinite, mhFadeUp .8s ease-out .9s both; }
.mh-foot { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-size: 11px; letter-spacing: .2em; color: rgba(243, 230, 196, .5); white-space: nowrap; pointer-events: none; }

.mh-stage { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: min(460px, 56vw); }
.mh-panel {
  position: relative; border-radius: 6px; overflow: hidden;
  background: linear-gradient(rgba(42, 28, 14, .94), rgba(16, 11, 6, .96));
  border: 2px solid var(--mh-gold);
  box-shadow: inset 0 0 0 1px #3a2610, inset 0 0 40px rgba(0, 0, 0, .7), 0 0 0 4px rgba(0, 0, 0, .55), 0 14px 34px rgba(0, 0, 0, .65);
  animation: mhPanelIn .4s cubic-bezier(.2, .8, .2, 1) both;
}
.mh-panel::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(216, 178, 90, .3); border-radius: 3px; pointer-events: none; }
.mh-head { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 14px;
  background: linear-gradient(#6e4b1b, #3a250b); border-bottom: 2px solid var(--mh-gold); }
.mh-head h2 { margin: 0; font-family: var(--f-disp); font-weight: 400; font-size: 18px; letter-spacing: .25em; color: #fbe7b0; text-shadow: 0 2px 0 #000; }
.mh-gem { width: 9px; height: 9px; transform: rotate(45deg); background: linear-gradient(135deg, #ffe9a8, #b8862d); box-shadow: 0 0 8px rgba(255, 207, 106, .8); }
.mh-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 150px); overflow-y: auto; }
.mh-list { display: flex; flex-direction: column; gap: 3px; margin: -4px -6px; }
.mh-item {
  position: relative; display: grid; text-align: left; gap: 1px; min-height: 46px; padding: 7px 12px 7px 32px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .045), transparent 85%); color: var(--mh-text);
  border: 1px solid transparent; border-radius: 3px; box-shadow: none; font-weight: 700;
  animation: mhItemIn .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 65ms + 150ms);
}
.mh-item:active { transform: none; }
.mh-lbl { font-family: var(--f-disp); font-weight: 400; font-size: 19px; letter-spacing: .14em; text-shadow: 0 2px 0 #000; }
.mh-sub { font-size: 11px; font-weight: 500; color: var(--mh-dim); }
.mh-cur { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #ffd36b; opacity: 0; text-shadow: 0 0 8px #ffb84a; }
.mh-item:hover, .mh-item:focus-visible, .mh-item:active {
  outline: none; border-color: rgba(255, 214, 120, .65);
  background: linear-gradient(90deg, rgba(232, 178, 74, .38), rgba(232, 178, 74, .06) 85%);
}
.mh-item:hover .mh-cur, .mh-item:focus-visible .mh-cur, .mh-item:active .mh-cur { opacity: 1; animation: mhCur .5s ease-in-out infinite alternate; }
.mh-field { display: flex; flex-direction: column; gap: 6px; }
.mh-field > span { font-size: 12px; letter-spacing: .15em; color: var(--mh-gold); }
.mh-field input { background: #0d0905; color: #fbe7b0; border: 1px solid #8a6a2a; border-radius: 4px; font-family: var(--f-disp); font-size: 20px; letter-spacing: .08em; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .7); }
.mh-field input.mh-code { font-size: 30px; letter-spacing: .5em; text-align: center; padding-left: .5em; }
.mh-field input::placeholder { color: #5b4a2a; }
.mh-note { margin: 0; font-size: 12px; color: var(--mh-dim); }
.mh-help p { margin: 0 0 8px; font-size: 13px; line-height: 1.75; color: var(--mh-text); }
.mh-help b { color: #ffd98a; }
.mh-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 0 14px 14px; }
.mh-btn { min-width: 110px; font-family: var(--f-disp); font-weight: 400; font-size: 17px; letter-spacing: .2em; color: #fbe7b0;
  background: linear-gradient(#80581f, #3c2709); border: 1px solid #d1a752; border-radius: 4px; box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255, 240, 200, .35); }
.mh-btn.ghost { background: rgba(0, 0, 0, .35); border-color: #6b5426; color: var(--mh-dim); }

.mh-who { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid rgba(216, 178, 90, .55); border-radius: 4px;
  background: linear-gradient(90deg, rgba(40, 26, 12, .9), rgba(40, 26, 12, .4)); animation: mhFadeUp .5s ease-out .2s both; }
.mh-who .av { width: 30px; height: 30px; font-size: 14px; }
button.mh-who { font: inherit; color: inherit; text-align: left; min-height: 0; cursor: pointer; box-shadow: none; }
button.mh-who:hover, button.mh-who:focus-visible { border-color: #ffd36b; box-shadow: 0 0 10px rgba(255, 211, 107, .45); outline: none; }
.mh-who span { font-size: 10px; letter-spacing: .25em; color: var(--mh-gold); display: block; }
.mh-who b { font-family: var(--f-disp); font-weight: 400; font-size: 17px; letter-spacing: .08em; color: #fbe7b0; }

/* 横向きで画面の高さが低いときは項目を詰める */
@media (orientation: landscape) and (max-height: 460px) {
  .mh-item { min-height: 0; padding: 4px 12px 4px 30px; }
  .mh-lbl { font-size: 16px; line-height: 1.25; }
  .mh-sub { font-size: 10px; line-height: 1.3; }
  .mh-head { padding: 5px 14px; }
  .mh-head h2 { font-size: 15px; }
  .mh-body { padding: 10px 12px; max-height: calc(100vh - 90px); }
}

/* 部屋（ロビー） */
.mh.no-anim .room-head, .mh.no-anim .seat-card, .mh.no-anim .room-bar { animation: none; }
/* 上（ロゴと部屋番号）・真ん中（席）・下（ルールと操作）を縦に並べ、画面が小さければ席が縮む */
.mh-room > .mh-logo { display: none; }
.room-layout { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.room-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; animation: mhFadeDown .5s ease-out both; }
.room-logo { display: flex; align-items: center; gap: 8px; min-width: 0; }
.room-logo .mh-crest { width: 40px; flex: none; }
.room-logo .mh-ja { font-size: 24px; animation: none; white-space: nowrap; }
.room-code { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 12px; border: 1px solid var(--mh-gold); border-radius: 6px; flex: none;
  background: linear-gradient(rgba(42, 28, 14, .92), rgba(16, 11, 6, .94)); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.room-code span { font-size: 11px; letter-spacing: .25em; color: var(--mh-gold); }
.room-code b { font-family: var(--f-disp); font-weight: 400; font-size: 28px; letter-spacing: .22em; color: #fbe7b0; line-height: 1; text-shadow: 0 0 12px rgba(255, 190, 90, .5); font-variant-numeric: tabular-nums; }
.room-seats { min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.seat-card { position: relative; overflow: hidden; border-radius: 6px; border: 2px solid #8a6a2a;
  background: radial-gradient(ellipse at 50% 100%, rgba(150, 90, 30, .35), transparent 70%), linear-gradient(rgba(42, 28, 14, .85), rgba(14, 9, 5, .92));
  box-shadow: inset 0 0 0 1px #3a2610, 0 8px 20px rgba(0, 0, 0, .55); animation: mhItemIn .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 80ms + 100ms); }
.seat-card.me { border-color: #ffd36b; box-shadow: inset 0 0 0 1px #3a2610, 0 0 16px rgba(255, 211, 107, .45); }
.seat-card.empty { border-style: dashed; border-color: #6b5426; background: rgba(0, 0, 0, .35); }
.sc-no { position: absolute; left: 8px; top: 6px; font-size: 10px; letter-spacing: .2em; color: var(--mh-gold); z-index: 2; }
.sc-tag { position: absolute; right: 6px; top: 5px; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--hot); color: #fff; z-index: 2; }
.sc-art { position: absolute; left: 4px; right: 4px; top: 18px; bottom: 34px; background-repeat: no-repeat; background-position: center bottom; background-size: contain;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
.sc-none { position: absolute; left: 0; right: 0; top: 18px; bottom: 34px; display: grid; place-items: center; font-family: var(--f-disp); font-size: 22px; color: #6b5426; letter-spacing: .2em; }
.sc-plate { position: absolute; left: 0; right: 0; bottom: 0; height: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px;
  background: linear-gradient(#6e4b1b, #3a250b); border-top: 1px solid var(--mh-gold); }
.sc-plate b { font-family: var(--f-disp); font-weight: 400; font-size: 15px; letter-spacing: .08em; color: #fbe7b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat-card.empty .sc-plate { background: rgba(0, 0, 0, .4); border-top-color: #6b5426; }
.seat-card.empty .sc-plate b { color: var(--mh-dim); }
.sc-btns { position: absolute; left: 0; right: 0; bottom: 38px; display: flex; justify-content: center; z-index: 2; }
.room-bar { display: flex; align-items: center; gap: 8px; min-width: 0; animation: mhFadeUp .5s ease-out .2s both; }
.room-bar > * { flex: none; }
.room-bar .grow { flex: 1 1 0; min-width: 0; }
.mh-seg { display: flex; border: 1px solid #8a6a2a; border-radius: 4px; overflow: hidden; background: rgba(0, 0, 0, .45); }
.mh-seg button { min-height: 36px; padding: 4px 12px; border: 0; border-radius: 0; box-shadow: none; background: transparent; color: var(--mh-dim);
  font-family: var(--f-disp); font-weight: 400; font-size: 14px; letter-spacing: .1em; }
.mh-seg button.on { background: linear-gradient(#80581f, #3c2709); color: #fbe7b0; }
.room-rule, .room-wait { font-size: 12px; color: var(--mh-dim); letter-spacing: .1em; }
.room-wait { color: #fbe7b0; animation: mhBlink 2s ease-in-out infinite; }
.mh-btn.go { min-width: 140px; font-size: 19px; background: linear-gradient(#c0392b, #6e1a10); border-color: #ffb38a; box-shadow: 0 2px 0 #000, 0 0 14px rgba(255, 120, 60, .45), inset 0 1px 0 rgba(255, 220, 200, .4); }
.mh-btn:disabled { opacity: .45; }
.room-net { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); font-size: 12px; color: #ffcf9a; background: rgba(0, 0, 0, .6); padding: 4px 12px; border-radius: 99px; white-space: nowrap; }
.room-setup { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(5, 4, 2, .6);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.room-setup .mh-panel { width: min(520px, 100%); }
.mh-room .mh-stage { right: 50%; transform: translate(50%, -50%); }
/* iPhone SE など横幅が狭い画面：文字とボタンを小さく */
@media (max-width: 760px) {
  .room-layout { gap: 8px; }
  .room-logo .mh-ja { font-size: 19px; }
  .room-logo .mh-crest { width: 32px; }
  .room-code span { display: none; }
  .room-code b { font-size: 24px; }
  .room-seats { gap: 8px; }
  .room-bar { gap: 6px; }
  .mh-seg button { min-height: 34px; padding: 3px 9px; font-size: 13px; letter-spacing: .04em; }
  .room-bar .mh-btn.small { padding: 3px 9px; font-size: 12px; letter-spacing: .04em; }
  .mh-btn.go { min-width: 0; padding: 6px 16px; font-size: 16px; }
  .sc-plate b { font-size: 13px; }
  .sc-btns .mh-btn.small { font-size: 12px; padding: 3px 8px; }
}
/* 横向きで高さが低い画面（Safariのバーがあるときなど） */
@media (orientation: landscape) and (max-height: 340px) {
  .room-logo .mh-crest { width: 28px; }
  .room-code b { font-size: 21px; }
  .sc-plate { height: 26px; }
  .sc-art, .sc-none { bottom: 28px; }
  .sc-btns { bottom: 31px; }
}
@media (orientation: portrait) {
  .room-head { flex-wrap: wrap; }
  .room-seats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .room-bar { flex-wrap: wrap; justify-content: center; }
  .room-bar .grow { display: none; }
  .mh-room .mh-stage { transform: none; }
}

/* 対局中は画面を動かさない（縦持ちで回転表示したときにはみ出してもスクロールさせない） */
body.in-game { overflow: hidden; }
html:has(body.in-game) { overflow: hidden; }

/* キャラ */
.av.img { background-color: #1a120a; background-repeat: no-repeat; background-size: 150% auto; background-position: center 8%; }
.av.lg { width: 44px; height: 44px; }
.mh-chara { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 0; width: min(40vw, 520px); height: 82vh;
  background-repeat: no-repeat; background-position: left bottom; background-size: contain; pointer-events: none;
  filter: drop-shadow(0 0 18px rgba(255, 170, 60, .35)) drop-shadow(0 6px 10px rgba(0, 0, 0, .6)); animation: mhCharaIn .7s cubic-bezier(.2, .8, .2, 1) both; }
.mh-who { z-index: 2; }
.mh-chara-name { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 58px); z-index: 2;
  padding: 4px 14px 5px; border: 1px solid rgba(216, 178, 90, .7); border-radius: 4px; pointer-events: none;
  background: linear-gradient(90deg, rgba(110, 75, 27, .95), rgba(58, 37, 11, .75)); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); animation: mhFadeUp .35s ease-out both; }
.mh-chara-name span { display: block; font-size: 9px; letter-spacing: .3em; color: var(--mh-gold); }
.mh-chara-name b { font-family: var(--f-disp); font-weight: 400; font-size: 18px; letter-spacing: .1em; color: #fbe7b0; text-shadow: 0 2px 0 #000; }
#chara-stage.in-name .mh-chara-name, #chara-stage.in-setup .mh-chara-name { bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
@media (orientation: landscape) {
  .room-setup { place-items: center end; }
  .room-setup .mh-panel { width: min(520px, 58vw); }
}
.mh-chars { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.mh-char { flex: none; width: 66px; height: 86px; padding: 0; min-height: 0; border-radius: 6px; background: rgba(0, 0, 0, .45);
  border: 1px solid #6b5426; box-shadow: none; display: grid; place-items: center; color: var(--mh-dim); font-weight: 500; font-size: 12px; }
.mh-char .ch { width: 100%; height: 100%; background-repeat: no-repeat; background-position: center bottom; background-size: contain; }
.mh-char.on { border: 2px solid #ffd36b; box-shadow: 0 0 10px rgba(255, 211, 107, .6); background: rgba(232, 178, 74, .18); }
.sheet .mh-chars { --mh-dim: #b9a072; }
.mh-packbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.mh-btn.small { min-width: 0; min-height: 34px; padding: 4px 12px; font-size: 13px; letter-spacing: .08em; }
.winner { display: flex; align-items: flex-end; gap: 12px; }
.winchara { width: 90px; height: 110px; flex: none; background-repeat: no-repeat; background-position: center bottom; background-size: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
@keyframes mhCharaIn { from { opacity: 0; translate: -30px 0; } to { opacity: 1; translate: 0 0; } }
@media (orientation: portrait) { .mh-chara { width: 70vw; height: 46vh; bottom: 40vh; opacity: .9; } }

/* 縦向き：ロゴを上に、パネルを下に */
@media (orientation: portrait) {
  .mh-stage { left: 16px; right: 16px; width: auto; top: auto; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: none; }
  .mh-logo.big { top: 40%; }
  .mh-body { max-height: 62vh; }
}

@keyframes mhLogoIn { from { opacity: 0; transform: translate(-50%, -50%) scale(1.25); filter: blur(8px); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); } }
@keyframes mhShine { 0%, 55% { background-position: -150% 0, 0 0; } 85%, 100% { background-position: 250% 0, 0 0; } }
@keyframes mhBlink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes mhFadeUp { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }
@keyframes mhFadeDown { from { opacity: 0; translate: 0 -10px; } to { opacity: 1; translate: 0 0; } }
@keyframes mhPanelIn { from { opacity: 0; clip-path: inset(0 0 100% 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
@keyframes mhItemIn { from { opacity: 0; translate: 40px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes mhCur { from { translate: -3px 0; } to { translate: 2px 0; } }
@media (prefers-reduced-motion: reduce) {
  .mh *, .mh *::before { animation: none !important; }
}

/* 対局画面：画面全体が卓。奥行きを付けた卓面に河と点数箱、外周に相手の手牌と名札、下に自分の手牌 */
.tbl {
  /* 画面の幅・高さと端の余白。縦持ちのときは下で入れ替えて、横画面を90度回して表示する */
  --VW: 100vw;
  --VH: 100vh; --VH: 100dvh;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --htw: min(54px, calc((var(--VW) - var(--sl) - var(--sr) - 40px) / 15.6), calc(var(--VH) * .1));
  --handH: calc(var(--htw) * 1.57 + 20px + var(--sb));
  --planeH: calc(var(--VH) - var(--handH));
  touch-action: manipulation;
  --rtw: calc(var(--planeH) * .054);
  --rth: calc(var(--rtw) * 1.57);
  --rvW: calc(var(--rtw) * 6 + 5px);
  --rvH: calc(var(--rth) * 3 + 10px);
  --B: calc(var(--rvW) + 6px); /* 点数箱の幅＝河の幅にして、角で河どうしが重ならないように */
  --otw: min(18px, calc(var(--planeH) * .052));
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 50% 42%, #2f5a8c 0%, #23476f 45%, #17324f 100%);
}
.tbl::before { /* 卓の縁 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 10px #3a2618, inset 0 0 0 12px #5a3b22, inset 0 0 60px rgba(0, 0, 0, .45);
}
.plane { position: absolute; left: 0; right: 0; top: 0; height: var(--planeH); perspective: 1100px; }
.stage { position: absolute; inset: 0; transform: rotateX(17deg); transform-origin: 50% 70%; }
.stage::before { /* 卓面の対角線 */
  content: ""; position: absolute; left: 50%; top: 52%; width: calc(var(--B) + var(--rvH) * 2 + 40px); aspect-ratio: 1;
  transform: translate(-50%, -50%); border: 1px solid rgba(255, 255, 255, .09); border-radius: 6px;
  background: linear-gradient(45deg, transparent 49.8%, rgba(255,255,255,.07) 50%, transparent 50.2%), linear-gradient(-45deg, transparent 49.8%, rgba(255,255,255,.07) 50%, transparent 50.2%);
}
.pc { position: absolute; left: 50%; top: 52%; width: var(--B); height: var(--B); transform: translate(-50%, -50%); }
.cbox {
  position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(#2a2f36, #1a1e23);
  box-shadow: 0 0 0 2px #4b525c, 0 6px 14px rgba(0, 0, 0, .45); color: #e9eef5;
}
.cmid { position: absolute; inset: 26%; display: grid; place-content: center; text-align: center; border-radius: 6px; background: #12161a; box-shadow: inset 0 0 0 1px #3a414b; }
.crd { font-family: var(--f-disp); font-size: calc(var(--B) * .13); color: #8fd3ff; white-space: nowrap; }
.crest { font-size: calc(var(--B) * .1); color: #8fd3ff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cs { position: absolute; left: 50%; top: 50%; width: var(--B); display: flex; justify-content: center; align-items: center; gap: 4px;
  font-size: calc(var(--B) * .105); font-variant-numeric: tabular-nums; color: #f0c75e; }
.cs b { position: absolute; left: 4px; font-family: var(--f-disp); font-weight: 400; color: #cfd6df; font-size: calc(var(--B) * .12); }
.cs b.dealer { color: var(--hot); }
.cs .stick { position: absolute; top: -2px; }
.cs.turn::after { content: ""; position: absolute; bottom: -3px; left: 30%; right: 30%; height: 3px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.cs0 { transform: translate(-50%, calc(var(--B) * .5 - 100%)) ; padding-bottom: 4px; }
.cs2 { transform: translate(-50%, -50%) rotate(180deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs1 { transform: translate(-50%, -50%) rotate(-90deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs3 { transform: translate(-50%, -50%) rotate(90deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs0 { transform: translate(-50%, -50%) translateY(calc(var(--B) * .5 - 50% - 4px)); padding-bottom: 0; }
.stick { display: inline-block; width: 22px; height: 4px; border-radius: 2px; background: var(--ivory); position: relative; vertical-align: middle; }
.stick::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--hot); transform: translate(-50%, -50%); }

.rv { --tw: var(--rtw); position: absolute; width: var(--rvW); height: var(--rvH); display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.rv .row { display: flex; gap: 1px; align-items: flex-end; white-space: nowrap; }
.rv0 { left: 50%; top: 100%; transform: translateX(-50%); }
.rv2 { left: 50%; bottom: 100%; transform: translateX(-50%) rotate(180deg); }
.rv1 { left: calc(100% + var(--rvH) / 2); top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
.rv3 { left: calc(var(--rvH) / -2); top: 50%; transform: translate(-50%, -50%) rotate(90deg); }

/* 相手の手牌（裏） */
.bk { display: inline-block; width: var(--otw); height: calc(var(--otw) * 1.36); border-radius: 3px; background: linear-gradient(#3a7bd0, var(--back)); box-shadow: inset 0 -3px 0 #fbfaf6, 0 1px 2px rgba(0,0,0,.4); }
.oh { position: absolute; display: flex; gap: 6px; align-items: center; }
.oh .bks { display: flex; gap: 1px; }
.oh .omelds { --tw: calc(var(--otw) * 1.05); display: flex; gap: 4px; }
.oh-top { top: 12px; left: 50%; transform: translateX(-50%); flex-direction: row-reverse; }
.oh-left, .oh-right { --otw: min(16px, calc(var(--planeH) * .046)); }
.oh-left { left: calc(var(--sl) + 80px); top: calc(var(--planeH) * .52); transform: translate(-50%, -50%) rotate(90deg); }
.oh-right { right: calc(var(--sr) + 80px); top: calc(var(--planeH) * .52); transform: translate(50%, -50%) rotate(-90deg); }

/* 名札 */
.plate { position: absolute; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px;
  background: rgba(10, 18, 28, .72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); max-width: 210px; z-index: 3; }
.plate.turn { box-shadow: inset 0 0 0 2px var(--gold), 0 0 12px rgba(242, 193, 78, .45); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff;
  background: linear-gradient(135deg, hsl(var(--hue) 55% 55%), hsl(calc(var(--hue) + 40) 55% 38%)); box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.pinfo { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.pn { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps { font-size: 12px; font-variant-numeric: tabular-nums; color: #f0c75e; display: flex; gap: 5px; }
.ps b { font-family: var(--f-disp); font-weight: 400; color: #cfd6df; }
.ps b.dealer { color: var(--hot); }
.ptags { display: flex; gap: 3px; margin-top: 2px; }
.pl-top { top: 8px; right: calc(50% + var(--otw) * 7.6 + 16px); }
/* 横幅が狭い画面（iPhone SEなど）では、上の人の名札を手牌のすぐ下に置く */
@media (max-width: 760px) {
  .tbl .pl-top { top: calc(var(--otw) * 1.36 + 18px); right: auto; left: 50%; transform: translateX(-50%) scale(.9); transform-origin: top center; }
}
.pl-left { left: calc(var(--sl) + 104px); top: calc(var(--planeH) * .3); }
.pl-right { right: calc(var(--sr) + 104px); top: calc(var(--planeH) * .3); flex-direction: row-reverse; padding: 4px 4px 4px 10px; }
.pl-right .pinfo { align-items: flex-end; }
.pl-me { left: calc(var(--sl) + 56px); bottom: calc(var(--handH) + 22px); }

/* 左上の情報・右上のボタン */
.info { position: absolute; top: 8px; left: calc(var(--sl) + 12px); z-index: 3; padding: 6px 8px; border-radius: 10px;
  background: rgba(10, 18, 28, .78); box-shadow: inset 0 0 0 1px rgba(242, 193, 78, .45); display: flex; flex-direction: column; gap: 4px; }
.info .dora { --tw: min(20px, calc(var(--planeH) * .06)); display: flex; gap: 2px; }
.info .cnt { display: flex; gap: 10px; font-size: 11px; color: #e9eef5; font-variant-numeric: tabular-nums; align-items: center; }
.info .cnt .stick { width: 16px; margin-right: 3px; }
.tops { position: absolute; top: 8px; right: calc(var(--sr) + 12px); display: flex; gap: 6px; z-index: 3; }
.tops button { background: rgba(10, 18, 28, .6); }

/* 左端の自動操作スイッチ */
.toggles { position: absolute; left: calc(var(--sl) + 12px); bottom: calc(var(--handH) + 50px); display: flex; flex-direction: column; gap: 4px; z-index: 3;
  padding: 4px; border-radius: 10px; background: rgba(10, 18, 28, .6); }
.tg { min-height: 0; width: 34px; height: 34px; padding: 0; border-radius: 8px; background: transparent; color: #9fb3c8; box-shadow: none; display: grid; place-items: center; }
.tg b { font-family: var(--f-disp); font-weight: 400; font-size: 17px; }
.tg span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tg.on { background: var(--gold); color: var(--ink); }

/* 自分の手牌と操作 */
.handrow { position: absolute; left: 0; right: 0; bottom: 0; height: var(--handH); display: flex; justify-content: center; align-items: flex-start;
  gap: 14px; padding-left: var(--sl); padding-right: var(--sr); z-index: 4; }
.handrow .hand { --tw: var(--htw); padding-top: 0; min-height: 0; gap: 1px; }
.handrow .hand .t.sel { transform: translateY(-14px); }
.mymelds { --tw: calc(var(--htw) * .7); display: flex; gap: 6px; align-self: flex-end; padding-bottom: calc(14px + var(--sb)); }
.acts { position: absolute; right: calc(var(--sr) + 16px); bottom: calc(var(--handH) + 10px); display: flex; gap: 8px; align-items: center; z-index: 5; flex-wrap: wrap; justify-content: flex-end; max-width: calc(var(--VW) * .6); }
.acts button { min-width: 76px; min-height: 46px; border-radius: 999px; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.acts button.ghost { background: rgba(10, 18, 28, .75); }
.acts .mini { --tw: 14px; display: inline-flex; vertical-align: middle; }
.acts .chiopt { --tw: 15px; }
.claimq { --tw: calc(var(--htw) * .8); display: inline-flex; margin-right: 4px; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--handH) + 12px); font-size: 12px; color: #d5dee8;
  background: rgba(10, 18, 28, .6); padding: 4px 10px; border-radius: 999px; z-index: 3; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
/* 自分の番の前に仮選択した牌：少し浮かせて点線の枠 */
.handrow .hand .t.pre { transform: translateY(-9px); outline: 2px dashed var(--gold); outline-offset: 1px; }
/* リーチの待ち：牌と残り枚数 */
.hint .waits { --tw: 22px; display: flex; align-items: center; gap: 8px; margin-left: 6px; padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, .25); }
.hint .waits b { color: #f0c75e; font-weight: 700; }
.hint .waits .w { display: inline-flex; align-items: center; gap: 3px; }
.hint .waits .w i { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
.hint .waits .w.none { opacity: .45; }
.spect { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: #d5dee8; font-size: 13px; }

/* 対局中の結果・メニューは卓の中央に（卓と一緒に回る） */
.tbl .sheet-bg { position: absolute; align-items: center; }
.tbl .sheet { max-width: 720px; max-height: calc(var(--VH) * .92); border-radius: 18px; }

/* 縦持ち（画面の自動回転がオフのときなど）：横画面を90度回して全体に表示。iPhoneを左に倒して持つ */
@media (orientation: portrait) {
  .tbl {
    --VW: 100vh; --VW: 100dvh;
    --VH: 100vw;
    --sl: env(safe-area-inset-top, 0px);
    --sr: env(safe-area-inset-bottom, 0px);
    --sb: 0px;
    inset: auto; top: 0; left: 0;
    width: var(--VW); height: var(--VH);
    transform-origin: top left;
    transform: translateX(100vw) rotate(90deg);
  }
}

/* リーチ・ポン・ロンなどの文字の演出。卓の上に重ねる（縦持ちのときは卓と同じく90度回す） */
.callfx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
@media (orientation: portrait) {
  .callfx { inset: auto; top: 0; left: 0; width: 100vh; width: 100dvh; height: 100vw; transform-origin: top left; transform: translateX(100vw) rotate(90deg); }
}
.cfx { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; }
.cfx-me { left: 50%; top: 64%; }
.cfx-top { left: 50%; top: 26%; }
.cfx-left { left: 22%; top: 46%; }
.cfx-right { left: 78%; top: 46%; }
.cfx-mid { left: 50%; top: 45%; }
.cfx > * { grid-area: 1 / 1; }
.cfx-txt {
  --fs: min(13vh, 13vw); position: relative; font-family: var(--f-disp); font-size: var(--fs); line-height: 1; letter-spacing: .04em; white-space: nowrap; padding: 0 .08em;
  background: linear-gradient(#fffbea 8%, #ffe08a 40%, #d9861d 56%, #ffe9a6 88%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 1.5px #2b1200) drop-shadow(0 4px 0 #2b1200) drop-shadow(0 0 20px rgba(255, 150, 40, .85));
  animation: cfxSlam var(--dur) cubic-bezier(.2, .9, .3, 1) both;
}
.cfx-sub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, calc(min(24vh, 22vw) * .5)); font-size: 13px; font-weight: 700; letter-spacing: .2em; color: #fff3cf; white-space: nowrap;
  text-shadow: 0 1px 0 #000, 0 0 8px rgba(0, 0, 0, .8); animation: cfxFade var(--dur) ease-out both; }
.cfx-ring { width: calc(var(--fs, 13vh) * 1.6); aspect-ratio: 1; border-radius: 50%; border: 3px solid rgba(255, 214, 120, .9);
  box-shadow: 0 0 18px rgba(255, 170, 60, .8), inset 0 0 18px rgba(255, 170, 60, .6); animation: cfxRing calc(var(--dur) * .55) ease-out both; }
.cfx-band { width: 150vmax; height: calc(var(--fs, 13vh) * .62); background: linear-gradient(90deg, transparent, rgba(0, 0, 0, .55) 25%, rgba(0, 0, 0, .55) 75%, transparent);
  border-block: 1px solid rgba(255, 214, 120, .55); animation: cfxBand var(--dur) cubic-bezier(.2, .9, .3, 1) both; }
/* ポン・チー・カン：小さめで短く */
.cfx.call .cfx-txt { --fs: min(9vh, 9vw); }
.cfx.call .cfx-ring { width: min(15vh, 15vw); }
/* リーチ：赤い炎のような色 */
.cfx.riichi .cfx-txt { background-image: linear-gradient(#fff 6%, #ffd0a8 32%, #ff5a2a 55%, #ffc36b 90%); filter: drop-shadow(0 0 1.5px #300) drop-shadow(0 4px 0 #300) drop-shadow(0 0 22px rgba(255, 80, 30, .9)); }
.cfx.riichi .cfx-band { height: min(9vh, 9vw); }
/* ツモ・ロン：特大。画面が光り、光の筋が放射状に回る */
.cfx.win .cfx-txt { --fs: min(24vh, 22vw); background-image: linear-gradient(#fff 4%, #ffe3b0 26%, #ff3b1f 54%, #8e0d05 78%, #ffb35c 96%);
  filter: drop-shadow(0 0 2px #200) drop-shadow(0 6px 0 #200) drop-shadow(0 0 30px rgba(255, 60, 20, .95)); }
.cfx.win .cfx-ring { width: min(40vh, 36vw); border-width: 5px; }
.cfx.win .cfx-band { height: min(20vh, 18vw); }
.cfx-rays { width: min(90vh, 80vw); aspect-ratio: 1; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 210, 120, .5) 0 6deg, transparent 6deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 0 20%, transparent 68%); mask: radial-gradient(circle, #000 0 20%, transparent 68%);
  animation: cfxRays var(--dur) linear both; }
.cfx-flash { position: absolute; inset: 0; background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), rgba(255, 245, 220, .95), rgba(255, 120, 40, .35) 45%, transparent 75%);
  animation: cfxFlash .55s ease-out both; }
.cfx.draw .cfx-txt { background-image: linear-gradient(#fff 8%, #cfe3ff 40%, #5a86c8 58%, #e4efff 92%); filter: drop-shadow(0 0 1.5px #001) drop-shadow(0 4px 0 #001) drop-shadow(0 0 20px rgba(90, 150, 255, .8)); }
@keyframes cfxSlam {
  0% { transform: scale(2.8); opacity: 0; }
  14% { transform: scale(.9); opacity: 1; }
  22% { transform: scale(1.06); }
  30% { transform: scale(1); }
  82% { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(1.12); opacity: 0; }
}
@keyframes cfxFade { 0%, 15% { opacity: 0; } 30%, 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes cfxRing { 0%, 12% { transform: scale(.25); opacity: 0; } 18% { opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
@keyframes cfxBand { 0%, 8% { transform: scaleX(0); opacity: 0; } 22% { transform: scaleX(1); opacity: 1; } 82% { opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
@keyframes cfxRays { 0% { transform: scale(.3) rotate(0); opacity: 0; } 15% { transform: scale(1) rotate(10deg); opacity: 1; } 80% { opacity: .9; } 100% { transform: scale(1.15) rotate(60deg); opacity: 0; } }
@keyframes cfxFlash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

/* ツモ・ロンのカットイン：画面が暗くなり、斜めの赤い帯に集中線が走って、キャラが右から飛び込む */
.cutin { position: absolute; inset: 0; animation: ciOut .3s ease-in 1.35s forwards; --sun: rgba(255, 170, 80, .85); }
.ci-dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); animation: rsFade .2s ease-out both; }
.ci-band { position: absolute; left: -4%; right: -4%; top: 20%; height: 60%; overflow: hidden;
  clip-path: polygon(0 18%, 100% 0, 100% 82%, 0 100%);
  background: linear-gradient(100deg, #1c0300 0%, #7d0f05 30%, #d63a12 58%, #ff8a3a 72%, #5a0a02 100%);
  animation: ciBand .28s cubic-bezier(.2, .9, .3, 1) both; }
.ci-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .55) 45%, transparent 55%);
  animation: ciShine .6s ease-out .2s both; }
/* 集中線：横に流れる光の筋 */
.ci-lines { position: absolute; inset: 0; opacity: .7;
  background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(255, 236, 190, .55) 40px 140px, transparent 140px 230px, rgba(255, 236, 190, .35) 230px 270px, transparent 270px 380px);
  -webkit-mask: repeating-linear-gradient(0deg, transparent 0 9px, #000 9px 11px, transparent 11px 23px, #000 23px 24px, transparent 24px 31px);
  mask: repeating-linear-gradient(0deg, transparent 0 9px, #000 9px 11px, transparent 11px 23px, #000 23px 24px, transparent 24px 31px);
  animation: ciLines .25s linear infinite; }
/* キャラ：帯の中に上半身が大きく入る */
.ci-chara { position: absolute; right: 4%; top: -4%; width: 50%; height: 200%; background-repeat: no-repeat; background-position: center top; background-size: contain;
  filter: drop-shadow(-14px 0 0 rgba(0, 0, 0, .35)) drop-shadow(0 0 18px rgba(255, 210, 140, .7));
  animation: ciChara 1.1s cubic-bezier(.12, .9, .25, 1) .06s both; }
.ci-chara.none { height: 100%; top: 0; display: grid; place-items: center; }
.ci-chara.none span { height: 80%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-disp); font-size: min(26vh, 26vw); color: #fff;
  background: linear-gradient(135deg, hsl(var(--hue) 55% 55%), hsl(calc(var(--hue) + 40) 55% 38%)); box-shadow: 0 0 0 5px rgba(255, 255, 255, .85); }
.ci-name { position: absolute; left: 8%; bottom: 20%; display: flex; flex-direction: column; font-family: var(--f-disp); font-size: min(8vh, 8vw); line-height: 1.05; color: #fff;
  text-shadow: 0 3px 0 #2a0500, 0 0 16px rgba(255, 120, 40, .9); white-space: nowrap; animation: ciName .45s cubic-bezier(.2, .9, .3, 1) .22s both; }
.ci-name small { font-family: var(--f-ui); font-weight: 700; font-size: .38em; letter-spacing: .5em; color: #ffd36b; }

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="engine.js?v=6"></script>

<script>
'use strict';
const PREFIX = 'shanai-mj-7k2q-';      // PeerJSの公開サーバーで他と重ならないための接頭辞
const WN = MJ.WIND_NAMES;
const app = document.getElementById('app');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },
};
let myPid = store.get('mj.pid');
if (!myPid) { myPid = 'p' + Math.random().toString(36).slice(2, 12); store.set('mj.pid', myPid); }
let myName = store.get('mj.name') || '';

/* ---------- キャラ（アバター） ----------
   画像は公開サイトには置かない。各自が端末に読み込んだ「キャラ素材」から選び、
   部屋の中では親機が全員に配る（親機の素材は参加者も選べる）。 */
// キャラ素材は { src: 画像, name: キャラ名（ファイル名から） } の一覧
const AV = { pack: [], mine: null, mineName: '', room: {}, roomPack: [] };
try { AV.pack = JSON.parse(store.get('mj.pack') || '[]'); } catch (e) { AV.pack = []; }
AV.pack = AV.pack.map((p) => (typeof p === 'string' ? { src: p, name: '' } : p)).filter((p) => p && p.src); // 名前のない古い形式も読める
AV.mine = store.get('mj.avatar') || null;
AV.mineName = store.get('mj.avatarName') || '';
function savePack() {
  try { localStorage.setItem('mj.pack', JSON.stringify(AV.pack)); return true; }
  catch (e) { toast('この端末に保存できる量を超えました。枚数を減らしてください'); return false; }
}
function setMine(c) {
  AV.mine = (c && c.src) || null;
  AV.mineName = (c && c.name) || '';
  if (AV.mine) store.set('mj.avatar', AV.mine); else store.del('mj.avatar');
  store.set('mj.avatarName', AV.mineName);
}
const cleanName = (s) => String(s || '').replace(/\.[a-z0-9]+$/i, '').trim().slice(0, 30);
const isImg = (s) => typeof s === 'string' && s.startsWith('data:image/') && s.length < 400000;

// 画像は大きいので、HTMLに直接書かずCSSのクラスにして使い回す
const avStyle = document.createElement('style');
document.head.appendChild(avStyle);
const avKeys = new Map();
function avClass(src) {
  if (!src) return '';
  let c = avKeys.get(src);
  if (!c) {
    c = 'avk' + (avKeys.size + 1);
    avKeys.set(src, c);
    avStyle.appendChild(document.createTextNode(`.${c}{background-image:url("${src}")}`));
  }
  return c;
}
function seatAvatar(seat) {
  const st = S.seats[seat];
  const key = st.uid || 'cpu' + seat;
  return AV.room[key] || (st.uid === myPid ? AV.mine : null);
}
// 丸いアイコン：キャラがあれば顔のあたり、なければ名前の頭文字
function avatarHTML(src, name, hue, extra) {
  if (src) return `<span class="av img ${avClass(src)} ${extra || ''}"></span>`;
  return `<span class="av ${extra || ''}" style="--hue:${hue}">${esc((name || '?').slice(0, 1))}</span>`;
}

// 端末の写真から読み込む：縦320pxに縮めて保存（透過があればPNG、なければJPEG）
function shrinkImage(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      // 部屋の人へ1枚ずつ送るので、1枚およそ180KB以内に収まるまで縮める
      let h = 320, out = null;
      for (let tries = 0; tries < 6; tries++) {
        let w = Math.round(im.width * h / im.height), hh = h;
        if (w > 448) { w = 448; hh = Math.round(im.height * w / im.width); }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hh;
        const g = cv.getContext('2d');
        g.imageSmoothingQuality = 'high';
        g.drawImage(im, 0, 0, w, hh);
        const corner = g.getImageData(0, 0, 1, 1).data[3];
        out = corner < 250 ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82);
        if (out.length <= 180000) break;
        h = Math.round(h * 0.8);
      }
      URL.revokeObjectURL(url);
      resolve(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    im.src = url;
  });
}
async function importPack(files) {
  let n = 0;
  // 前に読み込んだ名前なしのキャラだけなら、読み込み直しで置き換える
  if (AV.pack.length && AV.pack.every((p) => !p.name)) AV.pack = [];
  for (const f of files) {
    // 「ファイル」から選ぶと種類が空のことがあるので、拡張子でも判定する
    if (!f.type.startsWith('image/') && !/\.(png|jpe?g|webp|gif|heic)$/i.test(f.name)) continue;
    const src = await shrinkImage(f);
    if (!src) continue;
    const name = cleanName(f.name);
    const same = AV.pack.findIndex((p) => (name && p.name === name) || p.src === src);
    if (same >= 0) AV.pack[same] = { src, name }; else AV.pack.push({ src, name }); // 同じキャラは上書き
    n++;
  }
  if (n && savePack()) toast(`${n}枚のキャラを読み込みました`);
  render();
}

// role: home | host | client | local
let role = 'home';
let code = '';
let HS = null;          // 親機が持つ完全な状態
let S = null;           // 画面に出す状態（自分の手牌以外は伏せてある）
let peer = null, hostConn = null;
const conns = new Map(); // 親機: pid -> 接続
let net = 'ok';          // ok | connecting | lost
let leaving = false;
let ui = { sel: null, riichi: false, menu: false, yaku: false };
let botTimer = null, retryTimer = null, wakeLock = null, autoTimer = null;
// 左端のスイッチ：和＝自動で和了、鳴＝鳴きをすべてスキップ、切＝ツモ切り
let auto = { win: false, nocall: false, giri: false };
try { auto = Object.assign(auto, JSON.parse(store.get('mj.auto') || '{}')); } catch (e) { /* 初期値のまま */ }

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2800);
}

/* ---------- 親機：状態を持ち、操作を受け付け、各自に見せてよい分だけ送る ---------- */

function viewFor(full, seat) {
  const V = MJ.clone(full);
  if (V.phase === 'lobby' || V.phase === 'end') return V;
  V.wall = V.wall.map(() => 0);
  V.dead = V.dead.map((x, i) => (i >= 4 && i < 4 + V.doraCount ? x : null));
  V.players.forEach((p, i) => { if (i !== seat) p.hand = p.hand.map(() => null); });
  if (V.turn !== seat) V.drawn = null;
  if (V.claim) {
    const mine = V.claim.options[seat];
    V.claim.options = mine ? { [seat]: mine } : {};
    const r = V.claim.responses[seat];
    V.claim.responses = r ? { [seat]: r } : {};
  }
  return V;
}

function hostSeatOf(pid) { return HS.seats.findIndex((s) => s.uid === pid); }

function hostCommit() {
  HS.seq++;
  for (const [pid, c] of conns) {
    if (c.open) sendMsg(c, { t: 'state', S: viewFor(HS, hostSeatOf(pid)) });
  }
  if (role === 'host') store.set('mj.hostroom', JSON.stringify({ code, HS }));
  setView(viewFor(HS, hostSeatOf(myPid)));
  scheduleBots();
}

// 親機に届いた操作（親機自身の操作もここを通る）
function hostHandle(pid, msg) {
  const seat = hostSeatOf(pid);
  const isHost = pid === myPid;
  const lobbyOnly = () => { if (HS.phase !== 'lobby') throw new Error('対局中は変更できません'); };
  const hostOnly = () => { if (!isHost) throw new Error('親機の人だけが操作できます'); };
  switch (msg.cmd) {
    case 'apply': {
      if (seat < 0) throw new Error('席に座っていません');
      const a = Object.assign({}, msg.a, { seat });
      MJ.apply(HS, a);
      break;
    }
    case 'ready': {
      if (HS.phase !== 'result' || seat < 0) return;
      HS.ready = HS.ready || {};
      HS.ready[seat] = true;
      const humans = HS.seats.map((s, i) => (s.uid && !s.bot ? i : -1)).filter((i) => i >= 0);
      if (humans.every((i) => HS.ready[i])) MJ.apply(HS, { type: 'next' });
      break;
    }
    case 'next': if (HS.phase !== 'result') return; MJ.apply(HS, { type: 'next' }); break;
    case 'togglebot': {
      const t = HS.seats[msg.seat];
      if (!t || !t.uid) return;
      if (!isHost && msg.seat !== seat) throw new Error('ほかの人の代打ちは親機の人が切り替えます');
      t.bot = !t.bot;
      break;
    }
    case 'botseat': hostOnly(); lobbyOnly(); if (!HS.seats[msg.seat].uid) { Object.assign(HS.seats[msg.seat], { bot: true, name: 'CPU ' + 'ABCD'[msg.seat] }); cpuAvatar(msg.seat); } break;
    case 'clearseat': hostOnly(); lobbyOnly(); if (msg.seat !== hostSeatOf(myPid)) { HS.seats[msg.seat] = { uid: null, bot: false, name: '' }; hostSetAvatar('cpu' + msg.seat, null); } break;
    case 'avatar': if (msg.src === null || isImg(msg.src)) hostSetAvatar(pid, msg.src); return;
    case 'rename': if (seat < 0) return; HS.seats[seat].name = String(msg.name || '').trim().slice(0, 12) || '名無し'; break;
    case 'rule': hostOnly(); lobbyOnly(); HS.rules[msg.k] = msg.v; break;
    case 'start':
      hostOnly(); lobbyOnly();
      if (!HS.seats.every((s) => s.uid || s.bot)) throw new Error('4席すべて埋めてください');
      MJ.startGame(HS);
      break;
    case 'again': hostOnly(); if (HS.phase !== 'end') return; HS.seats.forEach((s) => { if (s.uid) s.bot = false; }); MJ.startGame(HS); break;
    case 'tolobby': {
      hostOnly();
      const seats = HS.seats.map((s) => ({ uid: s.uid, bot: s.uid ? false : s.bot, name: s.name, online: s.online }));
      const fresh = MJ.newGame(HS.rules);
      fresh.seats = seats; fresh.seq = HS.seq; fresh.hostSeat = HS.hostSeat;
      HS = fresh;
      break;
    }
    default: return;
  }
  hostCommit();
}

function hostJoin(pid, name, conn) {
  let seat = hostSeatOf(pid);
  if (seat < 0) {
    if (HS.phase !== 'lobby') { conn.send({ t: 'err', msg: '対局中のため観戦で入ります' }); }
    else {
      seat = HS.seats.findIndex((s) => !s.uid && !s.bot);
      if (seat < 0) { conn.send({ t: 'err', msg: '満席です' }); }
      else HS.seats[seat] = { uid: pid, bot: false, name: '' };
    }
  }
  if (seat >= 0) { HS.seats[seat].name = (name || '').slice(0, 12) || '名無し'; HS.seats[seat].online = true; }
  conns.set(pid, conn);
  hostCommit();
  // いま部屋にいる人のキャラと、親機のキャラ素材を新しく来た人に送る（1枚ずつ）
  for (const [k, v] of Object.entries(AV.room)) sendMsg(conn, { t: 'avatar', key: k, src: v });
  AV.pack.forEach((p, i) => sendMsg(conn, { t: 'packitem', i, src: p.src, name: p.name }));
}

// キャラを決めた・変えたことを、部屋の全員に知らせる（親機だけが呼ぶ）
function hostSetAvatar(key, src) {
  if (src) AV.room[key] = src; else delete AV.room[key];
  for (const [, c] of conns) if (c.open) sendMsg(c, { t: 'avatar', key, src: src || null });
  render();
}
// CPUの席には、親機のキャラ素材から空いているものをランダムに
function cpuAvatar(seat) {
  const used = new Set(Object.values(AV.room));
  const all = AV.pack.map((p) => p.src);
  const free = all.filter((s) => !used.has(s));
  const list = free.length ? free : all;
  hostSetAvatar('cpu' + seat, list.length ? list[Math.floor(Math.random() * list.length)] : null);
}

// CPUの手番と、立直後のツモ切りは親機が進める
function scheduleBots() {
  clearTimeout(botTimer);
  if (!HS || !['turn', 'claim'].includes(HS.phase)) return;
  let a = MJ.pendingBotAction(HS);
  if (!a && HS.phase === 'turn') {
    const p = HS.players[HS.turn];
    if (p.riichi) {
      const o = MJ.turnOptions(HS, HS.turn);
      if (!o.tsumo && !o.kans.length) a = { type: 'discard', seat: HS.turn, id: HS.drawn };
    }
  }
  if (!a) return;
  const seq = HS.seq;
  botTimer = setTimeout(() => {
    if (HS.seq !== seq) return;
    try { MJ.apply(HS, MJ.pendingBotAction(HS) || a); hostCommit(); } catch (e) { console.error(e); }
  }, 750);
}

/* ---------- 通信 ---------- */

function newCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

// PeerJSは大きいメッセージを黙って捨てるので、12000文字ずつに分けて送り、受け取った側でつなぎ直す
const CHUNK = 12000;
function sendMsg(c, obj) {
  const s = JSON.stringify(obj);
  if (s.length <= CHUNK) { c.send(obj); return; }
  const id = Math.random().toString(36).slice(2);
  const n = Math.ceil(s.length / CHUNK);
  for (let i = 0; i < n; i++) c.send({ t: 'chunk', id, i, n, d: s.slice(i * CHUNK, (i + 1) * CHUNK) });
}
const inbox = new Map();
function unchunk(msg) {
  if (!msg || typeof msg !== 'object') return null;
  if (msg.t !== 'chunk') return msg;
  if (!(msg.n > 0 && msg.n <= 200 && msg.i >= 0 && msg.i < msg.n) || typeof msg.d !== 'string') return null;
  let e = inbox.get(msg.id);
  if (!e) { e = { parts: [], got: 0 }; inbox.set(msg.id, e); if (inbox.size > 50) inbox.delete(inbox.keys().next().value); }
  if (e.parts[msg.i] === undefined) { e.parts[msg.i] = msg.d; e.got++; }
  if (e.got < msg.n) return null;
  inbox.delete(msg.id);
  try { return JSON.parse(e.parts.join('')); } catch (err) { return null; }
}

function createRoom(resume) {
  role = 'host'; leaving = false;
  ui.roomSetup = true;
  AV.room = {}; AV.roomPack = [];
  if (AV.mine) AV.room[myPid] = AV.mine;
  if (resume) { code = resume.code; HS = resume.HS; HS.seats.forEach((s, i) => { if (s.bot && !s.uid) cpuAvatar(i); }); }
  else {
    code = newCode();
    HS = MJ.newGame({ length: 'hanchan', aka: true });
    HS.seats[0] = { uid: myPid, bot: false, name: myName || '名無し', online: true };
  }
  const me = hostSeatOf(myPid);
  if (me >= 0) HS.seats[me].name = myName || '名無し';
  HS.hostSeat = me;
  HS.seats.forEach((s) => { if (s.uid && s.uid !== myPid) s.online = false; });
  openHostPeer(0, !!resume);
  hostCommit();
  history.replaceState(null, '', '?room=' + code);
}

function openHostPeer(tries, resuming) {
  net = 'connecting'; render();
  peer = new Peer(PREFIX + code);
  peer.on('open', () => { net = 'ok'; render(); });
  peer.on('connection', (c) => {
    c.on('data', (raw) => {
      const msg = unchunk(raw);
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'hello') {
        hostJoin(String(msg.pid), String(msg.name || ''), c);
        if (isImg(msg.avatar)) hostSetAvatar(String(msg.pid), msg.avatar);
        return;
      }
      const pid = [...conns].find(([, x]) => x === c);
      if (!pid) return;
      try { hostHandle(pid[0], msg); } catch (e) { sendMsg(c, { t: 'err', msg: e.message }); }
    });
    c.on('close', () => {
      for (const [pid, x] of conns) if (x === c) {
        conns.delete(pid);
        const s = hostSeatOf(pid);
        if (s >= 0) { HS.seats[s].online = false; hostCommit(); }
      }
    });
  });
  peer.on('disconnected', () => { if (!leaving) { net = 'connecting'; render(); setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); } });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') {
      peer.destroy();
      // 再開時は前の接続がサーバーに残っていることがあるので待つ。新規なら番号を変える
      if (!resuming) { code = newCode(); history.replaceState(null, '', '?room=' + code); render(); }
      if (tries < 10) setTimeout(() => openHostPeer(tries + 1, resuming), resuming ? 3000 : 200);
      else { net = 'lost'; render(); toast('部屋を開けませんでした。ページを開き直してください'); }
      return;
    }
    if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { net = 'lost'; render(); }
  });
}

function joinRoom(c) {
  if (!/^\d{4}$/.test(c)) return toast('部屋番号は4桁の数字です');
  ui.roomSetup = true;
  role = 'client'; code = c; leaving = false; S = null;
  history.replaceState(null, '', '?room=' + code);
  net = 'connecting'; render();
  peer = new Peer();
  peer.on('open', connectHost);
  peer.on('disconnected', () => { if (!leaving) setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); });
  peer.on('error', (e) => {
    if (e.type === 'peer-unavailable') { net = 'lost'; render(); retry(4000); return; }
    if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { net = 'lost'; render(); }
  });
}

function connectHost() {
  if (leaving || !peer || peer.destroyed) return;
  if (peer.disconnected) { peer.reconnect(); retry(2000); return; }
  net = S ? 'connecting' : net; render();
  const c = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
  hostConn = c;
  c.on('open', () => { net = 'ok'; sendMsg(c, { t: 'hello', pid: myPid, name: myName || '名無し', avatar: AV.mine }); render(); });
  c.on('data', (raw) => {
    const msg = unchunk(raw);
    if (!msg) return;
    if (msg.t === 'state') setView(msg.S);
    if (msg.t === 'err') toast(msg.msg);
    if (msg.t === 'avatar' && typeof msg.key === 'string') {
      if (isImg(msg.src)) AV.room[msg.key] = msg.src; else delete AV.room[msg.key];
      render();
    }
    if (msg.t === 'packitem' && isImg(msg.src) && msg.i >= 0 && msg.i < 60) { AV.roomPack[msg.i] = { src: msg.src, name: cleanName(msg.name) }; refreshSetupGrid(); }
  });
  c.on('close', () => { if (hostConn === c && !leaving) { net = 'lost'; render(); retry(2000); } });
}

function retry(ms) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (role === 'client' && !leaving && !(hostConn && hostConn.open)) connectHost(); }, ms);
}

function send(msg) {
  if (role === 'host' || role === 'local') {
    try { hostHandle(myPid, msg); } catch (e) { toast(e.message); }
  } else if (hostConn && hostConn.open) sendMsg(hostConn, msg);
  else toast('親機とつながっていません。再接続を待ってください');
}

function leaveRoom() {
  leaving = true;
  clearTimeout(botTimer); clearTimeout(retryTimer);
  if (peer) { try { peer.destroy(); } catch (e) { /* 閉じるだけ */ } }
  peer = null; hostConn = null; conns.clear();
  if (role === 'host') store.del('mj.hostroom');
  role = 'home'; S = null; HS = null; ui = { sel: null, riichi: false, menu: false };
  AV.room = {}; AV.roomPack = [];
  history.replaceState(null, '', location.pathname);
  render();
  applyUpdateIfIdle(); // 部屋にいる間に新しい版が出ていたら、ここで更新
}

function startPractice() {
  role = 'local'; leaving = false;
  HS = MJ.newGame({ length: 'tonpu', aka: true });
  HS.seats = [{ uid: myPid, bot: false, name: myName || 'あなた' }, { uid: null, bot: true, name: 'CPU A' }, { uid: null, bot: true, name: 'CPU B' }, { uid: null, bot: true, name: 'CPU C' }];
  AV.room = {}; AV.roomPack = [];
  if (AV.mine) AV.room[myPid] = AV.mine;
  [1, 2, 3].forEach(cpuAvatar);
  MJ.startGame(HS);
  hostCommit();
}

// iPhoneが眠らないように（対応していない端末では何もしない）
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* 拒否されても続ける */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (role === 'host' || role === 'client') keepAwake();
  if (peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  if (role === 'client' && !(hostConn && hostConn.open)) retry(300);
});

let lastSeq = -1;
function setView(v) {
  S = v;
  if (S && S.seq !== lastSeq) {
    lastSeq = S.seq; ui.riichi = false;
    // 仮選択した牌は、まだ手牌にあれば自分の番まで選んだままにする
    const me = mySeat();
    if (ui.sel !== null && !(me >= 0 && S.players && S.players[me] && S.players[me].hand.includes(ui.sel))) ui.sel = null;
  }
  if (S && S.phase !== 'lobby') keepAwake();
  render();
  scheduleAuto();
}

function scheduleAuto() {
  clearTimeout(autoTimer);
  const me = mySeat();
  if (!S || me < 0 || S.seats[me].bot) return;
  let msg = null;
  if (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]) {
    const opts = S.claim.options[me];
    if (auto.win && opts.some((o) => o.t === 'ron')) msg = { t: 'ron' };
    else if (auto.nocall && !opts.some((o) => o.t === 'ron')) msg = { t: 'pass' };
    if (msg) msg = { cmd: 'apply', a: { type: 'respond', resp: msg } };
  } else if (S.phase === 'turn' && S.turn === me && !S.players[me].riichi) {
    const o = MJ.turnOptions(S, me);
    if (auto.win && o.tsumo) msg = { cmd: 'apply', a: { type: 'tsumo' } };
    else if (auto.giri && S.drawn !== null && !o.tsumo) msg = { cmd: 'apply', a: { type: 'discard', id: S.drawn } };
  }
  if (!msg) return;
  const seq = S.seq;
  autoTimer = setTimeout(() => { if (S && S.seq === seq) send(msg); }, 600);
}

// 牌の絵柄は tiles.js が描いた背景画像（クラス f<種類>、赤5は f<種類>r）
const TILE_NAMES = [...'一二三四五六七八九'].map((c) => c + '萬').concat([...'一二三四五六七八九'].map((c) => c + '筒'), [...'一二三四五六七八九'].map((c) => c + '索'), [...'東南西北白發中']);
function tile(id, cls) {
  cls = cls || '';
  if (id === null || id === undefined) return `<span class="t back ${cls}"></span>`;
  const k = id >> 2;
  const red = S && S.rules.aka && MJ.RED_IDS.includes(id);
  return `<span class="t f${k}${red ? 'r' : ''} ${cls}" data-id="${id}" role="img" aria-label="${red ? '赤' : ''}${TILE_NAMES[k]}"></span>`;
}

function meldHTML(m, owner) {
  const rel = (m.from - owner + 4) % 4;
  if (m.type === 'ankan') return `<span class="meld">${tile(null, 'sm')}${tile(m.tiles[1], 'sm')}${tile(m.tiles[2], 'sm')}${tile(null, 'sm')}</span>`;
  const others = m.tiles.filter((x) => x !== m.called && x !== m.added);
  const sideIdx = rel === 3 ? 0 : rel === 2 ? 1 : others.length;
  const parts = others.map((x) => tile(x, 'sm'));
  parts.splice(Math.min(sideIdx, parts.length), 0, tile(m.called, 'sm side'));
  if (m.added !== undefined) parts.push(tile(m.added, 'sm side'));
  return `<span class="meld">${parts.join('')}</span>`;
}

function riverHTML(seat) {
  const p = S.players[seat];
  const rows = [p.river.slice(0, 6), p.river.slice(6, 12), p.river.slice(12)];
  const last = S.lastDiscard && S.lastDiscard.seat === seat && S.phase === 'claim';
  return rows.map((row, ri) => `<div class="row">${row.map((r, i) => {
    const isLast = last && ri * 6 + i === p.river.length - 1;
    return tile(r.id, 'sm' + (r.riichi ? ' side' : '') + (r.called ? ' dim' : '') + (isLast ? ' hl' : ''));
  }).join('')}</div>`).join('');
}

/* ---------- 対局中の演出：切った牌が手から河へ飛ぶ動き、リーチ・ロンなどの大きな文字 ---------- */

const FX_POS = ['me', 'right', 'top', 'left']; // 自分から見た席の位置
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function tableSnap() {
  return {
    key: MJ.roundLabel(S) + '/' + S.honba, phase: S.phase,
    players: S.players.map((p) => ({ river: p.river.length, riichi: !!p.riichi, melds: p.melds.length, kakan: p.melds.filter((m) => m.type === 'kakan').length })),
  };
}

// 前回から増えた捨て牌・宣言・和了を拾う。局が変わった直後や途中参加のときは何もしない
function tableEvents(prev) {
  const ev = [];
  if (!prev || prev.key !== MJ.roundLabel(S) + '/' + S.honba) return ev;
  S.players.forEach((p, s) => {
    const q = prev.players[s];
    if (p.river.length === q.river + 1) ev.push({ t: 'discard', seat: s });
    if (p.riichi && !q.riichi) ev.push({ t: 'call', seat: s, text: 'リーチ', kind: 'riichi' });
    if (p.melds.length > q.melds) {
      const m = p.melds[p.melds.length - 1];
      ev.push({ t: 'call', seat: s, text: { pon: 'ポン', chi: 'チー' }[m.type] || 'カン', kind: 'call' });
    } else if (p.melds.filter((m) => m.type === 'kakan').length > q.kakan) ev.push({ t: 'call', seat: s, text: 'カン', kind: 'call' });
  });
  if (S.phase === 'result' && prev.phase !== 'result') {
    const R = S.result;
    if (R.type === 'draw') ev.push({ t: 'call', seat: -1, text: '流局', kind: 'draw' });
    else R.wins.forEach((w) => ev.push({ t: 'call', seat: w.seat, text: R.type === 'tsumo' ? 'ツモ' : 'ロン', kind: 'win', sub: nameOf(w.seat), tier: winTier(w.score) }));
  }
  return ev;
}

// 描き直す前に、自分の手牌の位置を覚えておく（切った牌をそこから飛ばす）
function handRects() {
  const r = {};
  app.querySelectorAll('.handrow .t[data-id]').forEach((el) => { r[el.dataset.id] = el.getBoundingClientRect(); });
  return r;
}

// 切った牌：手からつまみ上げて、少し浮かせながら河へ運び、置いたときに軽く沈む
function flyDiscard(seat, rects) {
  const i = (seat - viewSeat() + 4) % 4;
  const tiles = app.querySelectorAll(`.rv${i} .t`);
  const el = tiles[tiles.length - 1];
  if (!el) return;
  const end = el.getBoundingClientRect();
  let start = rects[el.dataset.id];
  if (!start) {
    const from = i === 0 ? app.querySelector('.handrow .hand') : app.querySelector(`.oh-${FX_POS[i]} .bks`);
    if (!from) return;
    start = from.getBoundingClientRect();
    if (i === 0) start = { left: start.right - end.width, top: start.top, width: end.width, height: end.height };
  }
  const dx = start.left + start.width / 2 - (end.left + end.width / 2);
  const dy = start.top + start.height / 2 - (end.top + end.height / 2);
  // 河は席ごとに回してあり、縦持ちでは卓全体も回っているので、画面上のずれを河の向きに直す
  const a = ([0, -90, 180, 90][i] + (matchMedia('(orientation: portrait)').matches ? 90 : 0)) * Math.PI / 180;
  const x = dx * Math.cos(a) + dy * Math.sin(a), y = -dx * Math.sin(a) + dy * Math.cos(a);
  const s0 = Math.min(2.6, Math.sqrt((start.width * start.height) / (end.width * end.height)) || 1);
  const tilt = (Math.random() * 2 - 1) * 6;
  el.animate([
    { translate: `${x}px ${y}px`, scale: s0, rotate: '0deg', filter: 'drop-shadow(0 2px 2px rgba(0,0,0,.4))', offset: 0 },
    { translate: `${x * .9}px ${y * .9}px`, scale: s0 * 1.08 + .12, rotate: `${tilt * .4}deg`, filter: 'drop-shadow(0 12px 10px rgba(0,0,0,.45))', offset: .16 },
    { translate: `${x * .3}px ${y * .3}px`, scale: 1.3, rotate: `${tilt}deg`, filter: 'drop-shadow(0 14px 12px rgba(0,0,0,.4))', offset: .6 },
    { translate: '0px 0px', scale: .94, rotate: '0deg', filter: 'drop-shadow(0 1px 1px rgba(0,0,0,.4))', offset: .86 },
    { translate: '0px 0px', scale: 1, rotate: '0deg', filter: 'drop-shadow(0 0 0 rgba(0,0,0,0))', offset: 1 },
  ], { duration: 460, easing: 'cubic-bezier(.35, .1, .25, 1)' });
}

// 大きな文字。席の近くにたたきつけるように出して、少しして消える
function callFx(ev) {
  let layer = document.querySelector('.callfx');
  if (!layer) { layer = document.createElement('div'); layer.className = 'callfx'; document.body.appendChild(layer); }
  const pos = ev.seat < 0 ? 'mid' : FX_POS[(ev.seat - viewSeat() + 4) % 4];
  const dur = { call: 1100, riichi: 1500, win: 2100, draw: 1600 }[ev.kind];
  const box = document.createElement('div');
  box.className = `cfx cfx-${pos} ${ev.kind}`;
  box.style.setProperty('--dur', dur + 'ms');
  box.innerHTML = (ev.kind === 'win' ? '<div class="cfx-rays"></div>' : '') +
    (ev.kind !== 'call' ? '<div class="cfx-band"></div>' : '') +
    `<div class="cfx-ring"></div><span class="cfx-txt">${esc(ev.text)}</span>${ev.sub ? `<span class="cfx-sub">${esc(ev.sub)}</span>` : ''}`;
  if (ev.kind === 'win') {
    const flash = document.createElement('div');
    flash.className = 'cfx-flash';
    const at = { me: ['50%', '64%'], top: ['50%', '26%'], left: ['22%', '46%'], right: ['78%', '46%'], mid: ['50%', '45%'] }[pos];
    flash.style.setProperty('--fx', at[0]); flash.style.setProperty('--fy', at[1]);
    layer.appendChild(flash);
    const bx = parseFloat(at[0]) / 100 * layer.offsetWidth, by = parseFloat(at[1]) / 100 * layer.offsetHeight;
    setTimeout(() => burst(layer, bx, by, 50 + (ev.tier || 0) * 20, TIER_COLORS[ev.tier || 0], 1.3), 150);
    setTimeout(() => flash.remove(), 600);
    const plane = app.querySelector('.plane');
    if (plane && !reduceMotion()) plane.animate([{ translate: '0 0' }, { translate: '-6px 4px' }, { translate: '5px -3px' }, { translate: '-3px 2px' }, { translate: '0 0' }], { duration: 320, delay: 120 });
  }
  layer.appendChild(box);
  setTimeout(() => box.remove(), dur + 50);
}

// 和了の大きさで演出の段階を変える：0 通常、1 満貫・跳満（金）、2 倍満・三倍満（紫）、3 役満（虹）
function winTier(sc) {
  if (!sc) return 0;
  if (sc.yakuman || /役満/.test(sc.limit || '')) return 3;
  if (/倍満/.test(sc.limit || '')) return 2;
  return sc.limit ? 1 : 0;
}
const TIER_COLORS = [
  ['#fff3c4', '#ffb347', '#ff5a2a', '#ffffff'],
  ['#fff6d0', '#ffd84a', '#ffae00', '#ffffff'],
  ['#ffe6ff', '#d68cff', '#ffd84a', '#ffffff'],
  ['#ff5a5a', '#ffd84a', '#5aff8a', '#5ac8ff', '#c88aff', '#ffffff'],
];

// 火花・紙吹雪：box の中の (x, y) px から n 個はじけ飛ぶ
function burst(box, x, y, n, colors, power, confetti) {
  if (!box || reduceMotion()) return;
  const wrap = document.createElement('div');
  wrap.className = 'sparks';
  wrap.style.left = x + 'px'; wrap.style.top = y + 'px';
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i');
    const a = Math.random() * Math.PI * 2, d = (70 + Math.random() * 240) * (power || 1);
    s.style.cssText = `--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--c:${colors[i % colors.length]};--s:${.5 + Math.random() * 1.2};--t:${550 + Math.random() * 650}ms;--r:${Math.random() * 1080 - 540}deg`;
    if (confetti) s.className = 'rect'; else if (Math.random() < .35) s.className = 'star';
    wrap.appendChild(s);
  }
  box.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1400);
}

// ツモ・ロンの前のカットイン：画面が光って斜めの帯が走り、和了した人のキャラが残像を引いて飛び込む。
// 着地で画面が揺れて火花がはじける。満貫以上は金・紫・虹と派手になっていく
const CUTIN_MS = 1600;
let fxTimers = [];
function cutIn(ev) {
  let layer = document.querySelector('.callfx');
  if (!layer) { layer = document.createElement('div'); layer.className = 'callfx'; document.body.appendChild(layer); }
  const src = seatAvatar(ev.seat), nm = nameOf(ev.seat), tier = ev.tier || 0;
  const word = ev.text === 'ツモ' ? 'TSUMO' : 'RON';
  const chara = (cls) => (src ? `<div class="ci-chara ${cls} ${avClass(src)}"></div>` : '');
  const el = document.createElement('div');
  el.className = `cutin tier${tier}` + (reduceMotion() ? ' calm' : '');
  el.innerHTML = `<div class="ci-dim"></div><div class="ci-sun"></div>
    <div class="ci-wrap"><div class="ci-band"><div class="ci-lines"></div><div class="ci-marq">${(word + ' ').repeat(6)}</div>
      ${chara('ghost g1')}${chara('ghost g2')}
      ${src ? chara('main') : `<div class="ci-chara none" style="--hue:${(ev.seat * 83 + 200) % 360}"><span>${esc(nm.slice(0, 1))}</span></div>`}
      <div class="ci-name"><small>${word}</small>${esc(nm)}</div></div></div>
    <div class="ci-impact"></div>`;
  layer.appendChild(el);
  const W = layer.offsetWidth, H = layer.offsetHeight, colors = TIER_COLORS[tier];
  fxTimers.push(setTimeout(() => burst(el, W * .7, H * .48, 40 + tier * 25, colors, 1 + tier * .3), 300));
  if (tier >= 1) fxTimers.push(setTimeout(() => burst(el, W * .2, H * .62, 30 + tier * 15, colors, 1.1), 520));
  if (tier >= 2) fxTimers.push(setTimeout(() => burst(el, W * .5, H * .3, 50, colors, 1.6), 800));
  if (tier >= 3) fxTimers.push(setTimeout(() => { burst(el, W * .85, H * .25, 60, colors, 1.8); burst(el, W * .15, H * .3, 60, colors, 1.8); }, 1050));
  fxTimers.push(setTimeout(() => el.remove(), CUTIN_MS + 400));
}

function clearTableFx() {
  fxPrev = null; resultHoldUntil = 0; clearTimeout(resultHoldTimer);
  fxTimers.forEach(clearTimeout); fxTimers = [];
  const layer = document.querySelector('.callfx');
  if (layer) layer.innerHTML = '';
}

/* ---------- 画面 ---------- */

function render() {
  app.classList.remove('is-game');
  document.body.classList.remove('in-game');
  if (!S || S.phase === 'lobby' || S.phase === 'end' || role === 'home') clearTableFx();
  if (role === 'home') { app.innerHTML = homeHTML(); startFx(); showPicked(); return; }
  cancelAnimationFrame(fxRaf);
  if (!S) { app.innerHTML = connectingHTML(); startFx(); return; }
  if (S.phase === 'lobby') {
    // 入力中の名前を消さないよう、名前とキャラの画面が出ている間は席の部分だけ描き直す
    const typing = document.activeElement && document.activeElement.id === 'name' && app.querySelector('.room-setup');
    if (typing) {
      const fresh = document.createElement('div');
      fresh.innerHTML = lobbyHTML();
      const seatsNew = fresh.querySelector('.room-seats'), seatsOld = app.querySelector('.room-seats');
      if (seatsNew && seatsOld) seatsOld.replaceWith(seatsNew);
      return;
    }
    app.innerHTML = lobbyHTML();
    ui.lobbyShown = true; // 2回目以降の描き直しでは登場アニメーションを繰り返さない
    startFx();
    showPicked();
    return;
  }
  app.classList.add('is-game');
  document.body.classList.add('in-game');
  const events = tableEvents(fxPrev);
  fxPrev = tableSnap();
  // ツモ・ロン・流局は、文字の演出が終わってから結果の画面を出す
  // ツモ・ロンは、和了した人ごとにカットインを出してから文字を出す（ダブロンは1人ずつ順番に）
  const wins = events.filter((e) => e.kind === 'win');
  const winTextAt = wins.length * CUTIN_MS;
  const ender = events.find((e) => e.kind === 'win' || e.kind === 'draw');
  if (ender) {
    resultHoldUntil = Date.now() + (ender.kind === 'win' ? winTextAt + 2000 : 1500);
    clearTimeout(resultHoldTimer);
    resultHoldTimer = setTimeout(render, resultHoldUntil - Date.now() + 20);
  }
  const rects = events.length ? handRects() : null;
  app.innerHTML = gameHTML();
  for (const e of events) {
    if (e.t === 'discard') { if (!reduceMotion()) flyDiscard(e.seat, rects); } else if (e.kind !== 'win') callFx(e);
  }
  wins.forEach((e, i) => {
    fxTimers.push(setTimeout(() => { cutIn(e); gsfx('cutin'); }, i * CUTIN_MS));
    if (e.tier) fxTimers.push(setTimeout(() => gsfx('tierup'), i * CUTIN_MS + 320));
    fxTimers.push(setTimeout(() => callFx(e), winTextAt));
  });
  if (wins.length) fxTimers.push(setTimeout(() => gsfx('win'), winTextAt));
  // 音：同時に起きたことは一番大きいものだけ鳴らす（和了の音はカットインのあと）
  const kinds = events.map((e) => (e.t === 'discard' ? 'discard' : e.kind));
  const loud = ['draw', 'riichi', 'call', 'discard'].find((k) => kinds.includes(k));
  if (loud && !wins.length) gsfx(loud);
  if (loud === 'riichi' && kinds.includes('discard')) gsfx('discard');
  // 自分の番・自分が鳴けるときに、軽く知らせる
  const me = mySeat();
  const myCue = me >= 0 && !S.seats[me].bot && ((S.phase === 'turn' && S.turn === me) || (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]));
  if (myCue && !render.myCue && events.length) setTimeout(() => gsfx('myturn'), 420);
  render.myCue = myCue;
  resTick();
}

function netNote() {
  if (net === 'ok') return '';
  if (net === 'connecting') return `<p class="muted">接続しています…</p>`;
  return role === 'client'
    ? `<p class="muted">親機とつながっていません。親機の人がこのページを開いているか確認してください。自動でつなぎ直します。</p>`
    : `<p class="muted">接続が切れています。自動でつなぎ直します。</p>`;
}

    <input type="file" id="packfile" class="packinput" accept="image/*,.png,.jpg,.jpeg,.webp,.heic" multiple hidden>

// 火の粉
let fxRaf = 0;
const embers = [];
function startFx() {
  cancelAnimationFrame(fxRaf);
  const cv = document.getElementById('mhfx');
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = cv.getContext('2d');
  const loop = () => {
    if (!cv.isConnected) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth * dpr, h = cv.clientHeight * dpr;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    ctx.clearRect(0, 0, w, h);
    while (embers.length < 70) {
      embers.push({ x: Math.random() * w, y: h + Math.random() * h * .3, vy: -(0.4 + Math.random() * 1.1) * dpr,
        sway: Math.random() * 6.28, r: (0.8 + Math.random() * 2.2) * dpr, life: 0, max: 280 + Math.random() * 260 });
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.life++; e.y += e.vy; e.sway += 0.03; e.x += Math.sin(e.sway) * 0.5 * dpr;
      const a = Math.max(0, Math.min(1, e.life / 40, (e.max - e.life) / 80)) * (0.6 + Math.random() * 0.4);
      if (e.life > e.max || e.y < -10) { embers.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 3);
      g.addColorStop(0, `rgba(255,214,140,${a})`); g.addColorStop(.4, `rgba(255,140,40,${a * .6})`); g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 3, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    fxRaf = requestAnimationFrame(loop);
  };
  fxRaf = requestAnimationFrame(loop);
}

// 効果音（WebAudioで合成。最初のタップから鳴る）
let actx = null;
function sfx(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const tone = (freq, at, dur, type, vol) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t + at);
      g.gain.setValueAtTime(0.0001, t + at);
      g.gain.exponentialRampToValueAtTime(vol, t + at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t + at); o.stop(t + at + dur + 0.02);
    };
    // 短い雑音（牌が卓に当たる音・点棒の音に使う）
    const noise = (at, dur, freq, q, vol) => {
      if (!sfx.noiseBuf) {
        const b = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        sfx.noiseBuf = b;
      }
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = sfx.noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(vol, t + at); g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      s.connect(f); f.connect(g); g.connect(actx.destination);
      s.start(t + at); s.stop(t + at + dur + 0.02);
    };
    const sweep = (f0, f1, at, dur, type, vol) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(f1, t + at + dur);
      g.gain.setValueAtTime(0.0001, t + at); g.gain.exponentialRampToValueAtTime(vol, t + at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      o.connect(g); g.connect(actx.destination); o.start(t + at); o.stop(t + at + dur + 0.02);
    };
    switch (kind) {
      case 'start': tone(392, 0, .5, 'triangle', .09); tone(523, .08, .5, 'triangle', .08); tone(784, .16, .7, 'triangle', .07); break;
      case 'back': tone(440, 0, .12, 'square', .03); break;
      // ここから対局中の音
      case 'pick': noise(0, .03, 3800, 2, .12); break; // 牌を選んだ
      case 'discard': // 牌を河に置く「カチッ」（飛ぶ動きの着地に合わせて少し遅らせる）
        noise(.36, .05, 2600, 3, .5); noise(.36, .09, 900, 1.5, .25); tone(170, .36, .06, 'sine', .12); break;
      case 'call': // ポン・チー・カン
        tone(660, 0, .1, 'square', .05); tone(990, .08, .18, 'square', .05); noise(0, .05, 2000, 2, .2); break;
      case 'riichi': // リーチ：駆け上がる音と、点棒を置く音
        sweep(220, 880, 0, .35, 'sawtooth', .05); tone(1175, .3, .5, 'triangle', .08); tone(1568, .38, .6, 'triangle', .06); noise(.32, .06, 3000, 4, .3); break;
      case 'cutin': // カットイン：風を切る音と、キャラが止まるときの「ガッ」
        noise(0, .35, 1200, .7, .35); sweep(300, 1400, 0, .3, 'sawtooth', .04);
        noise(.28, .12, 700, 1, .5); tone(98, .28, .35, 'sine', .3); tone(1760, .32, .5, 'triangle', .05); break;
      case 'tierup': // 満貫以上：きらきら駆け上がる
        [1047, 1319, 1568, 2093, 2637, 3136].forEach((f, i) => tone(f, i * .055, .45, 'triangle', .05));
        noise(0, .3, 7000, 2, .08); break;
      case 'win': // ツモ・ロン：ドンと鳴って和音がきらめく
        tone(55, 0, .5, 'sine', .35); noise(0, .25, 300, .8, .4);
        [523, 659, 784, 1047].forEach((f, i) => tone(f, .05 + i * .06, 1.1, 'triangle', .07));
        [2093, 2637, 3136].forEach((f, i) => tone(f, .3 + i * .08, .5, 'sine', .03)); break;
      case 'draw': tone(392, 0, .5, 'triangle', .07); tone(330, .18, .5, 'triangle', .07); tone(262, .36, .9, 'triangle', .07); break;
      case 'myturn': tone(1046, 0, .12, 'sine', .05); tone(1318, .07, .2, 'sine', .04); break; // 自分の番になった
      case 'yaku': tone(1318, 0, .08, 'triangle', .04); noise(0, .04, 4000, 3, .08); break; // 役が1つ出た
      case 'stamp': tone(80, 0, .3, 'sine', .3); noise(0, .15, 500, 1, .45); tone(1568, .05, .6, 'triangle', .05); break; // 満貫などのハンコ
      case 'total': [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .05, .4, 'triangle', .06)); break;
      case 'coins': // 点数が動くチャリチャリ
        for (let i = 0; i < 9; i++) { tone(2400 + Math.random() * 900, i * .12, .09, 'sine', .035); noise(i * .12, .03, 6000, 5, .06); } break;
      default: tone(880, 0, .09, 'square', .035); tone(1320, .06, .16, 'triangle', .05);
    }
  } catch (e) { /* 音が出せない環境では無音 */ }
}
// 対局中の音は、右上の「音」ボタンで止められる
let soundOn = store.get('mj.sound') !== '0';
const gsfx = (kind) => { if (soundOn) sfx(kind); };
// iPhoneは画面に触れるまで音を出せないので、最初のタップで準備しておく
document.addEventListener('pointerdown', () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { /* 無音 */ }
}, { passive: true });

// 結果画面の音を、演出の時間に合わせて鳴らす（途中から描き直したり飛ばしたりしたら、その時点から鳴らし直す）
let resSfxStart = 0, resSfxTimers = [];
function scheduleResultSfx(list) {
  if (resSfxStart === resStart) return;
  resSfxStart = resStart;
  resSfxTimers.forEach(clearTimeout);
  const now = Date.now() - resStart;
  resSfxTimers = list.filter((x) => x.at >= now - 50).map((x) => setTimeout(() => {
    if (!S || S.phase !== 'result') return;
    if (x.kind === 'confetti') return app.querySelectorAll('.rs-row.win').forEach((r) => resBurst(r, 46, TIER_COLORS[3], 1.3, true));
    gsfx(x.kind);
    if (x.kind === 'stamp') resBurst(app.querySelector('.rs-limit'), 50, TIER_COLORS[x.tier || 1], 1.2);
    if (x.kind === 'total') resBurst(app.querySelector('.rs-total b'), 30, TIER_COLORS[x.tier || 0], .9);
  }, Math.max(0, x.at - now)));
}
// 結果画面の部品の真ん中から火花を出す（縦持ちで回っていても狂わないよう、位置は offset で測る）
function resBurst(el, n, colors, power, confetti) {
  const root = app.querySelector('.rs');
  if (!el || !root) return;
  let x = el.offsetWidth / 2, y = el.offsetHeight / 2, p = el;
  while (p && p !== root) { x += p.offsetLeft; y += p.offsetTop; p = p.offsetParent; }
  if (p !== root) return;
  burst(root, x, y, n, colors, power, confetti);
}
