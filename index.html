<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d2629">
<meta name="apple-mobile-web-app-title" content="社内麻雀卓">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>社内麻雀卓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=7">
<style>
[hidden] { display: none !important; }
body { margin: 0; padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--ivory); border: 0; border-radius: 10px;
  padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box;
}
input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.code { font-family: var(--f-disp); font-size: 52px; letter-spacing: .18em; line-height: 1; font-variant-numeric: tabular-nums; }
.codebox { background: var(--rail); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.join { display: flex; gap: 8px; }
.join input { flex: 1; letter-spacing: .2em; text-align: center; }
.join button { flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6fd39b; display: inline-block; flex: none; }
.dot.off { background: #ff9a85; }
.net { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.or { color: var(--muted); font-size: 12px; text-align: center; letter-spacing: .1em; }
/* タイトル画面：夕暮れの山並みと火の粉。金と青銅の枠のパネルに、項目が右からすべり込む */
.mh {
  --mh-gold: #d8b25a; --mh-gold-hi: #fff2c4; --mh-gold-lo: #7a5420; --mh-text: #f3e6c4; --mh-dim: #b9a072;
  position: fixed; inset: 0; overflow: hidden; z-index: 1; color: var(--mh-text);
  background:
    radial-gradient(ellipse 90% 55% at 50% 105%, rgba(150, 62, 18, .75) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(40, 70, 80, .5) 0%, transparent 70%),
    linear-gradient(#0a1216 0%, #142229 40%, #2a1a0e 100%);
}
.mh.is-title { cursor: pointer; }
.mh-far, .mh-near { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
.mh-far { height: 58%; background: #18130f; opacity: .8;
  clip-path: polygon(0 55%, 8% 40%, 17% 52%, 28% 22%, 37% 44%, 46% 30%, 55% 48%, 66% 18%, 76% 42%, 86% 28%, 100% 46%, 100% 100%, 0 100%); }
.mh-near { height: 40%; background: #0b0806;
  clip-path: polygon(0 40%, 10% 62%, 21% 34%, 33% 58%, 44% 40%, 58% 66%, 69% 36%, 80% 56%, 91% 30%, 100% 52%, 100% 100%, 0 100%); }
.mh-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mh-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .7)); }

.mh-logo { position: absolute; display: flex; align-items: center; gap: 14px; pointer-events: none; }
.mh-logo.big { left: 50%; top: 44%; transform: translate(-50%, -50%); flex-direction: column; gap: 6px; text-align: center; animation: mhLogoIn 1.2s cubic-bezier(.2, .8, .2, 1) both; }
.mh-logo.small { left: max(18px, env(safe-area-inset-left, 0px)); top: max(14px, env(safe-area-inset-top, 0px)); animation: mhFadeDown .5s ease-out both; }
.mh-crest { width: clamp(70px, 16vh, 120px); height: auto; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)) drop-shadow(0 0 16px rgba(255, 170, 60, .25)); }
.mh-logo.small .mh-crest { width: 46px; }
.mh-title { display: flex; flex-direction: column; align-items: center; }
.mh-logo.small .mh-title { align-items: flex-start; }
.mh-ja {
  font-family: var(--f-disp); font-size: clamp(44px, 12vh, 92px); line-height: 1.05; letter-spacing: .1em; padding: 0 .1em;
  background:
    linear-gradient(110deg, transparent 42%, rgba(255, 255, 255, .95) 50%, transparent 58%) -150% 0 / 250% 100% no-repeat,
    linear-gradient(#fff6d6 0%, #f0cf7a 38%, #a8741f 52%, #e2bb62 70%, #fff0c0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #2e1a06) drop-shadow(0 0 22px rgba(255, 160, 50, .35));
  animation: mhShine 4.5s ease-in-out 1.2s infinite;
}
.mh-logo.small .mh-ja { font-size: 26px; animation: none; }
.mh-en { font-size: 11px; letter-spacing: .42em; color: var(--mh-gold); margin-top: 4px; text-shadow: 0 1px 0 #000; }
.mh-logo.small .mh-en { font-size: 9px; letter-spacing: .3em; }
.mh-press { position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%); white-space: nowrap;
  font-family: var(--f-disp); font-size: clamp(16px, 4.2vh, 22px); letter-spacing: .25em; color: var(--mh-text);
  text-shadow: 0 0 12px rgba(255, 190, 90, .8), 0 2px 0 #000; animation: mhBlink 1.6s ease-in-out infinite, mhFadeUp .8s ease-out .9s both; }
.mh-foot { position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-size: 11px; letter-spacing: .2em; color: rgba(243, 230, 196, .5); white-space: nowrap; pointer-events: none; }

.mh-stage { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: min(460px, 56vw); }
.mh-panel {
  position: relative; border-radius: 6px; overflow: hidden;
  background: linear-gradient(rgba(42, 28, 14, .94), rgba(16, 11, 6, .96));
  border: 2px solid var(--mh-gold);
  box-shadow: inset 0 0 0 1px #3a2610, inset 0 0 40px rgba(0, 0, 0, .7), 0 0 0 4px rgba(0, 0, 0, .55), 0 14px 34px rgba(0, 0, 0, .65);
  animation: mhPanelIn .4s cubic-bezier(.2, .8, .2, 1) both;
}
.mh-panel::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(216, 178, 90, .3); border-radius: 3px; pointer-events: none; }
.mh-head { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 14px;
  background: linear-gradient(#6e4b1b, #3a250b); border-bottom: 2px solid var(--mh-gold); }
.mh-head h2 { margin: 0; font-family: var(--f-disp); font-weight: 400; font-size: 18px; letter-spacing: .25em; color: #fbe7b0; text-shadow: 0 2px 0 #000; }
.mh-gem { width: 9px; height: 9px; transform: rotate(45deg); background: linear-gradient(135deg, #ffe9a8, #b8862d); box-shadow: 0 0 8px rgba(255, 207, 106, .8); }
.mh-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 150px); overflow-y: auto; }
.mh-list { display: flex; flex-direction: column; gap: 3px; margin: -4px -6px; }
.mh-item {
  position: relative; display: grid; text-align: left; gap: 1px; min-height: 46px; padding: 7px 12px 7px 32px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .045), transparent 85%); color: var(--mh-text);
  border: 1px solid transparent; border-radius: 3px; box-shadow: none; font-weight: 700;
  animation: mhItemIn .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 65ms + 150ms);
}
.mh-item:active { transform: none; }
.mh-lbl { font-family: var(--f-disp); font-weight: 400; font-size: 19px; letter-spacing: .14em; text-shadow: 0 2px 0 #000; }
.mh-sub { font-size: 11px; font-weight: 500; color: var(--mh-dim); }
.mh-cur { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #ffd36b; opacity: 0; text-shadow: 0 0 8px #ffb84a; }
.mh-item:hover, .mh-item:focus-visible, .mh-item:active {
  outline: none; border-color: rgba(255, 214, 120, .65);
  background: linear-gradient(90deg, rgba(232, 178, 74, .38), rgba(232, 178, 74, .06) 85%);
}
.mh-item:hover .mh-cur, .mh-item:focus-visible .mh-cur, .mh-item:active .mh-cur { opacity: 1; animation: mhCur .5s ease-in-out infinite alternate; }
.mh-field { display: flex; flex-direction: column; gap: 6px; }
.mh-field > span { font-size: 12px; letter-spacing: .15em; color: var(--mh-gold); }
.mh-field input { background: #0d0905; color: #fbe7b0; border: 1px solid #8a6a2a; border-radius: 4px; font-family: var(--f-disp); font-size: 20px; letter-spacing: .08em; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .7); }
.mh-field input.mh-code { font-size: 30px; letter-spacing: .5em; text-align: center; padding-left: .5em; }
.mh-field input::placeholder { color: #5b4a2a; }
.mh-note { margin: 0; font-size: 12px; color: var(--mh-dim); }
.mh-help p { margin: 0 0 8px; font-size: 13px; line-height: 1.75; color: var(--mh-text); }
.mh-help b { color: #ffd98a; }
.mh-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 0 14px 14px; }
.mh-btn { min-width: 110px; font-family: var(--f-disp); font-weight: 400; font-size: 17px; letter-spacing: .2em; color: #fbe7b0;
  background: linear-gradient(#80581f, #3c2709); border: 1px solid #d1a752; border-radius: 4px; box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255, 240, 200, .35); }
.mh-btn.ghost { background: rgba(0, 0, 0, .35); border-color: #6b5426; color: var(--mh-dim); }

.mh-who { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid rgba(216, 178, 90, .55); border-radius: 4px;
  background: linear-gradient(90deg, rgba(40, 26, 12, .9), rgba(40, 26, 12, .4)); animation: mhFadeUp .5s ease-out .2s both; }
.mh-who .av { width: 30px; height: 30px; font-size: 14px; }
.mh-who span { font-size: 10px; letter-spacing: .25em; color: var(--mh-gold); display: block; }
.mh-who b { font-family: var(--f-disp); font-weight: 400; font-size: 17px; letter-spacing: .08em; color: #fbe7b0; }

/* 横向きで画面の高さが低いときは項目を詰める */
@media (orientation: landscape) and (max-height: 460px) {
  .mh-item { min-height: 0; padding: 4px 12px 4px 30px; }
  .mh-lbl { font-size: 16px; line-height: 1.25; }
  .mh-sub { font-size: 10px; line-height: 1.3; }
  .mh-head { padding: 5px 14px; }
  .mh-head h2 { font-size: 15px; }
  .mh-body { padding: 10px 12px; max-height: calc(100vh - 90px); }
}

/* 対局中は画面を動かさない（縦持ちで回転表示したときにはみ出してもスクロールさせない） */
body.in-game { overflow: hidden; }
html:has(body.in-game) { overflow: hidden; }

/* キャラ */
.av.img { background-color: #1a120a; background-repeat: no-repeat; background-size: 150% auto; background-position: center 8%; }
.av.lg { width: 44px; height: 44px; }
.mh-chara { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 0; width: min(40vw, 520px); height: 82vh;
  background-repeat: no-repeat; background-position: left bottom; background-size: contain; pointer-events: none;
  filter: drop-shadow(0 0 18px rgba(255, 170, 60, .35)) drop-shadow(0 6px 10px rgba(0, 0, 0, .6)); animation: mhCharaIn .7s cubic-bezier(.2, .8, .2, 1) both; }
.mh-who { z-index: 2; }
.mh-chars { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.mh-char { flex: none; width: 66px; height: 86px; padding: 0; min-height: 0; border-radius: 6px; background: rgba(0, 0, 0, .45);
  border: 1px solid #6b5426; box-shadow: none; display: grid; place-items: center; color: var(--mh-dim); font-weight: 500; font-size: 12px; }
.mh-char .ch { width: 100%; height: 100%; background-repeat: no-repeat; background-position: center bottom; background-size: contain; }
.mh-char.on { border: 2px solid #ffd36b; box-shadow: 0 0 10px rgba(255, 211, 107, .6); background: rgba(232, 178, 74, .18); }
.sheet .mh-chars { --mh-dim: #b9a072; }
.mh-packbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.mh-btn.small { min-width: 0; min-height: 34px; padding: 4px 12px; font-size: 13px; letter-spacing: .08em; }
.winner { display: flex; align-items: flex-end; gap: 12px; }
.winchara { width: 90px; height: 110px; flex: none; background-repeat: no-repeat; background-position: center bottom; background-size: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
@keyframes mhCharaIn { from { opacity: 0; translate: -30px 0; } to { opacity: 1; translate: 0 0; } }
@media (orientation: portrait) { .mh-chara { width: 70vw; height: 46vh; bottom: 40vh; opacity: .9; } }

/* 縦向き：ロゴを上に、パネルを下に */
@media (orientation: portrait) {
  .mh-stage { left: 16px; right: 16px; width: auto; top: auto; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: none; }
  .mh-logo.big { top: 40%; }
  .mh-body { max-height: 62vh; }
}

@keyframes mhLogoIn { from { opacity: 0; transform: translate(-50%, -50%) scale(1.25); filter: blur(8px); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); } }
@keyframes mhShine { 0%, 55% { background-position: -150% 0, 0 0; } 85%, 100% { background-position: 250% 0, 0 0; } }
@keyframes mhBlink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes mhFadeUp { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }
@keyframes mhFadeDown { from { opacity: 0; translate: 0 -10px; } to { opacity: 1; translate: 0 0; } }
@keyframes mhPanelIn { from { opacity: 0; clip-path: inset(0 0 100% 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
@keyframes mhItemIn { from { opacity: 0; translate: 40px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes mhCur { from { translate: -3px 0; } to { translate: 2px 0; } }
@media (prefers-reduced-motion: reduce) {
  .mh *, .mh *::before { animation: none !important; }
}

/* 対局画面：画面全体が卓。奥行きを付けた卓面に河と点数箱、外周に相手の手牌と名札、下に自分の手牌 */
.tbl {
  /* 画面の幅・高さと端の余白。縦持ちのときは下で入れ替えて、横画面を90度回して表示する */
  --VW: 100vw;
  --VH: 100vh; --VH: 100dvh;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --htw: min(54px, calc((var(--VW) - var(--sl) - var(--sr) - 40px) / 15.6), calc(var(--VH) * .1));
  --handH: calc(var(--htw) * 1.57 + 20px + var(--sb));
  --planeH: calc(var(--VH) - var(--handH));
  touch-action: manipulation;
  --rtw: calc(var(--planeH) * .054);
  --rth: calc(var(--rtw) * 1.57);
  --rvW: calc(var(--rtw) * 6 + 5px);
  --rvH: calc(var(--rth) * 3 + 10px);
  --B: calc(var(--rvW) + 6px); /* 点数箱の幅＝河の幅にして、角で河どうしが重ならないように */
  --otw: min(18px, calc(var(--planeH) * .052));
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 50% 42%, #2f5a8c 0%, #23476f 45%, #17324f 100%);
}
.tbl::before { /* 卓の縁 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 10px #3a2618, inset 0 0 0 12px #5a3b22, inset 0 0 60px rgba(0, 0, 0, .45);
}
.plane { position: absolute; left: 0; right: 0; top: 0; height: var(--planeH); perspective: 1100px; }
.stage { position: absolute; inset: 0; transform: rotateX(17deg); transform-origin: 50% 70%; }
.stage::before { /* 卓面の対角線 */
  content: ""; position: absolute; left: 50%; top: 52%; width: calc(var(--B) + var(--rvH) * 2 + 40px); aspect-ratio: 1;
  transform: translate(-50%, -50%); border: 1px solid rgba(255, 255, 255, .09); border-radius: 6px;
  background: linear-gradient(45deg, transparent 49.8%, rgba(255,255,255,.07) 50%, transparent 50.2%), linear-gradient(-45deg, transparent 49.8%, rgba(255,255,255,.07) 50%, transparent 50.2%);
}
.pc { position: absolute; left: 50%; top: 52%; width: var(--B); height: var(--B); transform: translate(-50%, -50%); }
.cbox {
  position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(#2a2f36, #1a1e23);
  box-shadow: 0 0 0 2px #4b525c, 0 6px 14px rgba(0, 0, 0, .45); color: #e9eef5;
}
.cmid { position: absolute; inset: 26%; display: grid; place-content: center; text-align: center; border-radius: 6px; background: #12161a; box-shadow: inset 0 0 0 1px #3a414b; }
.crd { font-family: var(--f-disp); font-size: calc(var(--B) * .13); color: #8fd3ff; white-space: nowrap; }
.crest { font-size: calc(var(--B) * .1); color: #8fd3ff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cs { position: absolute; left: 50%; top: 50%; width: var(--B); display: flex; justify-content: center; align-items: center; gap: 4px;
  font-size: calc(var(--B) * .105); font-variant-numeric: tabular-nums; color: #f0c75e; }
.cs b { position: absolute; left: 4px; font-family: var(--f-disp); font-weight: 400; color: #cfd6df; font-size: calc(var(--B) * .12); }
.cs b.dealer { color: var(--hot); }
.cs .stick { position: absolute; top: -2px; }
.cs.turn::after { content: ""; position: absolute; bottom: -3px; left: 30%; right: 30%; height: 3px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.cs0 { transform: translate(-50%, calc(var(--B) * .5 - 100%)) ; padding-bottom: 4px; }
.cs2 { transform: translate(-50%, -50%) rotate(180deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs1 { transform: translate(-50%, -50%) rotate(-90deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs3 { transform: translate(-50%, -50%) rotate(90deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs0 { transform: translate(-50%, -50%) translateY(calc(var(--B) * .5 - 50% - 4px)); padding-bottom: 0; }
.stick { display: inline-block; width: 22px; height: 4px; border-radius: 2px; background: var(--ivory); position: relative; vertical-align: middle; }
.stick::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--hot); transform: translate(-50%, -50%); }

.rv { --tw: var(--rtw); position: absolute; width: var(--rvW); height: var(--rvH); display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.rv .row { display: flex; gap: 1px; align-items: flex-end; white-space: nowrap; }
.rv0 { left: 50%; top: 100%; transform: translateX(-50%); }
.rv2 { left: 50%; bottom: 100%; transform: translateX(-50%) rotate(180deg); }
.rv1 { left: calc(100% + var(--rvH) / 2); top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
.rv3 { left: calc(var(--rvH) / -2); top: 50%; transform: translate(-50%, -50%) rotate(90deg); }

/* 相手の手牌（裏） */
.bk { display: inline-block; width: var(--otw); height: calc(var(--otw) * 1.36); border-radius: 3px; background: linear-gradient(#3a7bd0, var(--back)); box-shadow: inset 0 -3px 0 #fbfaf6, 0 1px 2px rgba(0,0,0,.4); }
.oh { position: absolute; display: flex; gap: 6px; align-items: center; }
.oh .bks { display: flex; gap: 1px; }
.oh .omelds { --tw: calc(var(--otw) * 1.05); display: flex; gap: 4px; }
.oh-top { top: 12px; left: 50%; transform: translateX(-50%); flex-direction: row-reverse; }
.oh-left, .oh-right { --otw: min(16px, calc(var(--planeH) * .046)); }
.oh-left { left: calc(var(--sl) + 80px); top: calc(var(--planeH) * .52); transform: translate(-50%, -50%) rotate(90deg); }
.oh-right { right: calc(var(--sr) + 80px); top: calc(var(--planeH) * .52); transform: translate(50%, -50%) rotate(-90deg); }

/* 名札 */
.plate { position: absolute; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px;
  background: rgba(10, 18, 28, .72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); max-width: 210px; z-index: 3; }
.plate.turn { box-shadow: inset 0 0 0 2px var(--gold), 0 0 12px rgba(242, 193, 78, .45); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff;
  background: linear-gradient(135deg, hsl(var(--hue) 55% 55%), hsl(calc(var(--hue) + 40) 55% 38%)); box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.pinfo { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.pn { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps { font-size: 12px; font-variant-numeric: tabular-nums; color: #f0c75e; display: flex; gap: 5px; }
.ps b { font-family: var(--f-disp); font-weight: 400; color: #cfd6df; }
.ps b.dealer { color: var(--hot); }
.ptags { display: flex; gap: 3px; margin-top: 2px; }
.pl-top { top: 8px; right: calc(50% + var(--otw) * 7.6 + 16px); }

/* 自分の手牌と操作 */
.handrow { position: absolute; left: 0; right: 0; bottom: 0; height: var(--handH); display: flex; justify-content: center; align-items: flex-start;
  gap: 14px; padding-left: var(--sl); padding-right: var(--sr); z-index: 4; }

.handrow .hand .t.sel { transform: translateY(-14px); }

.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--handH) + 12px); font-size: 12px; color: #d5dee8;
  background: rgba(10, 18, 28, .6); padding: 4px 10px; border-radius: 999px; z-index: 3; white-space: nowrap; display: flex; gap: 6px; align-items: center; }

/* 対局中の結果・メニューは卓の中央に（卓と一緒に回る） */
.tbl .sheet-bg { position: absolute; align-items: center; }
.tbl .sheet { max-width: 720px; max-height: calc(var(--VH) * .92); border-radius: 18px; }

/* 縦持ち（画面の自動回転がオフのときなど）：横画面を90度回して全体に表示。iPhoneを左に倒して持つ */
@media (orientation: portrait) {
  .tbl {
    --VW: 100vh; --VW: 100dvh;
    --VH: 100vw;
    --sl: env(safe-area-inset-top, 0px);
    --sr: env(safe-area-inset-bottom, 0px);
    --sb: 0px;
    inset: auto; top: 0; left: 0;
    width: var(--VW); height: var(--VH);
    transform-origin: top left;
    transform: translateX(100vw) rotate(90deg);
  }
}

/* 全画面にできない端末（iPhone）向けの案内 */
.fullhelp ol { margin: 0; padding-left: 1.4em; line-height: 1.8; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="engine.js?v=6"></script>
<script src="tiles.js?v=7"></script>
<script>
'use strict';
const PREFIX = 'shanai-mj-7k2q-';      // PeerJSの公開サーバーで他と重ならないための接頭辞
const WN = MJ.WIND_NAMES;
const app = document.getElementById('app');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },
};
let myPid = store.get('mj.pid');
if (!myPid) { myPid = 'p' + Math.random().toString(36).slice(2, 12); store.set('mj.pid', myPid); }
let myName = store.get('mj.name') || '';

/* ---------- キャラ（アバター） ----------
   画像は公開サイトには置かない。各自が端末に読み込んだ「キャラ素材」から選び、
   部屋の中では親機が全員に配る（親機の素材は参加者も選べる）。 */
const AV = { pack: [], mine: null, room: {}, roomPack: [] };
try { AV.pack = JSON.parse(store.get('mj.pack') || '[]'); } catch (e) { AV.pack = []; }
AV.mine = store.get('mj.avatar') || null;
function savePack() {
  try { localStorage.setItem('mj.pack', JSON.stringify(AV.pack)); return true; }
  catch (e) { toast('この端末に保存できる量を超えました。枚数を減らしてください'); return false; }
}
function setMine(src) {
  AV.mine = src || null;
  if (src) store.set('mj.avatar', src); else store.del('mj.avatar');
}
const isImg = (s) => typeof s === 'string' && s.startsWith('data:image/') && s.length < 400000;

// 画像は大きいので、HTMLに直接書かずCSSのクラスにして使い回す
const avStyle = document.createElement('style');
document.head.appendChild(avStyle);
const avKeys = new Map();
function avClass(src) {
  if (!src) return '';
  let c = avKeys.get(src);
  if (!c) {
    c = 'avk' + (avKeys.size + 1);
    avKeys.set(src, c);
    avStyle.appendChild(document.createTextNode(`.${c}{background-image:url("${src}")}`));
  }
  return c;
}
function seatAvatar(seat) {
  const st = S.seats[seat];
  const key = st.uid || 'cpu' + seat;
  return AV.room[key] || (st.uid === myPid ? AV.mine : null);
}
// 丸いアイコン：キャラがあれば顔のあたり、なければ名前の頭文字
function avatarHTML(src, name, hue, extra) {
  if (src) return `<span class="av img ${avClass(src)} ${extra || ''}"></span>`;
  return `<span class="av ${extra || ''}" style="--hue:${hue}">${esc((name || '?').slice(0, 1))}</span>`;
}

// 端末の写真から読み込む：縦320pxに縮めて保存（透過があればPNG、なければJPEG）
function shrinkImage(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      // 部屋の人へ1枚ずつ送るので、1枚およそ180KB以内に収まるまで縮める
      let h = 320, out = null;
      for (let tries = 0; tries < 6; tries++) {
        let w = Math.round(im.width * h / im.height), hh = h;
        if (w > 448) { w = 448; hh = Math.round(im.height * w / im.width); }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hh;
        const g = cv.getContext('2d');
        g.imageSmoothingQuality = 'high';
        g.drawImage(im, 0, 0, w, hh);
        const corner = g.getImageData(0, 0, 1, 1).data[3];
        out = corner < 250 ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82);
        if (out.length <= 180000) break;
        h = Math.round(h * 0.8);
      }
      URL.revokeObjectURL(url);
      resolve(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    im.src = url;
  });
}
async function importPack(files) {
  let n = 0;
  for (const f of files) {
    // 「ファイル」から選ぶと種類が空のことがあるので、拡張子でも判定する
    if (!f.type.startsWith('image/') && !/\.(png|jpe?g|webp|gif|heic)$/i.test(f.name)) continue;
    const src = await shrinkImage(f);
    if (src) { AV.pack.push(src); n++; }
  }
  if (n && savePack()) toast(`${n}枚のキャラを読み込みました`);
  render();
}

// role: home | host | client | local
let role = 'home';
let code = '';
let HS = null;          // 親機が持つ完全な状態
let S = null;           // 画面に出す状態（自分の手牌以外は伏せてある）
let peer = null, hostConn = null;
const conns = new Map(); // 親機: pid -> 接続
let net = 'ok';          // ok | connecting | lost
let leaving = false;
let ui = { sel: null, riichi: false, menu: false, yaku: false };
let botTimer = null, retryTimer = null, wakeLock = null, autoTimer = null;
// 左端のスイッチ：和＝自動で和了、鳴＝鳴きをすべてスキップ、切＝ツモ切り
let auto = { win: false, nocall: false, giri: false };
try { auto = Object.assign(auto, JSON.parse(store.get('mj.auto') || '{}')); } catch (e) { /* 初期値のまま */ }

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2800);
}

/* ---------- 親機：状態を持ち、操作を受け付け、各自に見せてよい分だけ送る ---------- */

function viewFor(full, seat) {
  const V = MJ.clone(full);
  if (V.phase === 'lobby' || V.phase === 'end') return V;
  V.wall = V.wall.map(() => 0);
  V.dead = V.dead.map((x, i) => (i >= 4 && i < 4 + V.doraCount ? x : null));
  V.players.forEach((p, i) => { if (i !== seat) p.hand = p.hand.map(() => null); });
  if (V.turn !== seat) V.drawn = null;
  if (V.claim) {
    const mine = V.claim.options[seat];
    V.claim.options = mine ? { [seat]: mine } : {};
    const r = V.claim.responses[seat];
    V.claim.responses = r ? { [seat]: r } : {};
  }
  return V;
}

function hostSeatOf(pid) { return HS.seats.findIndex((s) => s.uid === pid); }

function hostCommit() {
  HS.seq++;
  for (const [pid, c] of conns) {
    if (c.open) sendMsg(c, { t: 'state', S: viewFor(HS, hostSeatOf(pid)) });
  }
  if (role === 'host') store.set('mj.hostroom', JSON.stringify({ code, HS }));
  setView(viewFor(HS, hostSeatOf(myPid)));
  scheduleBots();
}

// 親機に届いた操作（親機自身の操作もここを通る）
function hostHandle(pid, msg) {
  const seat = hostSeatOf(pid);
  const isHost = pid === myPid;
  const lobbyOnly = () => { if (HS.phase !== 'lobby') throw new Error('対局中は変更できません'); };
  const hostOnly = () => { if (!isHost) throw new Error('親機の人だけが操作できます'); };
  switch (msg.cmd) {
    case 'apply': {
      if (seat < 0) throw new Error('席に座っていません');
      const a = Object.assign({}, msg.a, { seat });
      MJ.apply(HS, a);
      break;
    }
    case 'ready': {
      if (HS.phase !== 'result' || seat < 0) return;
      HS.ready = HS.ready || {};
      HS.ready[seat] = true;
      const humans = HS.seats.map((s, i) => (s.uid && !s.bot ? i : -1)).filter((i) => i >= 0);
      if (humans.every((i) => HS.ready[i])) MJ.apply(HS, { type: 'next' });
      break;
    }
    case 'next': if (HS.phase !== 'result') return; MJ.apply(HS, { type: 'next' }); break;
    case 'togglebot': {
      const t = HS.seats[msg.seat];
      if (!t || !t.uid) return;
      if (!isHost && msg.seat !== seat) throw new Error('ほかの人の代打ちは親機の人が切り替えます');
      t.bot = !t.bot;
      break;
    }
    case 'botseat': hostOnly(); lobbyOnly(); if (!HS.seats[msg.seat].uid) { Object.assign(HS.seats[msg.seat], { bot: true, name: 'CPU ' + 'ABCD'[msg.seat] }); cpuAvatar(msg.seat); } break;
    case 'clearseat': hostOnly(); lobbyOnly(); if (msg.seat !== hostSeatOf(myPid)) { HS.seats[msg.seat] = { uid: null, bot: false, name: '' }; hostSetAvatar('cpu' + msg.seat, null); } break;
    case 'avatar': if (msg.src === null || isImg(msg.src)) hostSetAvatar(pid, msg.src); return;
    case 'rule': hostOnly(); lobbyOnly(); HS.rules[msg.k] = msg.v; break;
    case 'start':
      hostOnly(); lobbyOnly();
      if (!HS.seats.every((s) => s.uid || s.bot)) throw new Error('4席すべて埋めてください');
      MJ.startGame(HS);
      break;
    case 'again': hostOnly(); if (HS.phase !== 'end') return; HS.seats.forEach((s) => { if (s.uid) s.bot = false; }); MJ.startGame(HS); break;
    case 'tolobby': {
      hostOnly();
      const seats = HS.seats.map((s) => ({ uid: s.uid, bot: s.uid ? false : s.bot, name: s.name, online: s.online }));
      const fresh = MJ.newGame(HS.rules);
      fresh.seats = seats; fresh.seq = HS.seq; fresh.hostSeat = HS.hostSeat;
      HS = fresh;
      break;
    }
    default: return;
  }
  hostCommit();
}

function hostJoin(pid, name, conn) {
  let seat = hostSeatOf(pid);
  if (seat < 0) {
    if (HS.phase !== 'lobby') { conn.send({ t: 'err', msg: '対局中のため観戦で入ります' }); }
    else {
      seat = HS.seats.findIndex((s) => !s.uid && !s.bot);
      if (seat < 0) { conn.send({ t: 'err', msg: '満席です' }); }
      else HS.seats[seat] = { uid: pid, bot: false, name: '' };
    }
  }
  if (seat >= 0) { HS.seats[seat].name = (name || '').slice(0, 12) || '名無し'; HS.seats[seat].online = true; }
  conns.set(pid, conn);
  hostCommit();
  // いま部屋にいる人のキャラと、親機のキャラ素材を新しく来た人に送る（1枚ずつ）
  for (const [k, v] of Object.entries(AV.room)) sendMsg(conn, { t: 'avatar', key: k, src: v });
  AV.pack.forEach((src, i) => sendMsg(conn, { t: 'packitem', i, src }));
}

// キャラを決めた・変えたことを、部屋の全員に知らせる（親機だけが呼ぶ）
function hostSetAvatar(key, src) {
  if (src) AV.room[key] = src; else delete AV.room[key];
  for (const [, c] of conns) if (c.open) sendMsg(c, { t: 'avatar', key, src: src || null });
  render();
}
// CPUの席には、親機のキャラ素材から空いているものをランダムに
function cpuAvatar(seat) {
  const used = new Set(Object.values(AV.room));
  const free = AV.pack.filter((s) => !used.has(s));
  const list = free.length ? free : AV.pack;
  hostSetAvatar('cpu' + seat, list.length ? list[Math.floor(Math.random() * list.length)] : null);
}

// CPUの手番と、立直後のツモ切りは親機が進める
function scheduleBots() {
  clearTimeout(botTimer);
  if (!HS || !['turn', 'claim'].includes(HS.phase)) return;
  let a = MJ.pendingBotAction(HS);
  if (!a && HS.phase === 'turn') {
    const p = HS.players[HS.turn];
    if (p.riichi) {
      const o = MJ.turnOptions(HS, HS.turn);
      if (!o.tsumo && !o.kans.length) a = { type: 'discard', seat: HS.turn, id: HS.drawn };
    }
  }
  if (!a) return;
  const seq = HS.seq;
  botTimer = setTimeout(() => {
    if (HS.seq !== seq) return;
    try { MJ.apply(HS, MJ.pendingBotAction(HS) || a); hostCommit(); } catch (e) { console.error(e); }
  }, 750);
}

/* ---------- 通信 ---------- */

function newCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

// PeerJSは大きいメッセージを黙って捨てるので、12000文字ずつに分けて送り、受け取った側でつなぎ直す
const CHUNK = 12000;
function sendMsg(c, obj) {
  const s = JSON.stringify(obj);
  if (s.length <= CHUNK) { c.send(obj); return; }
  const id = Math.random().toString(36).slice(2);
  const n = Math.ceil(s.length / CHUNK);
  for (let i = 0; i < n; i++) c.send({ t: 'chunk', id, i, n, d: s.slice(i * CHUNK, (i + 1) * CHUNK) });
}
const inbox = new Map();
function unchunk(msg) {
  if (!msg || typeof msg !== 'object') return null;
  if (msg.t !== 'chunk') return msg;
  if (!(msg.n > 0 && msg.n <= 200 && msg.i >= 0 && msg.i < msg.n) || typeof msg.d !== 'string') return null;
  let e = inbox.get(msg.id);
  if (!e) { e = { parts: [], got: 0 }; inbox.set(msg.id, e); if (inbox.size > 50) inbox.delete(inbox.keys().next().value); }
  if (e.parts[msg.i] === undefined) { e.parts[msg.i] = msg.d; e.got++; }
  if (e.got < msg.n) return null;
  inbox.delete(msg.id);
  try { return JSON.parse(e.parts.join('')); } catch (err) { return null; }
}

function createRoom(resume) {
  if (!myName) return toast('名前を入れてください');
  role = 'host'; leaving = false;
  AV.room = {}; AV.roomPack = [];
  if (AV.mine) AV.room[myPid] = AV.mine;
  if (resume) { code = resume.code; HS = resume.HS; HS.seats.forEach((s, i) => { if (s.bot && !s.uid) cpuAvatar(i); }); }
  else {
    code = newCode();
    HS = MJ.newGame({ length: 'hanchan', aka: true });
    HS.seats[0] = { uid: myPid, bot: false, name: myName, online: true };
  }
  const me = hostSeatOf(myPid);
  if (me >= 0) HS.seats[me].name = myName;
  HS.hostSeat = me;
  HS.seats.forEach((s) => { if (s.uid && s.uid !== myPid) s.online = false; });
  openHostPeer(0, !!resume);
  hostCommit();
  history.replaceState(null, '', '?room=' + code);
}

function openHostPeer(tries, resuming) {
  net = 'connecting'; render();
  peer = new Peer(PREFIX + code);
  peer.on('open', () => { net = 'ok'; render(); });
  peer.on('connection', (c) => {
    c.on('data', (raw) => {
      const msg = unchunk(raw);
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'hello') {
        hostJoin(String(msg.pid), String(msg.name || ''), c);
        if (isImg(msg.avatar)) hostSetAvatar(String(msg.pid), msg.avatar);
        return;
      }
      const pid = [...conns].find(([, x]) => x === c);
      if (!pid) return;
      try { hostHandle(pid[0], msg); } catch (e) { sendMsg(c, { t: 'err', msg: e.message }); }
    });
    c.on('close', () => {
      for (const [pid, x] of conns) if (x === c) {
        conns.delete(pid);
        const s = hostSeatOf(pid);
        if (s >= 0) { HS.seats[s].online = false; hostCommit(); }
      }
    });
  });
  peer.on('disconnected', () => { if (!leaving) { net = 'connecting'; render(); setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); } });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') {
      peer.destroy();
      // 再開時は前の接続がサーバーに残っていることがあるので待つ。新規なら番号を変える
      if (!resuming) { code = newCode(); history.replaceState(null, '', '?room=' + code); render(); }
      if (tries < 10) setTimeout(() => openHostPeer(tries + 1, resuming), resuming ? 3000 : 200);
      else { net = 'lost'; render(); toast('部屋を開けませんでした。ページを開き直してください'); }
      return;
    }
    if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { net = 'lost'; render(); }
  });
}

function joinRoom(c) {
  if (!myName) return toast('名前を入れてください');
  if (!/^\d{4}$/.test(c)) return toast('部屋番号は4桁の数字です');
  role = 'client'; code = c; leaving = false; S = null;
  history.replaceState(null, '', '?room=' + code);
  net = 'connecting'; render();
  peer = new Peer();
  peer.on('open', connectHost);
  peer.on('disconnected', () => { if (!leaving) setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); });
  peer.on('error', (e) => {
    if (e.type === 'peer-unavailable') { net = 'lost'; render(); retry(4000); return; }
    if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { net = 'lost'; render(); }
  });
}

function connectHost() {
  if (leaving || !peer || peer.destroyed) return;
  if (peer.disconnected) { peer.reconnect(); retry(2000); return; }
  net = S ? 'connecting' : net; render();
  const c = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
  hostConn = c;
  c.on('open', () => { net = 'ok'; sendMsg(c, { t: 'hello', pid: myPid, name: myName, avatar: AV.mine }); render(); });
  c.on('data', (raw) => {
    const msg = unchunk(raw);
    if (!msg) return;
    if (msg.t === 'state') setView(msg.S);
    if (msg.t === 'err') toast(msg.msg);
    if (msg.t === 'avatar' && typeof msg.key === 'string') {
      if (isImg(msg.src)) AV.room[msg.key] = msg.src; else delete AV.room[msg.key];
      render();
    }
    if (msg.t === 'packitem' && isImg(msg.src) && msg.i >= 0 && msg.i < 60) { AV.roomPack[msg.i] = msg.src; if (ui.picker) render(); }
  });
  c.on('close', () => { if (hostConn === c && !leaving) { net = 'lost'; render(); retry(2000); } });
}

function retry(ms) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (role === 'client' && !leaving && !(hostConn && hostConn.open)) connectHost(); }, ms);
}

function send(msg) {
  if (role === 'host' || role === 'local') {
    try { hostHandle(myPid, msg); } catch (e) { toast(e.message); }
  } else if (hostConn && hostConn.open) sendMsg(hostConn, msg);
  else toast('親機とつながっていません。再接続を待ってください');
}

function leaveRoom() {
  leaving = true;
  clearTimeout(botTimer); clearTimeout(retryTimer);
  if (peer) { try { peer.destroy(); } catch (e) { /* 閉じるだけ */ } }
  peer = null; hostConn = null; conns.clear();
  if (role === 'host') store.del('mj.hostroom');
  role = 'home'; S = null; HS = null; ui = { sel: null, riichi: false, menu: false };
  AV.room = {}; AV.roomPack = [];
  history.replaceState(null, '', location.pathname);
  render();
}

// iPhoneが眠らないように（対応していない端末では何もしない）
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* 拒否されても続ける */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (role === 'host' || role === 'client') keepAwake();
  if (peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  if (role === 'client' && !(hostConn && hostConn.open)) retry(300);
});

function scheduleAuto() {
  clearTimeout(autoTimer);
  const me = mySeat();
  if (!S || me < 0 || S.seats[me].bot) return;
  let msg = null;
  if (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]) {
    const opts = S.claim.options[me];
    if (auto.win && opts.some((o) => o.t === 'ron')) msg = { t: 'ron' };
    else if (auto.nocall && !opts.some((o) => o.t === 'ron')) msg = { t: 'pass' };
    if (msg) msg = { cmd: 'apply', a: { type: 'respond', resp: msg } };
  } else if (S.phase === 'turn' && S.turn === me && !S.players[me].riichi) {
    const o = MJ.turnOptions(S, me);
    if (auto.win && o.tsumo) msg = { cmd: 'apply', a: { type: 'tsumo' } };
    else if (auto.giri && S.drawn !== null && !o.tsumo) msg = { cmd: 'apply', a: { type: 'discard', id: S.drawn } };
  }
  if (!msg) return;
  const seq = S.seq;
  autoTimer = setTimeout(() => { if (S && S.seq === seq) send(msg); }, 600);
}

// 牌の絵柄は tiles.js が描いた背景画像（クラス f<種類>、赤5は f<種類>r）
const TILE_NAMES = [...'一二三四五六七八九'].map((c) => c + '萬').concat([...'一二三四五六七八九'].map((c) => c + '筒'), [...'一二三四五六七八九'].map((c) => c + '索'), [...'東南西北白發中']);
function tile(id, cls) {
  cls = cls || '';
  if (id === null || id === undefined) return `<span class="t back ${cls}"></span>`;
  const k = id >> 2;
  const red = S && S.rules.aka && MJ.RED_IDS.includes(id);
  return `<span class="t f${k}${red ? 'r' : ''} ${cls}" data-id="${id}" role="img" aria-label="${red ? '赤' : ''}${TILE_NAMES[k]}"></span>`;
}

function meldHTML(m, owner) {
  const rel = (m.from - owner + 4) % 4;
  if (m.type === 'ankan') return `<span class="meld">${tile(null, 'sm')}${tile(m.tiles[1], 'sm')}${tile(m.tiles[2], 'sm')}${tile(null, 'sm')}</span>`;
  const others = m.tiles.filter((x) => x !== m.called && x !== m.added);
  const sideIdx = rel === 3 ? 0 : rel === 2 ? 1 : others.length;
  const parts = others.map((x) => tile(x, 'sm'));
  parts.splice(Math.min(sideIdx, parts.length), 0, tile(m.called, 'sm side'));
  if (m.added !== undefined) parts.push(tile(m.added, 'sm side'));
  return `<span class="meld">${parts.join('')}</span>`;
}

function riverHTML(seat) {
  const p = S.players[seat];
  const rows = [p.river.slice(0, 6), p.river.slice(6, 12), p.river.slice(12)];
  const last = S.lastDiscard && S.lastDiscard.seat === seat && S.phase === 'claim';
  return rows.map((row, ri) => `<div class="row">${row.map((r, i) => {
    const isLast = last && ri * 6 + i === p.river.length - 1;
    return tile(r.id, 'sm' + (r.riichi ? ' side' : '') + (r.called ? ' dim' : '') + (isLast ? ' hl' : ''));
  }).join('')}</div>`).join('');
}

// 火の粉
let fxRaf = 0;
const embers = [];
function startFx() {
  cancelAnimationFrame(fxRaf);
  const cv = document.getElementById('mhfx');
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = cv.getContext('2d');
  const loop = () => {
    if (!cv.isConnected) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth * dpr, h = cv.clientHeight * dpr;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    ctx.clearRect(0, 0, w, h);
    while (embers.length < 70) {
      embers.push({ x: Math.random() * w, y: h + Math.random() * h * .3, vy: -(0.4 + Math.random() * 1.1) * dpr,
        sway: Math.random() * 6.28, r: (0.8 + Math.random() * 2.2) * dpr, life: 0, max: 280 + Math.random() * 260 });
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.life++; e.y += e.vy; e.sway += 0.03; e.x += Math.sin(e.sway) * 0.5 * dpr;
      const a = Math.max(0, Math.min(1, e.life / 40, (e.max - e.life) / 80)) * (0.6 + Math.random() * 0.4);
      if (e.life > e.max || e.y < -10) { embers.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 3);
      g.addColorStop(0, `rgba(255,214,140,${a})`); g.addColorStop(.4, `rgba(255,140,40,${a * .6})`); g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 3, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    fxRaf = requestAnimationFrame(loop);
  };
  fxRaf = requestAnimationFrame(loop);
}

// 効果音（WebAudioで合成。最初のタップから鳴る）
let actx = null;
function sfx(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const tone = (freq, at, dur, type, vol) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t + at);
      g.gain.setValueAtTime(0.0001, t + at);
      g.gain.exponentialRampToValueAtTime(vol, t + at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t + at); o.stop(t + at + dur + 0.02);
    };
    if (kind === 'start') { tone(392, 0, .5, 'triangle', .09); tone(523, .08, .5, 'triangle', .08); tone(784, .16, .7, 'triangle', .07); }
    else if (kind === 'back') tone(440, 0, .12, 'square', .03);
    else { tone(880, 0, .09, 'square', .035); tone(1320, .06, .16, 'triangle', .05); }
  } catch (e) { /* 音が出せない環境では無音 */ }
}

function lobbyHTML() {
  const host = role === 'host';
  const filled = S.seats.every((s) => s.uid || s.bot);
  const link = location.origin + location.pathname + '?room=' + code;
  return `<div class="lobby">
    <div class="codebox"><span class="muted">部屋番号</span><span class="code">${esc(code)}</span>
      <span class="muted">このページのURLと部屋番号をほかの3人に伝えてください。</span>
      <button class="small" data-act="copy" data-link="${esc(link)}">参加用リンクをコピー</button></div>
    ${netNote()}
    <section class="field"><span>席（4人そろったら開始）</span>
    <div class="seats">${S.seats.map((s, i) => {
      let btns = '';
      if (host) {
        if (!s.uid && !s.bot) btns = `<button class="small ghost" data-act="botseat" data-seat="${i}">CPUを入れる</button>`;
        else if (s.uid !== myPid) btns = `<button class="small ghost" data-act="clearseat" data-seat="${i}">空ける</button>`;
      }
      const dot = s.uid ? `<span class="dot ${s.uid === myPid || s.online ? '' : 'off'}"></span>` : '';
      const av = s.uid || s.bot ? avatarHTML(seatAvatar(i), nameOf(i), (i * 83 + 200) % 360, 'lg') : '';
      return `<div class="seat ${s.uid === myPid ? 'me' : ''}"><div class="no">席 ${i + 1}${s.uid && i === hostSeatIndex() ? '・親機' : ''}</div><div class="nm" style="display:flex;gap:8px;align-items:center">${av}${dot}${esc(nameOf(i))}</div><div class="btns">${btns}</div></div>`;
    }).join('')}</div></section>
    ${host ? `
    <section class="field"><span>長さ</span><div class="seg">
      <button class="${S.rules.length === 'tonpu' ? 'on' : ''}" data-act="rule" data-k="length" data-v="tonpu">東風戦</button>
      <button class="${S.rules.length === 'hanchan' ? 'on' : ''}" data-act="rule" data-k="length" data-v="hanchan">半荘戦</button></div></section>
    <section class="field"><span>赤ドラ</span><div class="seg">
      <button class="${S.rules.aka ? 'on' : ''}" data-act="rule" data-k="aka" data-v="1">あり（各1枚）</button>
      <button class="${!S.rules.aka ? 'on' : ''}" data-act="rule" data-k="aka" data-v="0">なし</button></div></section>
    <button class="hot" data-act="start" ${filled ? '' : 'disabled'}>対局開始</button>`
    : `<p class="muted">${S.rules.length === 'tonpu' ? '東風戦' : '半荘戦'}・赤ドラ${S.rules.aka ? 'あり' : 'なし'}。親機の人が開始するのを待っています。</p>`}
    ${mySeat() >= 0 ? `<button class="ghost" data-act="picker">キャラを選ぶ</button>` : ''}
    <button class="ghost" data-act="leave">${host ? '部屋を閉じる' : '部屋から出る'}</button>
    ${ui.picker ? roomPickHTML() : ''}
  </div>`;
}

function hostSeatIndex() { return role === 'host' ? mySeat() : (S.hostSeat !== undefined ? S.hostSeat : 0); }

function gameHTML() {
  const v = viewSeat(), me = mySeat();
  const d = MJ.dealerOf(S);
  const rel = (i) => (v + i) % 4;
  const doraInd = MJ.doraIndicators(S);
  const turnSeat = S.phase === 'turn' ? S.turn : -1;
  const wind = (s) => WN[MJ.seatWind(S, s) - 27];

  // 名札：頭文字のアイコン・名前・風・点数
  const plate = (s, pos) => {
    const st = S.seats[s], p = S.players[s];
    const nm = nameOf(s);
    const off = st.uid && st.uid !== myPid && role !== 'local' && !st.online;
    const tags = (p.riichi ? '<span class="tag">リーチ</span>' : '') +
      (st.bot && st.uid ? '<span class="tag cpu">代打ち</span>' : '') + (off ? '<span class="tag cpu">切断中</span>' : '');
    return `<div class="plate pl-${pos} ${turnSeat === s ? 'turn' : ''}">
      ${avatarHTML(seatAvatar(s), nm, (s * 83 + 200) % 360)}
      <div class="pinfo"><span class="pn">${esc(nm)}</span>
      <span class="ps"><b class="${s === d ? 'dealer' : ''}">${wind(s)}</b>${S.scores[s].toLocaleString()}</span>${tags ? `<span class="ptags">${tags}</span>` : ''}</div></div>`;
  };
  // 相手の手牌（裏向き）と鳴いた牌
  const opp = (s, pos) => {
    const p = S.players[s];
    const backs = '<span class="bk"></span>'.repeat(p.hand.length);
    return `<div class="oh oh-${pos}"><div class="bks">${backs}</div><div class="omelds">${p.melds.map((m) => meldHTML(m, s)).join('')}</div></div>`;
  };
  const side = (i) => {
    const s = rel(i);
    return `<div class="cs cs${i} ${turnSeat === s ? 'turn' : ''}"><b class="${s === d ? 'dealer' : ''}">${wind(s)}</b><span>${S.scores[s]}</span>${S.players[s].riichi ? '<i class="stick"></i>' : ''}</div>`;
  };
  const dora = [0, 1, 2, 3, 4].map((i) => tile(i < doraInd.length ? doraInd[i] : null, 'sm')).join('');
  const netDot = role === 'local' ? '' : `<span class="net"><span class="dot ${net === 'ok' ? '' : 'off'}"></span>${net === 'ok' ? '部屋 ' + esc(code) : '再接続中'}</span>`;
  const toggles = [['win', '和', '自動和了'], ['nocall', '鳴', '鳴きなし'], ['giri', '切', 'ツモ切り']].map(([k, ch, label]) =>
    `<button class="tg ${auto[k] ? 'on' : ''}" data-act="auto" data-k="${k}" aria-pressed="${auto[k]}" title="${label}"><b>${ch}</b><span>${label}</span></button>`).join('');

  return `<div class="tbl">
    <div class="plane"><div class="stage"><div class="pc">
      <div class="cbox">${side(0)}${side(1)}${side(2)}${side(3)}
        <div class="cmid"><div class="crd">${MJ.roundLabel(S)}</div><div class="crest">残 ${S.wall.length}</div></div></div>
      <div class="rv rv0">${riverHTML(rel(0))}</div><div class="rv rv1">${riverHTML(rel(1))}</div>
      <div class="rv rv2">${riverHTML(rel(2))}</div><div class="rv rv3">${riverHTML(rel(3))}</div>
    </div></div></div>
    ${opp(rel(2), 'top')}${opp(rel(3), 'left')}${opp(rel(1), 'right')}
    ${plate(rel(2), 'top')}${plate(rel(3), 'left')}${plate(rel(1), 'right')}
    <div class="info"><div class="dora">${dora}</div>
      <div class="cnt"><span>${S.honba}本場</span><span><i class="stick"></i>×${S.kyotaku}</span></div>${netDot}</div>
    <div class="tops">${isFull() ? '' : '<button class="small ghost" data-act="full">全画面</button>'}<button class="small ghost" data-act="yaku">役一覧</button><button class="small ghost" data-act="menu">メニュー</button></div>
    ${me >= 0 ? `<div class="toggles">${toggles}</div>` : ''}
    ${me >= 0 ? plate(me, 'me') + mineHTML(me) : `<p class="spect">観戦中です。手牌は見えません。</p>`}
    ${sheetHTML()}
  </div>`;
}

function mineHTML(me) {
  const p = S.players[me];
  const st = S.seats[me];
  const myTurn = S.phase === 'turn' && S.turn === me && !st.bot;
  const o = myTurn ? MJ.turnOptions(S, me) : null;
  let hand = p.hand.slice();
  let drawn = null;
  if (S.phase === 'turn' && S.turn === me && S.drawn !== null) { drawn = S.drawn; hand = hand.filter((x) => x !== drawn); }
  hand.sort((a, b) => a - b);
  const allowed = o ? (ui.riichi ? o.discardable.filter((id) => o.riichi.includes(id >> 2)) : o.discardable) : [];
  const tcls = (id) => {
    if (!myTurn) return '';
    let c = allowed.includes(id) ? (ui.riichi ? 'ok' : '') : 'no';
    if (ui.sel === id) c += ' sel';
    return c;
  };
  const tiles = hand.map((id) => tile(id, tcls(id))).join('') + (drawn !== null ? tile(drawn, 'drawn ' + tcls(drawn)) : '');

  let btns = '', hint = '';
  if (st.bot) {
    hint = 'CPUが代わりに打っています';
    btns = `<button class="gold" data-act="togglebot" data-seat="${me}">自分で打つ</button>`;
  } else if (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]) {
    btns = claimHTML(me);
  } else if (myTurn) {
    if (o.tsumo) btns += `<button class="hot" data-act="tsumo">ツモ</button>`;
    if (o.riichi.length && !ui.riichi && !p.riichi) btns += `<button class="gold" data-act="riichi">リーチ</button>`;
    if (ui.riichi) btns += `<button class="ghost" data-act="riichi-cancel">リーチをやめる</button>`;
    for (const k of o.kans) btns += `<button data-act="kan" data-type="${k.type}" data-k="${k.k}">カン <span class="mini">${tile(k.k * 4 + 1, 'sm')}</span></button>`;
    hint = ui.riichi ? 'リーチで切る牌を選んでください' : p.riichi ? 'ツモ切りします…' : ui.sel !== null ? 'もう一度タップで切ります' : '切る牌をタップ';
  } else if (S.phase === 'claim') {
    hint = 'ほかの人の選択を待っています';
  }
  const furiten = p.riichi && MJ.isFuriten(p) ? '<span class="tag cpu">フリテン</span>' : '';
  return `${hint || furiten ? `<div class="hint">${furiten}${esc(hint)}</div>` : ''}
    <div class="acts">${btns}</div>
    <div class="handrow"><div class="hand ${myTurn ? '' : 'wait'}">${tiles}</div>
      <div class="mymelds">${p.melds.map((m) => meldHTML(m, me)).join('')}</div></div>`;
}

function claimHTML(me) {
  const cl = S.claim;
  const btns = cl.options[me].map((op, i) => {
    if (op.t === 'ron') return `<button class="hot" data-act="claim" data-i="${i}">ロン</button>`;
    if (op.t === 'pon') return `<button data-act="claim" data-i="${i}">ポン</button>`;
    if (op.t === 'kan') return `<button data-act="claim" data-i="${i}">カン</button>`;
    return `<button data-act="claim" data-i="${i}">チー<span class="chiopt">${op.tiles.map((x) => tile(x, 'sm')).join('')}</span></button>`;
  }).join('');
  return `<span class="claimq" title="${esc(nameOf(cl.from))}が${cl.kind === 'chankan' ? '加槓' : '捨てた'}牌">${tile(cl.tile)}</span>${btns}<button class="ghost" data-act="pass">スキップ</button>`;
}

function sheetHTML() {
  if (ui.menu) return menuHTML();
  if (ui.yaku) return yakuHTML();
  if (ui.fullhelp) return fullHelpHTML();
  if (S.phase === 'result') return resultHTML();
  if (S.phase === 'end') return endHTML();
  return '';
}

function menuHTML() {
  const me = mySeat();
  let rows = '';
  if (role !== 'local') {
    rows = S.seats.map((s, i) => {
      if (!s.uid || (role !== 'host' && i !== me)) return '';
      const isMe = i === me;
      const label = s.bot ? (isMe ? '自分で打つ' : '本人に戻す') : (isMe ? 'CPUに代打ちしてもらう' : 'CPUに代打ちさせる');
      return `<div style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(nameOf(i))}${s.bot ? '（CPU代打ち中）' : ''}</span><button class="small" data-act="togglebot" data-seat="${i}">${label}</button></div>`;
    }).join('');
    rows = `<h3>代打ち</h3><p class="muted">席を離れる人や接続が切れた人の番は、CPUに任せられます。${role === 'host' ? '' : 'ほかの人の席は親機の人が切り替えます。'}</p>${rows}`;
  }
  let quit;
  if (role === 'host') quit = `<h3>対局をやめる</h3><p class="muted">全員の対局が終わり、ロビーに戻ります。</p><div class="btnrow"><button class="hot" data-act="tolobby">対局をやめる</button><button data-act="menu-close">閉じる</button></div>`;
  else if (role === 'local') quit = `<div class="btnrow"><button class="hot" data-act="leave">練習をやめる</button><button data-act="menu-close">閉じる</button></div>`;
  else quit = `<h3>部屋から出る</h3><p class="muted">同じ部屋番号でまた参加すれば、自分の席に戻れます。</p><div class="btnrow"><button class="hot" data-act="leave">部屋から出る</button><button data-act="menu-close">閉じる</button></div>`;
  return `<div class="sheet-bg" data-act="menu-close"><div class="sheet" data-stop="1"><h2>メニュー</h2>${rows}${quit}</div></div>`;
}

function handBlock(hand, melds, owner, winTile) {
  const h = hand.slice();
  if (winTile !== undefined) h.splice(h.indexOf(winTile), 1);
  h.sort((a, b) => a - b);
  return `<div class="winhand">${h.map((x) => tile(x)).join('')}${winTile !== undefined ? '<span class="gap"></span>' + tile(winTile, 'hl') : ''}${melds.length ? '<span class="gap"></span>' : ''}${melds.map((m) => meldHTML(m, owner)).join('<span class="gap"></span>')}</div>`;
}

function resultHTML() {
  const R = S.result;
  const me = mySeat();
  let body;
  if (R.type === 'draw') {
    body = `<h2>流局</h2>` + [0, 1, 2, 3].map((s) => `<div><h3>${esc(nameOf(s))} — ${R.tenpai[s] ? 'テンパイ' : 'ノーテン'}</h3>${R.hands[s] ? handBlock(R.hands[s], S.players[s].melds, s) : ''}</div>`).join('');
  } else {
    body = R.wins.map((w) => {
      const sc = w.score;
      const how = R.type === 'tsumo' ? 'ツモ' : `ロン ← ${esc(nameOf(w.from))}`;
      const head = sc.yakuman ? sc.limit : `${sc.fu}符 ${sc.han}翻${sc.limit ? ' ' + sc.limit : ''}`;
      return `<div style="display:flex;flex-direction:column;gap:10px">
        <div class="winner">${seatAvatar(w.seat) ? `<span class="winchara ${avClass(seatAvatar(w.seat))}"></span>` : ''}<h2>${esc(nameOf(w.seat))} ${how}</h2></div>
        ${handBlock(w.hand, w.melds, w.seat, w.tile)}
        <div class="yaku">${sc.yaku.map((y) => `<span>${esc(y.name)}</span><span>${typeof y.han === 'number' ? y.han + '翻' : y.han}</span>`).join('')}</div>
        <div class="big">${head}　${sc.total.toLocaleString()}点</div></div>`;
    }).join('');
    body += `<div class="dora" style="--tw:22px;gap:3px">ドラ表示 ${R.doraInd.map((x) => tile(x, 'sm')).join('')}${R.wins.some((w) => w.ura) ? '　裏 ' + R.uraInd.map((x) => tile(x, 'sm')).join('') : ''}</div>`;
  }
  const deltas = `<div class="deltas">${[0, 1, 2, 3].map((s) => {
    const dv = R.delta[s];
    return `<span class="wind">${WN[MJ.seatWind(S, s) - 27]}</span><span>${esc(nameOf(s))}</span><span class="${dv > 0 ? 'plus' : dv < 0 ? 'minus' : ''}">${dv > 0 ? '+' : ''}${dv ? dv.toLocaleString() : '±0'}</span><span>${S.scores[s].toLocaleString()}</span>`;
  }).join('')}</div>`;
  let btn;
  if (role === 'local') btn = `<button class="gold" data-act="next">次の局へ</button>`;
  else {
    const humans = S.seats.map((s, i) => (s.uid && !s.bot ? i : -1)).filter((i) => i >= 0);
    const ready = S.ready || {};
    const waiting = humans.filter((i) => !ready[i]);
    const iReady = me >= 0 && ready[me];
    btn = me >= 0 && !iReady ? `<button class="gold" data-act="ready">OK（次の局へ）</button>` : '';
    if (waiting.length && (iReady || me < 0)) {
      btn += `<p class="muted">待っています：${waiting.map((i) => esc(nameOf(i))).join('、')}</p>`;
      if (role === 'host') btn += `<button class="ghost" data-act="next">待たずに次の局へ</button>`;
    }
  }
  return `<div class="sheet-bg"><div class="sheet"><div class="muted">${esc(R.label)}</div>${body}<h3>点数の移動</h3>${deltas}<div class="btnrow" style="flex-direction:column">${btn}</div></div></div>`;
}

function endHTML() {
  const F = S.final;
  const rows = F.order.map((s, r) => `<span class="big">${r + 1}位</span><span>${esc(nameOf(s))}</span><span>${S.scores[s].toLocaleString()}</span><span class="${F.pts[s] > 0 ? 'plus' : 'minus'}">${F.pts[s] > 0 ? '+' : ''}${F.pts[s].toFixed(1)}</span>`).join('');
  const btns = role === 'host' ? `<button class="gold" data-act="again">同じ席でもう一局</button><button data-act="tolobby">ロビーへ</button>`
    : role === 'local' ? `<button class="gold" data-act="practice">もう一局</button><button data-act="leave">終わる</button>`
    : `<p class="muted">親機の人が次の対局を始めるのを待っています。</p>`;
  return `<div class="sheet-bg"><div class="sheet"><h2>対局終了</h2>
    <div class="deltas">${rows}</div>
    <p class="muted">右端は30000点返し・ウマ10-20で計算したポイントです。</p>
    <div class="btnrow">${btns}</div></div></div>`;
}

/* ---------- 操作 ---------- */

app.addEventListener('change', (e) => {
  if (e.target.classList.contains('packinput') && e.target.files && e.target.files.length) {
    const files = [...e.target.files];
    e.target.value = '';
    importPack(files);
  }
});

app.addEventListener('input', (e) => {
  if (e.target.id === 'name') { myName = e.target.value.trim().slice(0, 12); store.set('mj.name', myName); }
  if (e.target.id === 'code') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
});

app.addEventListener('click', (e) => {
  const tEl = e.target.closest('.hand .t');
  if (tEl) return onTile(+tEl.dataset.id);
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && e.target.closest('[data-stop]')) return;
  if (el.closest('.mh')) sfx(el.dataset.act === 'title-start' ? 'start' : el.dataset.act === 'home-back' ? 'back' : 'ok');
  onAct(el.dataset.act, el.dataset);
});

// 名前がまだなら、先に名前を決めてもらってから続きをする
function needName(next) {
  if (myName) return false;
  ui.home = 'name'; ui.afterName = next; render();
  return true;
}

function onTile(id) {
  const me = mySeat();
  if (me < 0 || !S || S.phase !== 'turn' || S.turn !== me || S.seats[me].bot || S.players[me].riichi) return;
  const o = MJ.turnOptions(S, me);
  const allowed = ui.riichi ? o.discardable.filter((x) => o.riichi.includes(x >> 2)) : o.discardable;
  if (!allowed.includes(id)) return;
  if (ui.sel !== id) { ui.sel = id; render(); return; }
  const riichi = ui.riichi;
  ui.sel = null; ui.riichi = false;
  send({ cmd: 'apply', a: { type: 'discard', id, riichi } });
}

function onAct(a, ds) {
  switch (a) {
    case 'title-start': titleSeen = true; ui.home = myName ? 'menu' : 'name'; return render();
    case 'home-back': ui.home = 'menu'; ui.afterName = null; return render();
    case 'go-join': ui.home = 'join'; return render();
    case 'go-name': ui.home = 'name'; ui.afterName = null; return render();
    case 'go-help': ui.home = 'help'; return render();
    case 'name-ok': {
      if (!myName) return toast('名前を入れてください');
      const next = ui.afterName;
      ui.afterName = null; ui.home = 'menu';
      if (next) return onAct(next, {});
      return render();
    }
    case 'create': if (needName('create')) return; ui.home = null; return createRoom(null);
    case 'resume': {
      let saved = null;
      try { saved = JSON.parse(store.get('mj.hostroom') || 'null'); } catch (e) { saved = null; }
      if (!saved || needName('resume')) return;
      ui.home = null;
      return createRoom(saved);
    }
    case 'join': return joinRoom((document.getElementById('code') || {}).value || '');
    case 'practice': ui.menu = false; if (role === 'home' && needName('practice')) return; return startPractice();
    case 'leave': ui.menu = false; return leaveRoom();
    case 'copy': {
      const link = ds.link;
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('コピーしました'), () => toast(link));
      else toast(link);
      return;
    }
    case 'menu': ui.menu = true; return render();
    case 'menu-close': ui.menu = false; return render();
    case 'import': { const f = document.getElementById(ds.src || 'packfiles'); if (f) f.click(); return; }
    case 'clear-pack': AV.pack = []; savePack(); toast('キャラ素材を消しました'); return render();
    case 'pick-own': {
      const i = +ds.i;
      setMine(i < 0 ? null : pickList[i]);
      return render();
    }
    case 'picker': ui.picker = true; return render();
    case 'picker-close': ui.picker = false; return render();
    case 'pick-room': {
      const i = +ds.i;
      const src = i < 0 ? null : pickList[i];
      setMine(src);
      ui.picker = false;
      send({ cmd: 'avatar', src });
      return render();
    }
    case 'full': return goFull();
    case 'fullhelp-close': ui.fullhelp = false; return render();
    case 'yaku': ui.yaku = true; return render();
    case 'yaku-close': ui.yaku = false; return render();
    case 'auto':
      auto[ds.k] = !auto[ds.k];
      store.set('mj.auto', JSON.stringify(auto));
      render(); scheduleAuto();
      return;
    case 'riichi': ui.riichi = true; ui.sel = null; return render();
    case 'riichi-cancel': ui.riichi = false; ui.sel = null; return render();
    case 'tsumo': return send({ cmd: 'apply', a: { type: 'tsumo' } });
    case 'kan': return send({ cmd: 'apply', a: { type: 'kan', kanType: ds.type, k: +ds.k } });
    case 'claim': {
      const op = S.claim.options[mySeat()][+ds.i];
      return send({ cmd: 'apply', a: { type: 'respond', resp: op.t === 'ron' ? { t: 'ron' } : op } });
    }
    case 'pass': return send({ cmd: 'apply', a: { type: 'respond', resp: { t: 'pass' } } });
    case 'ready': return send({ cmd: 'ready' });
    case 'next': return send({ cmd: 'next' });
    case 'togglebot': ui.menu = false; return send({ cmd: 'togglebot', seat: +ds.seat });
    case 'botseat': return send({ cmd: 'botseat', seat: +ds.seat });
    case 'clearseat': return send({ cmd: 'clearseat', seat: +ds.seat });
    case 'rule': return send({ cmd: 'rule', k: ds.k, v: ds.k === 'aka' ? ds.v === '1' : ds.v });
    case 'start': return send({ cmd: 'start' });
    case 'again': return send({ cmd: 'again' });
    case 'tolobby': ui.menu = false; return send({ cmd: 'tolobby' });
  }
}

render();
</script>
</body>
</html>
