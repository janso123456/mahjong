<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d2629">
<meta name="apple-mobile-web-app-title" content="社内麻雀卓">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>社内麻雀卓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=6">
<style>
[hidden] { display: none !important; }
body { margin: 0; padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--ivory); border: 0; border-radius: 10px;
  padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box;
}
input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.code { font-family: var(--f-disp); font-size: 52px; letter-spacing: .18em; line-height: 1; font-variant-numeric: tabular-nums; }
.codebox { background: var(--rail); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.join { display: flex; gap: 8px; }
.join input { flex: 1; letter-spacing: .2em; text-align: center; }
.join button { flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6fd39b; display: inline-block; flex: none; }
.dot.off { background: #ff9a85; }
.net { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.or { color: var(--muted); font-size: 12px; text-align: center; letter-spacing: .1em; }
/* 対局画面：画面全体が卓。奥行きを付けた卓面に河と点数箱、外周に相手の手牌と名札、下に自分の手牌 */
.tbl {
  /* 画面の幅・高さと端の余白。縦持ちのときは下で入れ替えて、横画面を90度回して表示する */
  --VW: 100vw;
  --VH: 100vh; --VH: 100dvh;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --htw: min(56px, calc((var(--VW) - var(--sl) - var(--sr) - 40px) / 15.6), calc(var(--VH) * .115));
  --handH: calc(var(--htw) * 1.36 + 14px + var(--sb));
  --planeH: calc(var(--VH) - var(--handH));
  touch-action: manipulation;
  --rtw: calc(var(--planeH) * .058);
  --rth: calc(var(--rtw) * 1.36);
  --rvW: calc(var(--rtw) * 6 + 5px);
  --rvH: calc(var(--rth) * 3 + 10px);
  --B: calc(var(--rvW) + 6px); /* 点数箱の幅＝河の幅にして、角で河どうしが重ならないように */
  --otw: min(18px, calc(var(--planeH) * .052));
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 50% 42%, #2f5a8c 0%, #23476f 45%, #17324f 100%);
}
.tbl::before { /* 卓の縁 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 10px #3a2618, inset 0 0 0 12px #5a3b22, inset 0 0 60px rgba(0, 0, 0, .45);
}
.plane { position: absolute; left: 0; right: 0; top: 0; height: var(--planeH); perspective: 1100px; }
.stage { position: absolute; inset: 0; transform: rotateX(17deg); transform-origin: 50% 70%; }
.stage::before { /* 卓面の対角線 */
  content: ""; position: absolute; left: 50%; top: 52%; width: calc(var(--B) + var(--rvH) * 2 + 40px); aspect-ratio: 1;
  transform: translate(-50%, -50%); border: 1px solid rgba(255, 255, 255, .09); border-radius: 6px;
  background: linear-gradient(45deg, transparent 49.8%, rgba(255,255,255,.07) 50%, transparent 50.2%), linear-gradient(-45deg, transparent 49.8%, rgba(255,255,255,.07) 50%, transparent 50.2%);
}
.pc { position: absolute; left: 50%; top: 52%; width: var(--B); height: var(--B); transform: translate(-50%, -50%); }
.cbox {
  position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(#2a2f36, #1a1e23);
  box-shadow: 0 0 0 2px #4b525c, 0 6px 14px rgba(0, 0, 0, .45); color: #e9eef5;
}
.cmid { position: absolute; inset: 26%; display: grid; place-content: center; text-align: center; border-radius: 6px; background: #12161a; box-shadow: inset 0 0 0 1px #3a414b; }
.crd { font-family: var(--f-disp); font-size: calc(var(--B) * .13); color: #8fd3ff; white-space: nowrap; }
.crest { font-size: calc(var(--B) * .1); color: #8fd3ff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cs { position: absolute; left: 50%; top: 50%; width: var(--B); display: flex; justify-content: center; align-items: center; gap: 4px;
  font-size: calc(var(--B) * .105); font-variant-numeric: tabular-nums; color: #f0c75e; }
.cs b { position: absolute; left: 4px; font-family: var(--f-disp); font-weight: 400; color: #cfd6df; font-size: calc(var(--B) * .12); }
.cs b.dealer { color: var(--hot); }
.cs .stick { position: absolute; top: -2px; }
.cs.turn::after { content: ""; position: absolute; bottom: -3px; left: 30%; right: 30%; height: 3px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.cs0 { transform: translate(-50%, calc(var(--B) * .5 - 100%)) ; padding-bottom: 4px; }
.cs2 { transform: translate(-50%, -50%) rotate(180deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs1 { transform: translate(-50%, -50%) rotate(-90deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs3 { transform: translate(-50%, -50%) rotate(90deg) translateY(calc(var(--B) * .5 - 50% - 4px)); }
.cs0 { transform: translate(-50%, -50%) translateY(calc(var(--B) * .5 - 50% - 4px)); padding-bottom: 0; }
.stick { display: inline-block; width: 22px; height: 4px; border-radius: 2px; background: var(--ivory); position: relative; vertical-align: middle; }
.stick::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--hot); transform: translate(-50%, -50%); }

.rv { --tw: var(--rtw); position: absolute; width: var(--rvW); height: var(--rvH); display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.rv .row { display: flex; gap: 1px; align-items: flex-end; white-space: nowrap; }
.rv0 { left: 50%; top: 100%; transform: translateX(-50%); }
.rv2 { left: 50%; bottom: 100%; transform: translateX(-50%) rotate(180deg); }
.rv1 { left: calc(100% + var(--rvH) / 2); top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
.rv3 { left: calc(var(--rvH) / -2); top: 50%; transform: translate(-50%, -50%) rotate(90deg); }

/* 相手の手牌（裏） */
.bk { display: inline-block; width: var(--otw); height: calc(var(--otw) * 1.36); border-radius: 3px; background: linear-gradient(#3a7bd0, var(--back)); box-shadow: inset 0 -3px 0 #fbfaf6, 0 1px 2px rgba(0,0,0,.4); }
.oh { position: absolute; display: flex; gap: 6px; align-items: center; }
.oh .bks { display: flex; gap: 1px; }
.oh .omelds { --tw: calc(var(--otw) * 1.05); display: flex; gap: 4px; }
.oh-top { top: 12px; left: 50%; transform: translateX(-50%); flex-direction: row-reverse; }
.oh-left, .oh-right { --otw: min(16px, calc(var(--planeH) * .046)); }
.oh-left { left: calc(var(--sl) + 80px); top: calc(var(--planeH) * .52); transform: translate(-50%, -50%) rotate(90deg); }
.oh-right { right: calc(var(--sr) + 80px); top: calc(var(--planeH) * .52); transform: translate(50%, -50%) rotate(-90deg); }

/* 名札 */
.plate { position: absolute; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px;
  background: rgba(10, 18, 28, .72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); max-width: 210px; z-index: 3; }
.plate.turn { box-shadow: inset 0 0 0 2px var(--gold), 0 0 12px rgba(242, 193, 78, .45); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff;
  background: linear-gradient(135deg, hsl(var(--hue) 55% 55%), hsl(calc(var(--hue) + 40) 55% 38%)); box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.pinfo { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.pn { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps { font-size: 12px; font-variant-numeric: tabular-nums; color: #f0c75e; display: flex; gap: 5px; }
.ps b { font-family: var(--f-disp); font-weight: 400; color: #cfd6df; }
.ps b.dealer { color: var(--hot); }
.ptags { display: flex; gap: 3px; margin-top: 2px; }
.pl-top { top: 8px; right: calc(50% + var(--otw) * 7.6 + 16px); }
.pl-left { left: calc(var(--sl) + 104px); top: calc(var(--planeH) * .3); }
.pl-right { right: calc(var(--sr) + 104px); top: calc(var(--planeH) * .3); flex-direction: row-reverse; padding: 4px 4px 4px 10px; }
.pl-right .pinfo { align-items: flex-end; }
.pl-me { left: calc(var(--sl) + 56px); bottom: calc(var(--handH) + 22px); }

/* 左上の情報・右上のボタン */
.info { position: absolute; top: 8px; left: calc(var(--sl) + 12px); z-index: 3; padding: 6px 8px; border-radius: 10px;
  background: rgba(10, 18, 28, .78); box-shadow: inset 0 0 0 1px rgba(242, 193, 78, .45); display: flex; flex-direction: column; gap: 4px; }
.info .dora { --tw: min(20px, calc(var(--planeH) * .06)); display: flex; gap: 2px; }
.info .cnt { display: flex; gap: 10px; font-size: 11px; color: #e9eef5; font-variant-numeric: tabular-nums; align-items: center; }
.info .cnt .stick { width: 16px; margin-right: 3px; }
.tops { position: absolute; top: 8px; right: calc(var(--sr) + 12px); display: flex; gap: 6px; z-index: 3; }
.tops button { background: rgba(10, 18, 28, .6); }

/* 左端の自動操作スイッチ */
.toggles { position: absolute; left: calc(var(--sl) + 12px); bottom: calc(var(--handH) + 50px); display: flex; flex-direction: column; gap: 4px; z-index: 3;
  padding: 4px; border-radius: 10px; background: rgba(10, 18, 28, .6); }
.tg { min-height: 0; width: 34px; height: 34px; padding: 0; border-radius: 8px; background: transparent; color: #9fb3c8; box-shadow: none; display: grid; place-items: center; }
.tg b { font-family: var(--f-disp); font-weight: 400; font-size: 17px; }
.tg span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tg.on { background: var(--gold); color: var(--ink); }

/* 自分の手牌と操作 */
.handrow { position: absolute; left: 0; right: 0; bottom: 0; height: var(--handH); display: flex; justify-content: center; align-items: flex-start;
  gap: 14px; padding-left: var(--sl); padding-right: var(--sr); z-index: 4; }
.handrow .hand { --tw: var(--htw); padding-top: 0; min-height: 0; gap: 1px; }
.handrow .hand .t.sel { transform: translateY(-14px); }
.mymelds { --tw: calc(var(--htw) * .7); display: flex; gap: 6px; align-self: flex-end; padding-bottom: calc(14px + var(--sb)); }
.acts { position: absolute; right: calc(var(--sr) + 16px); bottom: calc(var(--handH) + 10px); display: flex; gap: 8px; align-items: center; z-index: 5; flex-wrap: wrap; justify-content: flex-end; max-width: calc(var(--VW) * .6); }
.acts button { min-width: 76px; min-height: 46px; border-radius: 999px; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.acts button.ghost { background: rgba(10, 18, 28, .75); }
.acts .mini { --tw: 14px; display: inline-flex; vertical-align: middle; }
.acts .chiopt { --tw: 15px; }
.claimq { --tw: calc(var(--htw) * .8); display: inline-flex; margin-right: 4px; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--handH) + 12px); font-size: 12px; color: #d5dee8;
  background: rgba(10, 18, 28, .6); padding: 4px 10px; border-radius: 999px; z-index: 3; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.spect { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: #d5dee8; font-size: 13px; }

/* 対局中の結果・メニューは卓の中央に（卓と一緒に回る） */
.tbl .sheet-bg { position: absolute; align-items: center; }
.tbl .sheet { max-width: 720px; max-height: calc(var(--VH) * .92); border-radius: 18px; }

/* 縦持ち（画面の自動回転がオフのときなど）：横画面を90度回して全体に表示。iPhoneを左に倒して持つ */
@media (orientation: portrait) {
  .tbl {
    --VW: 100vh; --VW: 100dvh;
    --VH: 100vw;
    --sl: env(safe-area-inset-top, 0px);
    --sr: env(safe-area-inset-bottom, 0px);
    --sb: 0px;
    inset: auto; top: 0; left: 0;
    width: var(--VW); height: var(--VH);
    transform-origin: top left;
    transform: translateX(100vw) rotate(90deg);
  }
}

/* 全画面にできない端末（iPhone）向けの案内 */
.fullhelp ol { margin: 0; padding-left: 1.4em; line-height: 1.8; }
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="engine.js?v=6"></script>
<script src="tiles.js?v=6"></script>
<script>
'use strict';
const PREFIX = 'shanai-mj-7k2q-';      // PeerJSの公開サーバーで他と重ならないための接頭辞
const WN = MJ.WIND_NAMES;
const app = document.getElementById('app');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },
};
let myPid = store.get('mj.pid');
if (!myPid) { myPid = 'p' + Math.random().toString(36).slice(2, 12); store.set('mj.pid', myPid); }
let myName = store.get('mj.name') || '';

// role: home | host | client | local
let role = 'home';
let code = '';
let HS = null;          // 親機が持つ完全な状態
let S = null;           // 画面に出す状態（自分の手牌以外は伏せてある）
let peer = null, hostConn = null;
const conns = new Map(); // 親機: pid -> 接続
let net = 'ok';          // ok | connecting | lost
let leaving = false;
let ui = { sel: null, riichi: false, menu: false, yaku: false };
let botTimer = null, retryTimer = null, wakeLock = null, autoTimer = null;
// 左端のスイッチ：和＝自動で和了、鳴＝鳴きをすべてスキップ、切＝ツモ切り
let auto = { win: false, nocall: false, giri: false };
try { auto = Object.assign(auto, JSON.parse(store.get('mj.auto') || '{}')); } catch (e) { /* 初期値のまま */ }

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2800);
}

/* ---------- 親機：状態を持ち、操作を受け付け、各自に見せてよい分だけ送る ---------- */

function viewFor(full, seat) {
  const V = MJ.clone(full);
  if (V.phase === 'lobby' || V.phase === 'end') return V;
  V.wall = V.wall.map(() => 0);
  V.dead = V.dead.map((x, i) => (i >= 4 && i < 4 + V.doraCount ? x : null));
  V.players.forEach((p, i) => { if (i !== seat) p.hand = p.hand.map(() => null); });
  if (V.turn !== seat) V.drawn = null;
  if (V.claim) {
    const mine = V.claim.options[seat];
    V.claim.options = mine ? { [seat]: mine } : {};
    const r = V.claim.responses[seat];
    V.claim.responses = r ? { [seat]: r } : {};
  }
  return V;
}

function hostSeatOf(pid) { return HS.seats.findIndex((s) => s.uid === pid); }

function hostCommit() {
  HS.seq++;
  for (const [pid, c] of conns) {
    if (c.open) c.send({ t: 'state', S: viewFor(HS, hostSeatOf(pid)) });
  }
  if (role === 'host') store.set('mj.hostroom', JSON.stringify({ code, HS }));
  setView(viewFor(HS, hostSeatOf(myPid)));
  scheduleBots();
}

// 親機に届いた操作（親機自身の操作もここを通る）
function hostHandle(pid, msg) {
  const seat = hostSeatOf(pid);
  const isHost = pid === myPid;
  const lobbyOnly = () => { if (HS.phase !== 'lobby') throw new Error('対局中は変更できません'); };
  const hostOnly = () => { if (!isHost) throw new Error('親機の人だけが操作できます'); };
  switch (msg.cmd) {
    case 'apply': {
      if (seat < 0) throw new Error('席に座っていません');
      const a = Object.assign({}, msg.a, { seat });
      MJ.apply(HS, a);
      break;
    }
    case 'ready': {
      if (HS.phase !== 'result' || seat < 0) return;
      HS.ready = HS.ready || {};
      HS.ready[seat] = true;
      const humans = HS.seats.map((s, i) => (s.uid && !s.bot ? i : -1)).filter((i) => i >= 0);
      if (humans.every((i) => HS.ready[i])) MJ.apply(HS, { type: 'next' });
      break;
    }
    case 'next': if (HS.phase !== 'result') return; MJ.apply(HS, { type: 'next' }); break;
    case 'togglebot': {
      const t = HS.seats[msg.seat];
      if (!t || !t.uid) return;
      if (!isHost && msg.seat !== seat) throw new Error('ほかの人の代打ちは親機の人が切り替えます');
      t.bot = !t.bot;
      break;
    }
    case 'botseat': hostOnly(); lobbyOnly(); if (!HS.seats[msg.seat].uid) Object.assign(HS.seats[msg.seat], { bot: true, name: 'CPU ' + 'ABCD'[msg.seat] }); break;
    case 'clearseat': hostOnly(); lobbyOnly(); if (msg.seat !== hostSeatOf(myPid)) HS.seats[msg.seat] = { uid: null, bot: false, name: '' }; break;
    case 'rule': hostOnly(); lobbyOnly(); HS.rules[msg.k] = msg.v; break;
    case 'start':
      hostOnly(); lobbyOnly();
      if (!HS.seats.every((s) => s.uid || s.bot)) throw new Error('4席すべて埋めてください');
      MJ.startGame(HS);
      break;
    case 'again': hostOnly(); if (HS.phase !== 'end') return; HS.seats.forEach((s) => { if (s.uid) s.bot = false; }); MJ.startGame(HS); break;
    case 'tolobby': {
      hostOnly();
      const seats = HS.seats.map((s) => ({ uid: s.uid, bot: s.uid ? false : s.bot, name: s.name, online: s.online }));
      const fresh = MJ.newGame(HS.rules);
      fresh.seats = seats; fresh.seq = HS.seq; fresh.hostSeat = HS.hostSeat;
      HS = fresh;
      break;
    }
    default: return;
  }
  hostCommit();
}

function hostJoin(pid, name, conn) {
  let seat = hostSeatOf(pid);
  if (seat < 0) {
    if (HS.phase !== 'lobby') { conn.send({ t: 'err', msg: '対局中のため観戦で入ります' }); }
    else {
      seat = HS.seats.findIndex((s) => !s.uid && !s.bot);
      if (seat < 0) { conn.send({ t: 'err', msg: '満席です' }); }
      else HS.seats[seat] = { uid: pid, bot: false, name: '' };
    }
  }
  if (seat >= 0) { HS.seats[seat].name = (name || '').slice(0, 12) || '名無し'; HS.seats[seat].online = true; }
  conns.set(pid, conn);
  hostCommit();
}

// CPUの手番と、立直後のツモ切りは親機が進める
function scheduleBots() {
  clearTimeout(botTimer);
  if (!HS || !['turn', 'claim'].includes(HS.phase)) return;
  let a = MJ.pendingBotAction(HS);
  if (!a && HS.phase === 'turn') {
    const p = HS.players[HS.turn];
    if (p.riichi) {
      const o = MJ.turnOptions(HS, HS.turn);
      if (!o.tsumo && !o.kans.length) a = { type: 'discard', seat: HS.turn, id: HS.drawn };
    }
  }
  if (!a) return;
  const seq = HS.seq;
  botTimer = setTimeout(() => {
    if (HS.seq !== seq) return;
    try { MJ.apply(HS, MJ.pendingBotAction(HS) || a); hostCommit(); } catch (e) { console.error(e); }
  }, 750);
}

/* ---------- 通信 ---------- */

function newCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

function createRoom(resume) {
  if (!myName) return toast('名前を入れてください');
  role = 'host'; leaving = false;
  if (resume) { code = resume.code; HS = resume.HS; }
  else {
    code = newCode();
    HS = MJ.newGame({ length: 'hanchan', aka: true });
    HS.seats[0] = { uid: myPid, bot: false, name: myName, online: true };
  }
  const me = hostSeatOf(myPid);
  if (me >= 0) HS.seats[me].name = myName;
  HS.hostSeat = me;
  HS.seats.forEach((s) => { if (s.uid && s.uid !== myPid) s.online = false; });
  openHostPeer(0, !!resume);
  hostCommit();
  history.replaceState(null, '', '?room=' + code);
}

function openHostPeer(tries, resuming) {
  net = 'connecting'; render();
  peer = new Peer(PREFIX + code);
  peer.on('open', () => { net = 'ok'; render(); });
  peer.on('connection', (c) => {
    c.on('data', (msg) => {
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'hello') return hostJoin(String(msg.pid), String(msg.name || ''), c);
      const pid = [...conns].find(([, x]) => x === c);
      if (!pid) return;
      try { hostHandle(pid[0], msg); } catch (e) { c.send({ t: 'err', msg: e.message }); }
    });
    c.on('close', () => {
      for (const [pid, x] of conns) if (x === c) {
        conns.delete(pid);
        const s = hostSeatOf(pid);
        if (s >= 0) { HS.seats[s].online = false; hostCommit(); }
      }
    });
  });
  peer.on('disconnected', () => { if (!leaving) { net = 'connecting'; render(); setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); } });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') {
      peer.destroy();
      // 再開時は前の接続がサーバーに残っていることがあるので待つ。新規なら番号を変える
      if (!resuming) { code = newCode(); history.replaceState(null, '', '?room=' + code); render(); }
      if (tries < 10) setTimeout(() => openHostPeer(tries + 1, resuming), resuming ? 3000 : 200);
      else { net = 'lost'; render(); toast('部屋を開けませんでした。ページを開き直してください'); }
      return;
    }
    if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { net = 'lost'; render(); }
  });
}

function joinRoom(c) {
  if (!myName) return toast('名前を入れてください');
  if (!/^\d{4}$/.test(c)) return toast('部屋番号は4桁の数字です');
  role = 'client'; code = c; leaving = false; S = null;
  history.replaceState(null, '', '?room=' + code);
  net = 'connecting'; render();
  peer = new Peer();
  peer.on('open', connectHost);
  peer.on('disconnected', () => { if (!leaving) setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); });
  peer.on('error', (e) => {
    if (e.type === 'peer-unavailable') { net = 'lost'; render(); retry(4000); return; }
    if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { net = 'lost'; render(); }
  });
}

function connectHost() {
  if (leaving || !peer || peer.destroyed) return;
  if (peer.disconnected) { peer.reconnect(); retry(2000); return; }
  net = S ? 'connecting' : net; render();
  const c = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
  hostConn = c;
  c.on('open', () => { net = 'ok'; c.send({ t: 'hello', pid: myPid, name: myName }); render(); });
  c.on('data', (msg) => {
    if (msg.t === 'state') setView(msg.S);
    if (msg.t === 'err') toast(msg.msg);
  });
  c.on('close', () => { if (hostConn === c && !leaving) { net = 'lost'; render(); retry(2000); } });
}

function retry(ms) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (role === 'client' && !leaving && !(hostConn && hostConn.open)) connectHost(); }, ms);
}

function send(msg) {
  if (role === 'host' || role === 'local') {
    try { hostHandle(myPid, msg); } catch (e) { toast(e.message); }
  } else if (hostConn && hostConn.open) hostConn.send(msg);
  else toast('親機とつながっていません。再接続を待ってください');
}

function leaveRoom() {
  leaving = true;
  clearTimeout(botTimer); clearTimeout(retryTimer);
  if (peer) { try { peer.destroy(); } catch (e) { /* 閉じるだけ */ } }
  peer = null; hostConn = null; conns.clear();
  if (role === 'host') store.del('mj.hostroom');
  role = 'home'; S = null; HS = null; ui = { sel: null, riichi: false, menu: false };
  history.replaceState(null, '', location.pathname);
  render();
}

function startPractice() {
  role = 'local'; leaving = false;
  HS = MJ.newGame({ length: 'tonpu', aka: true });
  HS.seats = [{ uid: myPid, bot: false, name: myName || 'あなた' }, { uid: null, bot: true, name: 'CPU A' }, { uid: null, bot: true, name: 'CPU B' }, { uid: null, bot: true, name: 'CPU C' }];
  MJ.startGame(HS);
  hostCommit();
}

// iPhoneが眠らないように（対応していない端末では何もしない）
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* 拒否されても続ける */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (role === 'host' || role === 'client') keepAwake();
  if (peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  if (role === 'client' && !(hostConn && hostConn.open)) retry(300);
});

let lastSeq = -1;
function setView(v) {
  S = v;
  if (S && S.seq !== lastSeq) { lastSeq = S.seq; ui.sel = null; ui.riichi = false; }
  if (S && S.phase !== 'lobby') keepAwake();
  render();
  scheduleAuto();
}

function scheduleAuto() {
  clearTimeout(autoTimer);
  const me = mySeat();
  if (!S || me < 0 || S.seats[me].bot) return;
  let msg = null;
  if (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]) {
    const opts = S.claim.options[me];
    if (auto.win && opts.some((o) => o.t === 'ron')) msg = { t: 'ron' };
    else if (auto.nocall && !opts.some((o) => o.t === 'ron')) msg = { t: 'pass' };
    if (msg) msg = { cmd: 'apply', a: { type: 'respond', resp: msg } };
  } else if (S.phase === 'turn' && S.turn === me && !S.players[me].riichi) {
    const o = MJ.turnOptions(S, me);
    if (auto.win && o.tsumo) msg = { cmd: 'apply', a: { type: 'tsumo' } };
    else if (auto.giri && S.drawn !== null && !o.tsumo) msg = { cmd: 'apply', a: { type: 'discard', id: S.drawn } };
  }
  if (!msg) return;
  const seq = S.seq;
  autoTimer = setTimeout(() => { if (S && S.seq === seq) send(msg); }, 600);
}

// Android・パソコンは全画面＋横向き固定。iPhoneのSafariはページから全画面にできないので、ホーム画面への追加を案内する
async function goFull() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else throw new Error('unsupported');

  try { await screen.orientation.lock('landscape'); } catch (e) { /* 固定できない端末はそのまま */ }
}

// 牌の絵柄は tiles.js が描いた背景画像（クラス f<種類>、赤5は f<種類>r）
const TILE_NAMES = [...'一二三四五六七八九'].map((c) => c + '萬').concat([...'一二三四五六七八九'].map((c) => c + '筒'), [...'一二三四五六七八九'].map((c) => c + '索'), [...'東南西北白發中']);
function tile(id, cls) {
  cls = cls || '';
  if (id === null || id === undefined) return `<span class="t back ${cls}"></span>`;
  const k = id >> 2;
  const red = S && S.rules.aka && MJ.RED_IDS.includes(id);
  return `<span class="t f${k}${red ? 'r' : ''} ${cls}" data-id="${id}" role="img" aria-label="${red ? '赤' : ''}${TILE_NAMES[k]}"></span>`;
}

function meldHTML(m, owner) {
  const rel = (m.from - owner + 4) % 4;
  if (m.type === 'ankan') return `<span class="meld">${tile(null, 'sm')}${tile(m.tiles[1], 'sm')}${tile(m.tiles[2], 'sm')}${tile(null, 'sm')}</span>`;
  const others = m.tiles.filter((x) => x !== m.called && x !== m.added);
  const sideIdx = rel === 3 ? 0 : rel === 2 ? 1 : others.length;
  const parts = others.map((x) => tile(x, 'sm'));
  parts.splice(Math.min(sideIdx, parts.length), 0, tile(m.called, 'sm side'));
  if (m.added !== undefined) parts.push(tile(m.added, 'sm side'));
  return `<span class="meld">${parts.join('')}</span>`;
}

function riverHTML(seat) {
  const p = S.players[seat];
  const rows = [p.river.slice(0, 6), p.river.slice(6, 12), p.river.slice(12)];
  const last = S.lastDiscard && S.lastDiscard.seat === seat && S.phase === 'claim';
  return rows.map((row, ri) => `<div class="row">${row.map((r, i) => {
    const isLast = last && ri * 6 + i === p.river.length - 1;
    return tile(r.id, 'sm' + (r.riichi ? ' side' : '') + (r.called ? ' dim' : '') + (isLast ? ' hl' : ''));
  }).join('')}</div>`).join('');
}

function mineHTML(me) {
  const p = S.players[me];
  const st = S.seats[me];
  const myTurn = S.phase === 'turn' && S.turn === me && !st.bot;
  const o = myTurn ? MJ.turnOptions(S, me) : null;
  let hand = p.hand.slice();
  let drawn = null;
  if (S.phase === 'turn' && S.turn === me && S.drawn !== null) { drawn = S.drawn; hand = hand.filter((x) => x !== drawn); }
  hand.sort((a, b) => a - b);
  const allowed = o ? (ui.riichi ? o.discardable.filter((id) => o.riichi.includes(id >> 2)) : o.discardable) : [];
  const tcls = (id) => {
    if (!myTurn) return '';
    let c = allowed.includes(id) ? (ui.riichi ? 'ok' : '') : 'no';
    if (ui.sel === id) c += ' sel';
    return c;
  };
  const tiles = hand.map((id) => tile(id, tcls(id))).join('') + (drawn !== null ? tile(drawn, 'drawn ' + tcls(drawn)) : '');

  let btns = '', hint = '';
  if (st.bot) {
    hint = 'CPUが代わりに打っています';
    btns = `<button class="gold" data-act="togglebot" data-seat="${me}">自分で打つ</button>`;
  } else if (S.phase === 'claim' && S.claim.options[me] && !S.claim.responses[me]) {
    btns = claimHTML(me);
  } else if (myTurn) {
    if (o.tsumo) btns += `<button class="hot" data-act="tsumo">ツモ</button>`;
    if (o.riichi.length && !ui.riichi && !p.riichi) btns += `<button class="gold" data-act="riichi">リーチ</button>`;
    if (ui.riichi) btns += `<button class="ghost" data-act="riichi-cancel">リーチをやめる</button>`;
    for (const k of o.kans) btns += `<button data-act="kan" data-type="${k.type}" data-k="${k.k}">カン <span class="mini">${tile(k.k * 4 + 1, 'sm')}</span></button>`;
    hint = ui.riichi ? 'リーチで切る牌を選んでください' : p.riichi ? 'ツモ切りします…' : ui.sel !== null ? 'もう一度タップで切ります' : '切る牌をタップ';
  } else if (S.phase === 'claim') {
    hint = 'ほかの人の選択を待っています';
  }
  const furiten = p.riichi && MJ.isFuriten(p) ? '<span class="tag cpu">フリテン</span>' : '';
  return `${hint || furiten ? `<div class="hint">${furiten}${esc(hint)}</div>` : ''}
    <div class="acts">${btns}</div>
    <div class="handrow"><div class="hand ${myTurn ? '' : 'wait'}">${tiles}</div>
      <div class="mymelds">${p.melds.map((m) => meldHTML(m, me)).join('')}</div></div>`;
}

function claimHTML(me) {
  const cl = S.claim;
  const btns = cl.options[me].map((op, i) => {
    if (op.t === 'ron') return `<button class="hot" data-act="claim" data-i="${i}">ロン</button>`;
    if (op.t === 'pon') return `<button data-act="claim" data-i="${i}">ポン</button>`;
    if (op.t === 'kan') return `<button data-act="claim" data-i="${i}">カン</button>`;
    return `<button data-act="claim" data-i="${i}">チー<span class="chiopt">${op.tiles.map((x) => tile(x, 'sm')).join('')}</span></button>`;
  }).join('');
  return `<span class="claimq" title="${esc(nameOf(cl.from))}が${cl.kind === 'chankan' ? '加槓' : '捨てた'}牌">${tile(cl.tile)}</span>${btns}<button class="ghost" data-act="pass">スキップ</button>`;
}

function sheetHTML() {
  if (ui.menu) return menuHTML();
  if (ui.yaku) return yakuHTML();
  if (ui.fullhelp) return fullHelpHTML();
  if (S.phase === 'result') return resultHTML();
  if (S.phase === 'end') return endHTML();
  return '';
}

function menuHTML() {
  const me = mySeat();
  let rows = '';
  if (role !== 'local') {
    rows = S.seats.map((s, i) => {
      if (!s.uid || (role !== 'host' && i !== me)) return '';
      const isMe = i === me;
      const label = s.bot ? (isMe ? '自分で打つ' : '本人に戻す') : (isMe ? 'CPUに代打ちしてもらう' : 'CPUに代打ちさせる');
      return `<div style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(nameOf(i))}${s.bot ? '（CPU代打ち中）' : ''}</span><button class="small" data-act="togglebot" data-seat="${i}">${label}</button></div>`;
    }).join('');
    rows = `<h3>代打ち</h3><p class="muted">席を離れる人や接続が切れた人の番は、CPUに任せられます。${role === 'host' ? '' : 'ほかの人の席は親機の人が切り替えます。'}</p>${rows}`;
  }
  let quit;
  if (role === 'host') quit = `<h3>対局をやめる</h3><p class="muted">全員の対局が終わり、ロビーに戻ります。</p><div class="btnrow"><button class="hot" data-act="tolobby">対局をやめる</button><button data-act="menu-close">閉じる</button></div>`;
  else if (role === 'local') quit = `<div class="btnrow"><button class="hot" data-act="leave">練習をやめる</button><button data-act="menu-close">閉じる</button></div>`;
  else quit = `<h3>部屋から出る</h3><p class="muted">同じ部屋番号でまた参加すれば、自分の席に戻れます。</p><div class="btnrow"><button class="hot" data-act="leave">部屋から出る</button><button data-act="menu-close">閉じる</button></div>`;
  return `<div class="sheet-bg" data-act="menu-close"><div class="sheet" data-stop="1"><h2>メニュー</h2>${rows}${quit}</div></div>`;
}

function handBlock(hand, melds, owner, winTile) {
  const h = hand.slice();
  if (winTile !== undefined) h.splice(h.indexOf(winTile), 1);
  h.sort((a, b) => a - b);
  return `<div class="winhand">${h.map((x) => tile(x)).join('')}${winTile !== undefined ? '<span class="gap"></span>' + tile(winTile, 'hl') : ''}${melds.length ? '<span class="gap"></span>' : ''}${melds.map((m) => meldHTML(m, owner)).join('<span class="gap"></span>')}</div>`;
}

function resultHTML() {
  const R = S.result;
  const me = mySeat();
  let body;
  if (R.type === 'draw') {
    body = `<h2>流局</h2>` + [0, 1, 2, 3].map((s) => `<div><h3>${esc(nameOf(s))} — ${R.tenpai[s] ? 'テンパイ' : 'ノーテン'}</h3>${R.hands[s] ? handBlock(R.hands[s], S.players[s].melds, s) : ''}</div>`).join('');
  } else {
    body = R.wins.map((w) => {
      const sc = w.score;
      const how = R.type === 'tsumo' ? 'ツモ' : `ロン ← ${esc(nameOf(w.from))}`;
      const head = sc.yakuman ? sc.limit : `${sc.fu}符 ${sc.han}翻${sc.limit ? ' ' + sc.limit : ''}`;
      return `<div style="display:flex;flex-direction:column;gap:10px">
        <h2>${esc(nameOf(w.seat))} ${how}</h2>
        ${handBlock(w.hand, w.melds, w.seat, w.tile)}
        <div class="yaku">${sc.yaku.map((y) => `<span>${esc(y.name)}</span><span>${typeof y.han === 'number' ? y.han + '翻' : y.han}</span>`).join('')}</div>
        <div class="big">${head}　${sc.total.toLocaleString()}点</div></div>`;
    }).join('');
    body += `<div class="dora" style="--tw:22px;gap:3px">ドラ表示 ${R.doraInd.map((x) => tile(x, 'sm')).join('')}${R.wins.some((w) => w.ura) ? '　裏 ' + R.uraInd.map((x) => tile(x, 'sm')).join('') : ''}</div>`;
  }
  const deltas = `<div class="deltas">${[0, 1, 2, 3].map((s) => {
    const dv = R.delta[s];
    return `<span class="wind">${WN[MJ.seatWind(S, s) - 27]}</span><span>${esc(nameOf(s))}</span><span class="${dv > 0 ? 'plus' : dv < 0 ? 'minus' : ''}">${dv > 0 ? '+' : ''}${dv ? dv.toLocaleString() : '±0'}</span><span>${S.scores[s].toLocaleString()}</span>`;
  }).join('')}</div>`;
  let btn;
  if (role === 'local') btn = `<button class="gold" data-act="next">次の局へ</button>`;
  else {
    const humans = S.seats.map((s, i) => (s.uid && !s.bot ? i : -1)).filter((i) => i >= 0);
    const ready = S.ready || {};
    const waiting = humans.filter((i) => !ready[i]);
    const iReady = me >= 0 && ready[me];
    btn = me >= 0 && !iReady ? `<button class="gold" data-act="ready">OK（次の局へ）</button>` : '';
    if (waiting.length && (iReady || me < 0)) {
      btn += `<p class="muted">待っています：${waiting.map((i) => esc(nameOf(i))).join('、')}</p>`;
      if (role === 'host') btn += `<button class="ghost" data-act="next">待たずに次の局へ</button>`;
    }
  }
  return `<div class="sheet-bg"><div class="sheet"><div class="muted">${esc(R.label)}</div>${body}<h3>点数の移動</h3>${deltas}<div class="btnrow" style="flex-direction:column">${btn}</div></div></div>`;
}

function endHTML() {
  const F = S.final;
  const rows = F.order.map((s, r) => `<span class="big">${r + 1}位</span><span>${esc(nameOf(s))}</span><span>${S.scores[s].toLocaleString()}</span><span class="${F.pts[s] > 0 ? 'plus' : 'minus'}">${F.pts[s] > 0 ? '+' : ''}${F.pts[s].toFixed(1)}</span>`).join('');
  const btns = role === 'host' ? `<button class="gold" data-act="again">同じ席でもう一局</button><button data-act="tolobby">ロビーへ</button>`
    : role === 'local' ? `<button class="gold" data-act="practice">もう一局</button><button data-act="leave">終わる</button>`
    : `<p class="muted">親機の人が次の対局を始めるのを待っています。</p>`;
  return `<div class="sheet-bg"><div class="sheet"><h2>対局終了</h2>
    <div class="deltas">${rows}</div>
    <p class="muted">右端は30000点返し・ウマ10-20で計算したポイントです。</p>
    <div class="btnrow">${btns}</div></div></div>`;
}

/* ---------- 操作 ---------- */

app.addEventListener('input', (e) => {
  if (e.target.id === 'name') { myName = e.target.value.trim().slice(0, 12); store.set('mj.name', myName); }
  if (e.target.id === 'code') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
});

app.addEventListener('click', (e) => {
  const tEl = e.target.closest('.hand .t');
  if (tEl) return onTile(+tEl.dataset.id);
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && e.target.closest('[data-stop]')) return;
  onAct(el.dataset.act, el.dataset);
});

function onTile(id) {
  const me = mySeat();
  if (me < 0 || !S || S.phase !== 'turn' || S.turn !== me || S.seats[me].bot || S.players[me].riichi) return;
  const o = MJ.turnOptions(S, me);
  const allowed = ui.riichi ? o.discardable.filter((x) => o.riichi.includes(x >> 2)) : o.discardable;
  if (!allowed.includes(id)) return;
  if (ui.sel !== id) { ui.sel = id; render(); return; }
  const riichi = ui.riichi;
  ui.sel = null; ui.riichi = false;
  send({ cmd: 'apply', a: { type: 'discard', id, riichi } });
}

function onAct(a, ds) {
  switch (a) {
    case 'create': return createRoom(null);
    case 'resume': {
      let saved = null;
      try { saved = JSON.parse(store.get('mj.hostroom') || 'null'); } catch (e) { saved = null; }
      if (!saved) return;
      if (!myName) return toast('名前を入れてください');
      return createRoom(saved);
    }
    case 'join': return joinRoom((document.getElementById('code') || {}).value || '');
    case 'practice': ui.menu = false; return startPractice();
    case 'leave': ui.menu = false; return leaveRoom();
    case 'copy': {
      const link = ds.link;
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('コピーしました'), () => toast(link));
      else toast(link);
      return;
    }
    case 'menu': ui.menu = true; return render();
    case 'menu-close': ui.menu = false; return render();
    case 'full': return goFull();
    case 'fullhelp-close': ui.fullhelp = false; return render();
    case 'yaku': ui.yaku = true; return render();
    case 'yaku-close': ui.yaku = false; return render();
    case 'auto':
      auto[ds.k] = !auto[ds.k];
      store.set('mj.auto', JSON.stringify(auto));
      render(); scheduleAuto();
      return;
    case 'riichi': ui.riichi = true; ui.sel = null; return render();
    case 'riichi-cancel': ui.riichi = false; ui.sel = null; return render();
    case 'tsumo': return send({ cmd: 'apply', a: { type: 'tsumo' } });
    case 'kan': return send({ cmd: 'apply', a: { type: 'kan', kanType: ds.type, k: +ds.k } });
    case 'claim': {
      const op = S.claim.options[mySeat()][+ds.i];
      return send({ cmd: 'apply', a: { type: 'respond', resp: op.t === 'ron' ? { t: 'ron' } : op } });
    }
    case 'pass': return send({ cmd: 'apply', a: { type: 'respond', resp: { t: 'pass' } } });
    case 'ready': return send({ cmd: 'ready' });
    case 'next': return send({ cmd: 'next' });
    case 'togglebot': ui.menu = false; return send({ cmd: 'togglebot', seat: +ds.seat });
    case 'botseat': return send({ cmd: 'botseat', seat: +ds.seat });
    case 'clearseat': return send({ cmd: 'clearseat', seat: +ds.seat });
    case 'rule': return send({ cmd: 'rule', k: ds.k, v: ds.k === 'aka' ? ds.v === '1' : ds.v });
    case 'start': return send({ cmd: 'start' });
    case 'again': return send({ cmd: 'again' });
    case 'tolobby': ui.menu = false; return send({ cmd: 'tolobby' });
  }
}

render();
</script>
</body>
</html>
